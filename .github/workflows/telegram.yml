name: Telegram - Post on article push

on:
  push:
    paths:
      - "articles/**"
  workflow_dispatch:

jobs:
  telegram-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install requests

      - name: Show commit & changed files (debug)
        run: |
          echo "COMMIT: ${{ github.sha }}"
          git --no-pager show --name-only --pretty="" ${{ github.sha }} | sed -n '1,200p' || true

      - name: Process changed article JSONs and post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          set -euo pipefail

          # Determine previous commit (safe fallback to github.event.before)
          PREV_COMMIT="${{ github.event.before || '' }}"
          CUR_COMMIT="${{ github.sha }}"

          if [ -n "$PREV_COMMIT" ]; then
            CHANGED=$(git diff --name-only "$PREV_COMMIT" "$CUR_COMMIT" 2>/dev/null | grep '^articles/.*\.json$' || true)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^articles/.*\.json$' || true)
          fi

          if [ -z "$CHANGED" ]; then
            # Fallback for manual runs: process all JSONs under articles/
            CHANGED=$(ls -1 articles/*.json 2>/dev/null || true)
          fi

          if [ -z "$CHANGED" ]; then
            echo "No article JSON files found under articles/ - nothing to do."
            exit 0
          fi

          echo "Files to process:"
          echo "$CHANGED"

          # iterate over each changed file
          while IFS= read -r jf || [ -n "$jf" ]; do
            jf_trimmed="$(echo "$jf" | tr -d '\r')"
            [ -z "$jf_trimmed" ] && continue
            if [ ! -f "$jf_trimmed" ]; then
              echo "Warning: $jf_trimmed does not exist in workspace - skipping."
              continue
            fi
            echo "---- Processing $jf_trimmed ----"

            # Python check: ensure any non-http images exist locally; if missing, skip this file
            python3 - <<'PY'
import sys, json
from pathlib import Path
jf = sys.argv[1]
try:
    data = json.load(open(jf, encoding='utf-8'))
except Exception as e:
    print("JSON_READ_ERROR", e)
    sys.exit(2)
imgs = data.get('images') or data.get('cover_image') or data.get('cover_images') or []
missing = []
for im in imgs:
    if not isinstance(im, str):
        continue
    s = im.strip()
    if not s:
        continue
    low = s.lower()
    if low.startswith('http://') or low.startswith('https://') or s.startswith('//'):
        continue
    p = Path(s.lstrip('/'))
    if not p.exists():
        missing.append(s)
if missing:
    print("MISSING_IMAGES", missing)
    sys.exit(3)
print("ALL_IMAGES_PRESENT")
PY
            RC=$? || true
            if [ $RC -ne 0 ]; then
              echo "Image validation failed for $jf_trimmed — ensure local images are committed or use absolute URLs. Skipping this file."
              continue
            fi

            echo "Posting $jf_trimmed to Telegram..."
            python3 scripts/send_telegram.py "$jf_trimmed"
            POST_RC=$? || true
            if [ $POST_RC -ne 0 ]; then
              echo "Telegram post failed for $jf_trimmed (exit $POST_RC). Continuing to next file."
              continue
            fi
            echo "Posted $jf_trimmed successfully."

          done <<< "$CHANGED"

          echo "All done."
