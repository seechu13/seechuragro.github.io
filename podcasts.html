<div id="navbar-placeholder"></div>
<script>
(function loadNavbar(){
  fetch('navbar.html',{cache:'no-cache'})
    .then(r=>r.text())
    .then(html=>{
      const host=document.getElementById('navbar-placeholder');
      host.innerHTML=html;
      host.querySelectorAll('script').forEach(oldS=>{
        const s=document.createElement('script');
        oldS.src ? s.src=oldS.src : s.textContent=oldS.textContent;
        document.body.appendChild(s);
      });
    });
})();
</script>
