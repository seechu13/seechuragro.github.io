name: Post article to Telegram (staging)

on:
  push:
    branches: [staging]
    paths:
      - "articles/**"
      - "articles.json"
      - "content/articles/**"
      - "assets/**"
      - "images/**"

env:
  SITE_URL: https://seechuragro.in

jobs:
  telegram:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed article JSON
        id: detect
        run: |
          BEFORE="${GITHUB_EVENT_BEFORE}"
          AFTER="${GITHUB_SHA}"

          if [ -n "$BEFORE" ]; then
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" || true)
          else
            if git rev-parse "${AFTER}^" >/dev/null 2>&1; then
              CHANGED=$(git diff --name-only "${AFTER}^" "$AFTER" || true)
            else
              CHANGED=$(git ls-tree -r --name-only "$AFTER" || true)
            fi
          fi

          echo "$CHANGED"

          FILE=$(echo "$CHANGED" | grep -E '(^articles/.*\.json$|^content/articles/.*\.json$|^articles.json$)' | head -n1 || true)

          if [ -z "$FILE" ]; then
            echo "no=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Install jq
        if: steps.detect.outputs.no != 'true'
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Parse json & build caption (auto-resolve image path)
        id: prep
        if: steps.detect.outputs.no != 'true'
        run: |
          F="${{ steps.detect.outputs.file }}"

          TITLE=$(jq -r '.title // ""' "$F")
          EXCERPT=$(jq -r '.excerpt // .summary // .description // ""' "$F")
          IMAGE_FIELD=$(jq -r '.cover_image // .image // .hero_image // .thumbnail // ""' "$F")
          URL=$(jq -r '.url // ""' "$F")

          [ -z "$URL" ] && URL="${SITE_URL%/}/$(basename "$F" .json).html"

          IMAGE_FIELD="${IMAGE_FIELD#./}"

          RESOLVED_LOCAL=""
          RESOLVED_URL=""

          if [ -z "$IMAGE_FIELD" ]; then
            BASE=$(basename "$F" .json)
            for try in "assets/articles/${BASE}.jpg" "assets/articles/${BASE}.jpeg" "assets/articles/${BASE}.png" "assets/articles/${BASE}.webp" "assets/${BASE}.jpg" "images/${BASE}.jpg" "images/uploads/${BASE}.jpg"; do
              if [ -f "${GITHUB_WORKSPACE}/${try}" ]; then
                RESOLVED_LOCAL="${try}"
                break
              fi
            done
          fi

          if [ -n "$IMAGE_FIELD" ]; then
            if [[ "$IMAGE_FIELD" =~ ^https?:// ]]; then
              RESOLVED_URL="$IMAGE_FIELD"
            else
              if [ -f "${GITHUB_WORKSPACE}/${IMAGE_FIELD}" ]; then
                RESOLVED_LOCAL="${IMAGE_FIELD}"
              else
                for prefix in "assets/articles" "assets" "images" "images/uploads" ""; do
                  if [ -n "$prefix" ]; then
                    candidate="${prefix}/${IMAGE_FIELD}"
                  else
                    candidate="${IMAGE_FIELD}"
                  fi
                  if [ -f "${GITHUB_WORKSPACE}/${candidate}" ]; then
                    RESOLVED_LOCAL="${candidate}"
                    break
                  fi
                done
                if [ -z "$RESOLVED_LOCAL" ]; then
                  RESOLVED_URL="${SITE_URL%/}/${IMAGE_FIELD}"
                fi
              fi
            fi
          fi

          if [ -n "$RESOLVED_LOCAL" ]; then
            RESOLVED_URL="${SITE_URL%/}/${RESOLVED_LOCAL#./}"
          fi

          TITLE_ESC=$(echo "$TITLE" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          EXCERPT_ESC=$(echo "$EXCERPT" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          CAPTION="<b>$TITLE_ESC</b>"
          [ -n "$EXCERPT_ESC" ] && CAPTION="$CAPTION\n<i>$EXCERPT_ESC</i>"
          CAPTION="$CAPTION\n$URL"

          echo "caption<<EOF" >> $GITHUB_OUTPUT
          echo "$CAPTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "img=${RESOLVED_LOCAL}" >> $GITHUB_OUTPUT
          echo "img_url=${RESOLVED_URL}" >> $GITHUB_OUTPUT

      - name: Debug prepared variables
        if: steps.detect.outputs.no != 'true'
        run: |
          echo "ARTICLE_FILE: ${{ steps.detect.outputs.file }}"
          echo "CAPTION (preview):"
          printf "%s\n" "${{ steps.prep.outputs.caption }}" | sed -n '1,6p'
          echo
          echo "RESOLVED LOCAL IMAGE: '${{ steps.prep.outputs.img }}'"
          echo "RESOLVED IMAGE_URL: '${{ steps.prep.outputs.img_url }}'"

      - name: Telegram send (local upload preferred, plain text caption)
        if: steps.detect.outputs.no != 'true'
        run: |
          CAPTION_RAW="${{ steps.prep.outputs.caption }}"
          IMG_RAW="${{ steps.prep.outputs.img }}"
          IMG_URL="${{ steps.prep.outputs.img_url }}"
          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          POSTED=0

          # plain-text caption: strip HTML tags (we keep distinct newlines)
          CAP_PLAIN=$(printf "%s\n" "$CAPTION_RAW" | sed 's/<[^>]*>//g')

          echo "Caption preview (plain text):"
          printf "%s\n" "$CAP_PLAIN" | sed -n '1,6p'

          # 1) prefer local repo upload when image path is repo-relative
          if [ -n "$IMG_RAW" ] && [[ "$IMG_RAW" != http* ]]; then
            LOCAL_PATH="${GITHUB_WORKSPACE}/${IMG_RAW#./}"
            if [ -f "$LOCAL_PATH" ]; then
              echo "Found local image at $LOCAL_PATH - attempting upload"
              curl -s -S -X POST "$API/sendPhoto" \
                -F chat_id="${TELEGRAM_CHAT_ID}" \
                -F photo=@"${LOCAL_PATH}" \
                --data-urlencode "caption=${CAP_PLAIN}" \
                -o resp.json
              rc=$?
              if [ $rc -eq 0 ]; then POSTED=1; else echo "::warning::local upload rc=$rc"; fi
            else
              echo "Local image not found at $LOCAL_PATH - will try URL/download"
              [ -n "$IMG_URL" ] || IMG_URL="${SITE_URL%/}/${IMG_RAW#./}"
            fi
          fi

          # 2) Try URL (with retries)
          if [ $POSTED -eq 0 ] && [ -n "${IMG_URL:-}" ]; then
            echo "Trying IMG_URL: $IMG_URL"
            MAX_TRIES=30
            SLEEP=3
            i=0
            ok=0
            while [ $i -lt $MAX_TRIES ]; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$IMG_URL" || echo "000")
              echo "try $i -> HTTP $code"
              [ "$code" = "200" ] && ok=1 && break
              sleep $SLEEP
              i=$((i+1))
            done
            if [ $ok -eq 1 ]; then
              echo "Sending photo via IMG_URL..."
              curl -s -S -X POST "$API/sendPhoto" \
                -F chat_id="${TELEGRAM_CHAT_ID}" \
                -F photo="$IMG_URL" \
                --data-urlencode "caption=${CAP_PLAIN}" \
                -o resp.json
              rc=$?
              if [ $rc -eq 0 ]; then POSTED=1; else echo "::warning::sendPhoto via URL rc=$rc"; fi
            else
              echo "::warning::IMG_URL not available after wait"
            fi
          fi

          # 3) Download then upload
          if [ $POSTED -eq 0 ] && [ -n "${IMG_URL:-}" ]; then
            TMP="/tmp/article_img_$(date +%s).img"
            echo "Downloading $IMG_URL to $TMP"
            if curl -s -L -f -o "$TMP" "$IMG_URL"; then
              echo "Downloaded - uploading"
              curl -s -S -X POST "$API/sendPhoto" \
                -F chat_id="${TELEGRAM_CHAT_ID}" \
                -F photo=@"${TMP}" \
                --data-urlencode "caption=${CAP_PLAIN}" \
                -o resp.json
              rc=$?
              if [ $rc -eq 0 ]; then POSTED=1; else echo "::warning::upload fallback rc=$rc"; fi
              rm -f "$TMP" || true
            else
              echo "::warning::download failed"
            fi
          fi

          # 4) Fallback to plain text message
          if [ $POSTED -eq 0 ]; then
            echo "Sending plain text fallback"
            curl -s -S -X POST "$API/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="$CAP_PLAIN" \
              -o resp.json
          fi

          echo "--- Telegram API Response ---"
          if [ -f resp.json ]; then cat resp.json; else echo "{}"; fi
