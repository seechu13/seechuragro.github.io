path=sys.argv[1]
base=sys.argv[2].rstrip('/')+'/'

with open(path,'r',encoding='utf-8') as f:
    j=json.load(f)

imgs=[]
if isinstance(j.get('images'),list) and j.get('images'):
    imgs=j['images']
elif j.get('cover_image') is not None:
    ci=j['cover_image']
    if isinstance(ci,list): imgs=ci
    elif isinstance(ci,str) and ci.strip(): imgs=[ci]
elif isinstance(j.get('media'),list):
    imgs=j['media']

def norm(u):
    if not u: return None
    u=u.strip()
    if u.startswith('http'): return u
    if u.startswith('/'): return urllib.parse.urljoin(base,u.lstrip('/'))
    return urllib.parse.urljoin(base,u)

normd=[norm(u) for u in imgs if norm(u)]
print("EXTRACTED_IMAGES_COUNT:",len(normd))
for i,u in enumerate(normd,1): print(f"IMAGE_{i}:",u)
PY

            echo "--- run ig.py ---"
            python3 scripts/ig.py "$jf" || {
              echo "ig.py failed for $jf"
              exit 1
            }

            echo "----------------------------------------"
          done
