<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Articles • Seechur Agro Private Limited</title>
<meta name="description" content="Insights on hydroponics, Lakadong turmeric, microgreens, and sustainable farming from Seechur Agro." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --text:#e8f7ee;
    --muted:#cfe9d8;
    --nav-bg:rgba(10,25,10,0.7);
    --nav-solid:#1b4332;
    --glass:rgba(255,255,255,.06);
    --max:1100px;
    --accent:#2dbb7f;
    --hover:#33d18f;

    /* Dark card palette to match article detail pages */
    --card-bg: rgba(0,0,0,0.18);
    --card-text: #eafff4;
    --card-sub: #b9d8c8;
    --card-meta: #8fbfa6;
    --card-border: rgba(255,255,255,0.04);
    --shadow: 0 12px 24px rgba(0,0,0,.45);
    --shadow-hover: 0 18px 36px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Poppins',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
    color:var(--text); min-height:100vh;
    background:var(--dark);
  }

  /* background image overlay (keeps same hero look) */
  body::before{
    content:""; position:fixed; inset:0; z-index:-1;
    background:
      linear-gradient(180deg, rgba(0,0,0,.40), rgba(0,0,0,.55)),
      url('/assets/hydroponic-bg.jpg?v=32') center/cover no-repeat;
    filter:saturate(1.03) brightness(.92);
  }

  .container{max-width:var(--max); margin:0 auto; padding:28px 18px 40px;}
  h1{font-size:2.3rem; font-weight:700; margin-bottom:8px; color:var(--text); text-shadow:0 2px 8px rgba(0,0,0,.55)}
  p.lead{line-height:1.8; color:var(--muted); margin-bottom:18px;}

  /* Grid of article cards (dark card style) */
  .grid{
    display:grid; gap:22px;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  }
  a.card{
    display:block; text-decoration:none; color:var(--card-text); cursor:pointer;
    background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:18px; overflow:hidden;
    box-shadow:var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  a.card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-hover); filter:brightness(1.02); }

  .thumb{
    height:190px; background:linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.12));
    display:block; overflow:hidden;
  }
  .thumb img{
    width:100%; height:100%; object-fit:cover; display:block;
    transition:transform .35s ease;
  }
  a.card:hover .thumb img{ transform:scale(1.04); }

  .body{padding:16px 16px 18px}
  .meta{font-size:.9rem; color:var(--card-meta); opacity:.95; margin-bottom:6px}
  .title{font-weight:700; font-size:1.18rem; line-height:1.35; margin:2px 0 8px; color:var(--card-text)}
  .excerpt{color:var(--card-sub); font-size:.98rem; line-height:1.65}

  .empty{
    padding:14px; border-radius:12px;
    background:rgba(255,255,255,.03);
    border:1px dashed rgba(255,255,255,.06);
    color:var(--muted); text-align:center;
  }

  footer{text-align:center; color:#cfe9d8; padding:40px 12px 60px; background:rgba(0,0,0,.3); backdrop-filter:blur(4px); margin-top:30px}

  /* tighten small screens */
  @media (max-width:420px){
    .thumb{height:170px}
    .title{font-size:1.08rem}
    .excerpt{font-size:.96rem}
  }

  /* Ensure the listing page uses same boxed article panel look if needed */
  main.container, .grid, .card, .article-panel {
    background: transparent;
  }

  /* strong override to avoid any per-page inline CSS showing a light card */
  .card, .thumb { background-clip: padding-box; }

</style>

</head>
<body>

<!-- ✅ Shared navbar include (absolute path so it works from / and /articles/slug.html) -->
<div id="navbar-placeholder"></div>
<script>
(function loadNavbar(){
  // use absolute path so fetching works from any subpath
  fetch('/navbar.html',{cache:'no-cache'}).then(r=>{
    if(!r.ok) throw new Error('navbar fetch failed');
    return r.text();
  }).then(html=>{
    const host=document.getElementById('navbar-placeholder'); host.innerHTML=html;

    // run any inline scripts found inside navbar.html (preserve previous behavior)
    host.querySelectorAll('script').forEach(s=>{
      const n=document.createElement('script');
      if(s.src){
        n.src = s.src;
        // make absolute if relative
        if(!/^(https?:|\/)/.test(n.src)){
          // prepend origin to relative src
          n.src = window.location.origin + '/' + s.src.replace(/^\.\//,'');
        }
      } else {
        n.textContent = s.textContent;
      }
      document.body.appendChild(n);
    });

    // highlight Articles in nav robustly (handle href like '/articles.html' or 'articles.html')
    document.querySelectorAll('.menu a').forEach(a=>{
      const href=(a.getAttribute('href')||'').toLowerCase();
      if(href.endsWith('articles.html') || href.endsWith('/articles') || href.endsWith('/articles.html')) {
        a.classList.add('active');
      }
    });
  }).catch(()=>{/* silent: if navbar missing, page still shows */});
})();
</script>

<main class="container">
  <h1>Articles & Insights</h1>
  <p class="lead">Readable, practical notes on hydroponics, Lakadong turmeric, and microgreens.</p>

  <div id="grid" class="grid" role="list"></div>
  <div id="fallback" class="empty" style="display:none">No articles yet.</div>
</main>

<footer>© <span id="year"></span> Seechur Agro Private Limited • Human by Chance, Farmer by Choice</footer>

<script>
(function(){
  const y=document.getElementById('year'); if(y) y.textContent=new Date().getFullYear();

  const grid = document.getElementById('grid');
  const fallback = document.getElementById('fallback');

  // use absolute path to articles.json so it resolves whether page is / or /articles/slug.html
  fetch('/articles.json?ver=3', {cache:'no-cache'})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(list => {
      if(!Array.isArray(list) || !list.length){ fallback.style.display='block'; return; }

      list.sort((a,b)=> String(b.date).localeCompare(String(a.date)));

      const frag = document.createDocumentFragment();
      list.forEach(item=>{
        const url   = item.url   || '#';
        const img   = item.image || '';
        const cat   = item.category || '';
        const date  = item.date || '';
        const title = item.title || '';
        const ex    = item.excerpt || item.subtitle || '';

        const a = document.createElement('a');
        a.className = 'card';
        // ensure urls are absolute-rooted if not already
        a.href = (url && url.startsWith('/')) ? url : ('/' + url.replace(/^\//,''));
        a.setAttribute('aria-label', title);

        // thumbnail
        const t = document.createElement('div');
        t.className='thumb';
        if(img){
          const im = document.createElement('img');
          im.loading='lazy';
          im.alt = title || 'Article image';
          im.src = (img.startsWith('/')) ? img : ('/' + img.replace(/^\//,''));
          im.onerror = ()=>{ t.remove(); }; // remove thumb if 404 to avoid odd color bars
          t.appendChild(im);
        }
        a.appendChild(t);

        // body
        const b = document.createElement('div'); b.className='body';
        const m = document.createElement('div'); m.className='meta';
        m.textContent = [cat, date].filter(Boolean).join(' • ');
        const ti = document.createElement('div'); ti.className='title'; ti.textContent=title;
        const exd = document.createElement('div'); exd.className='excerpt'; exd.textContent=ex;

        b.appendChild(m); b.appendChild(ti); b.appendChild(exd);
        a.appendChild(b);

        frag.appendChild(a);
      });

      grid.innerHTML='';
      grid.appendChild(frag);
    })
    .catch(()=>{ fallback.style.display='block'; });
})();
</script>
</body>
</html>
