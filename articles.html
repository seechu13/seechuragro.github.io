<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Articles • Seechur Agro Private Limited</title>
<meta name="description" content="Insights on hydroponics, Lakadong turmeric, microgreens, and sustainable farming from Seechur Agro." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">

<style>
  /* keep your current variables but keep it compact */
  :root{ --text:#f3fff6; --muted:#cfe9d8; --max:1100px; --accent:#2dbb7f; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{ font-family:'Poppins',system-ui,-apple-system,"Segoe UI",Roboto,Arial; color:var(--text); min-height:100vh; }
  body::before{ content:""; position:fixed; inset:0; z-index:-1; background: linear-gradient(180deg, rgba(0,0,0,.30), rgba(0,0,0,.40)), url('/assets/hydroponic-bg.jpg') center/cover no-repeat; filter:saturate(1.05) brightness(.97); }
  .container{ max-width:var(--max); margin:0 auto; padding:28px 18px 40px; }
  h1{ font-size:2.3rem; font-weight:700; margin-bottom:8px; text-shadow:0 2px 8px rgba(0,0,0,.55) }
  p.lead{ line-height:1.8; color:var(--muted); margin-bottom:18px; }
  .grid{ display:grid; gap:22px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
  a.card{ display:block; text-decoration:none; color:#1d2a21; background:#fff; border-radius:18px; overflow:hidden; box-shadow:0 12px 24px rgba(0,0,0,.18); transition:transform .18s ease; }
  .thumb{ height:190px; background:#f3f7f4; overflow:hidden; }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s ease; }
  a.card:hover .thumb img{ transform:scale(1.04); }
  .body{ padding:16px; }
  .meta{ font-size:.9rem; color:#0f7a52; margin-bottom:6px }
  .title{ font-weight:700; font-size:1.18rem; line-height:1.35; margin:2px 0 8px; color:#1d2a21 }
  .excerpt{ color:#495a50; font-size:.98rem; line-height:1.65 }
  .empty{ padding:14px; border-radius:12px; background:rgba(255,255,255,.10); border:1px dashed rgba(255,255,255,.25); color:#defbea; text-align:center; }
  footer{text-align:center; color:#d9ffe6; padding:40px 12px 60px; background:rgba(0,0,0,.4); backdrop-filter:blur(4px); margin-top:30px}
  @media (max-width:420px){ .thumb{ height:170px } .title{ font-size:1.08rem } .excerpt{ font-size:.96rem } }
</style>
</head>
<body>

<!-- navbar placeholder (same pattern your generated pages use) -->
<div id="navbar-placeholder"></div>
<script>
(function loadNavbar(){
  fetch('/navbar.html',{cache:'no-cache'}).then(r=>r.text()).then(html=>{
    document.getElementById('navbar-placeholder').innerHTML = html;
    // execute scripts in navbar if any
    document.getElementById('navbar-placeholder').querySelectorAll('script').forEach(s=>{
      const n=document.createElement('script');
      if(s.src){ n.src=s.src; } else { n.textContent = s.textContent; }
      document.body.appendChild(n);
    });
    // highlight current
    document.querySelectorAll('.menu a').forEach(a=>{
      const href=(a.getAttribute('href')||'').toLowerCase();
      if(href==='articles.html') a.classList.add('active');
    });
  }).catch(()=>{/* ignore */});
})();
</script>

<main class="container">
  <h1>Articles & Insights</h1>
  <p class="lead">Readable, practical notes on hydroponics, Lakadong turmeric, and microgreens.</p>

  <div id="grid" class="grid" role="list"></div>
  <div id="fallback" class="empty" style="display:none">No articles yet.</div>
</main>

<footer>© <span id="year"></span> Seechur Agro Private Limited • Human by Chance, Farmer by Choice</footer>

<script>
(function(){
  const y=document.getElementById('year'); if(y) y.textContent=new Date().getFullYear();

  const grid = document.getElementById('grid');
  const fallback = document.getElementById('fallback');

  fetch('/articles/articles.json?ver=3', {cache:'no-cache'})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(list => {
      if(!Array.isArray(list) || !list.length){ fallback.style.display='block'; return; }

      list.sort((a,b)=> String(b.date).localeCompare(String(a.date)));

      const frag = document.createDocumentFragment();
      list.forEach(item=>{
        const url   = item.url   || '#';
        const img   = (item.image && item.image.length) ? item.image : '';
        const cat   = item.category || '';
        const date  = item.date ? new Date(item.date).toLocaleDateString('en-GB',{day:'2-digit', month:'short', year:'numeric'}) : '';
        const title = item.title || '';
        const ex    = item.excerpt || item.subtitle || '';

        const a = document.createElement('a');
        a.className = 'card';
        a.href = url;
        a.setAttribute('aria-label', title);

        const t = document.createElement('div'); t.className='thumb';
        if(img){
          const im = document.createElement('img');
          im.loading='lazy';
          im.alt = title || 'Article image';
          im.src = img;
          im.onerror = ()=>{ t.remove(); };
          t.appendChild(im);
        }
        a.appendChild(t);

        const b = document.createElement('div'); b.className='body';
        const m = document.createElement('div'); m.className='meta';
        m.textContent = [cat, date].filter(Boolean).join(' • ');
        const ti = document.createElement('div'); ti.className='title'; ti.textContent=title;
        const exd = document.createElement('div'); exd.className='excerpt'; exd.textContent=ex;

        b.appendChild(m); b.appendChild(ti); b.appendChild(exd);
        a.appendChild(b);
        frag.appendChild(a);
      });

      grid.innerHTML=''; grid.appendChild(frag);
    })
    .catch(()=>{ fallback.style.display='block'; });
})();
</script>
</body>
</html>
