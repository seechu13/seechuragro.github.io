name: Master — validate article assets (parse-test)

on:
  push:
    paths:
      - 'articles/**'

concurrency:
  group: master-post-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  parse-test:
    name: Parse & basic discovery test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Print environment + changed files
        run: |
          set -euo pipefail
          echo "GITHUB_REF_NAME: $GITHUB_REF_NAME"
          echo "GITHUB_SHA: $GITHUB_SHA"
          echo "---- Changed files in this commit (if any) ----"
          git show --name-only --pretty="" "$GITHUB_SHA" || true
          echo "---- articles/*.json files in repo ----"
          ls -1 articles/*.json 2>/dev/null || echo "(none)"
