name: Master — validate + dispatch (manual test)

on:
  workflow_dispatch:
    inputs:
      json_path:
        description: "Path to a single article JSON (relative to repo root). Use e.g. articles/test-automation.json"
        required: true

concurrency:
  group: master-post-manual-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest
    name: Validate JSON and dispatch wrappers (manual)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install jq (for payload building)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Validate JSON and local image assets (via JS) and dispatch workflows
        uses: actions/github-script@v6
        with:
          # keep node code compact and simple to avoid YAML parsing issues
          script: |
            const fs = require('fs');
            const path = require('path');
            const core = require('@actions/core');

            // Inputs
            const jsonPath = core.getInput('json_path') || process.env.INPUT_JSON_PATH || '';
            if (!jsonPath) {
              core.setFailed('json_path input is required.');
              return;
            }

            // Resolve path
            const jf = path.normalize(jsonPath);

            if (!fs.existsSync(jf)) {
              core.setFailed(`JSON not found: ${jf}`);
              return;
            }

            // Parse JSON
            let j;
            try {
              j = JSON.parse(fs.readFileSync(jf, 'utf8'));
            } catch (e) {
              core.setFailed(`Invalid JSON (${jf}): ${String(e).slice(0,200)}`);
              return;
            }
            console.log(`Parsed JSON: ${jf}`);

            // Walk object and collect string values that look like image paths/URLs
            const imgs = [];
            function walk(o) {
              if (o && typeof o === 'object') {
                if (Array.isArray(o)) {
                  for (const v of o) walk(v);
                } else {
                  for (const v of Object.values(o)) walk(v);
                }
              } else if (typeof o === 'string') {
                const s = o.trim();
                if (/\.(jpg|jpeg|png|webp)$/i.test(s)) imgs.push(s);
              }
            }
            walk(j);

            // Deduplicate preserving order
            const seen = new Set();
            const uniq = imgs.filter(x => { if (seen.has(x)) return false; seen.add(x); return true; });

            if (uniq.length === 0) {
              console.log('No image-like strings found in JSON (OK if intentional).');
            } else {
              console.log('Image candidates found:');
              uniq.forEach(u => console.log(' - ' + u));
            }

            // Validate local files; warn for HTTP(s)
            let missing = false;
            for (const u of uniq) {
              if (/^https?:\/\//i.test(u)) {
                console.log(`WARN remote image (not checked): ${u}`);
              } else {
                // try as-is, normalized, assets fallback
                if (fs.existsSync(u)) {
                  console.log(`OK local image: ${u}`);
                } else if (fs.existsSync(path.join('.', u.replace(/^\/+/,'')))) {
                  console.log(`OK local image (normalized): ${u}`);
                } else {
                  const fallback = path.join('assets','articles', path.basename(u));
                  if (fs.existsSync(fallback)) {
                    console.log(`OK local image (fallback): ${fallback}`);
                  } else {
                    core.error(`Local image missing: ${u}`);
                    missing = true;
                  }
                }
              }
            }

            if (missing) {
              core.setFailed('One or more local images missing. Fix JSON or add missing assets.');
              return;
            }

            // At this point, validation passed. Dispatch wrappers.
            const workflows = [
              'telegram.yml',
              'linkedin.yml',
              'post-to-fb.yml',
              'post-to-instagram.yml',
              'post-to-x.yml'
            ];

            // For each wrapper, call the workflow dispatch API with correct input key.
            // Use the Octokit client available at `github` in this environment.
            const octokit = github;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.ref.replace('refs/heads/','') || process.env.GITHUB_REF_NAME || 'main';

            async function dispatchOne(wf, inputName, value) {
              try {
                await octokit.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: wf,
                  ref,
                  inputs: { [inputName]: value }
                });
                console.log(`Dispatched ${wf} -> input ${inputName}=${value}`);
              } catch (e) {
                core.error(`Failed dispatch ${wf}: ${String(e).slice(0,200)}`);
                throw e;
              }
            }

            // map wrappers -> input key
            const mapping = {
              'telegram.yml': ['json_path','json_path'],
              'linkedin.yml': ['json_path','json_path'],
              'post-to-fb.yml': ['json_path','json_path'],
              'post-to-instagram.yml': ['ig_json','json_path'],
              'post-to-x.yml': ['json_list','json_path']
            };

            for (const wf of workflows) {
              const inputKey = mapping[wf][0];
              // use the provided json path as value
              await dispatchOne(wf, inputKey, jf);
            }

            core.info('All dispatch requests sent.');
        env:
          # expose input to the github-script invocation
          INPUT_JSON_PATH: ${{ github.event.inputs.json_path }}
