name: Update Manual Social Dropdown

on:
  push:
    paths:
      - "articles/**/*.html"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (staging)
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Update dropdown options
        run: |
          python3 scripts/update_manual_social_dropdown.py

      - name: Commit workflow update
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .github/workflows/manual-generate-social.yml

          if git diff --cached --quiet; then
            echo "No dropdown changes"
            exit 0
          fi

          git commit -m "Update manual social dropdown options"
          git push
