          echo "final_json=$FINAL_JSON" >> "$GITHUB_OUTPUT"
          # parse fields into outputs for next steps
          CAPTION_VAL="$(python -c "import json,sys; print(json.loads(sys.argv[1])['caption'])" "$FINAL_JSON")"
          IMAGE_VAL="$(python -c "import json,sys; print(json.loads(sys.argv[1])['image'])" "$FINAL_JSON")"
          URL_VAL="$(python -c "import json,sys; print(json.loads(sys.argv[1])['url'])" "$FINAL_JSON")"
          echo "caption<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CAPTION_VAL" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_VAL" >> "$GITHUB_OUTPUT"
          echo "article_url=$URL_VAL" >> "$GITHUB_OUTPUT"

      - name: Debug: show prepared vars
        run: |
          echo "ARTICLE_FILE: ${{ steps.detect.outputs.article }}"
          echo "CAPTION (truncated to 1000 chars):"
          printf "%s\n" "${{ steps.prepare.outputs.caption }}" | head -c 1000
          echo
          echo "IMAGE field: '${{ steps.prepare.outputs.image }}'"
          echo "article_url: '${{ steps.prepare.outputs.article_url }}'"

      - name: Post to Telegram (photo if image present, else text)
        run: |
          # read prepared outputs
          CAPTION="${{ steps.prepare.outputs.caption }}"
          IMG_FIELD="${{ steps.prepare.outputs.image }}"
          ARTICLE_URL="${{ steps.prepare.outputs.article_url }}"
          BOT_URL="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"

          # normalize image url if image field exists
          if [ -n "$IMG_FIELD" ] && [[ "$IMG_FIELD" != http* ]]; then
            # assume it's a path inside repo; strip leading ./ if present
            IMG_FIELD="${IMG_FIELD#./}"
            PHOTO_URL="${SITE_URL%/}/${IMG_FIELD}"
          else
            PHOTO_URL="$IMG_FIELD"
          fi

          echo "Will post. PHOTO_URL='$PHOTO_URL' (empty means no image)"
          if [ -n "$PHOTO_URL" ]; then
            echo "Posting photo to Telegram..."
            curl -sS --fail -X POST "${BOT_URL}/sendPhoto" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F photo="${PHOTO_URL}" \
              -F caption="${CAPTION}" \
              -F parse_mode=HTML \
              -o telegram-photo.json \
            || (echo "::error::sendPhoto failed" && cat telegram-photo.json && exit 5)
            echo "sendPhoto response:"
            cat telegram-photo.json
          else
            echo "Posting plain message to Telegram..."
            curl -sS --fail -X POST "${BOT_URL}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${CAPTION}" \
              --data-urlencode "parse_mode=HTML" \
              -o telegram-send.json \
            || (echo "::error::sendMessage failed" && cat telegram-send.json && exit 6)
            echo "sendMessage response:"
            cat telegram-send.json
          fi
