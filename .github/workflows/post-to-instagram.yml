name: Post to Instagram (auto-processed images — articles/** only, processed branch)

# Wrapper: manual / master-dispatched ONLY — prevents accidental push posting
on:
  workflow_dispatch:
    inputs:
      ig_json:
        description: 'Optional path to article JSON. Master workflow will pass this.'
        required: false

concurrency:
  group: post-to-instagram-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # required to commit processed images & create processed branch

jobs:
  post:
    name: Post to Instagram
    runs-on: ubuntu-latest
    env:
      # content branch (source articles)
      GITHUB_REPO: seechu13/seechuragro.github.io
      GITHUB_BRANCH: staging
      # branch where processed images are stored
      PROCESSED_BRANCH: processed-images
      # default JSON (will be overridden by master workflow dispatch input)
      IG_POST_JSON: articles/test-automation.json
      # Hashtags
      HASHTAG_MAX: '30'
      HASHTAG_MIN_WORD_LEN: '3'
      EXTRA_HASHTAGS: 'seechuragro,agriculture'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate JSON (fast fail)
        run: |
          if [ -n "${{ github.event.inputs.ig_json }}" ]; then
            echo "Using override JSON: ${{ github.event.inputs.ig_json }}"
            export IG_POST_JSON="${{ github.event.inputs.ig_json }}"
          fi

          if [ -f "$IG_POST_JSON" ]; then
            python -m json.tool "$IG_POST_JSON"
            echo "JSON valid: $IG_POST_JSON"
          else
            echo "JSON not found at $IG_POST_JSON — aborting"
            exit 1
          fi

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Run Instagram poster
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ env.GITHUB_REPO }}
          GITHUB_BRANCH: ${{ env.GITHUB_BRANCH }}
          PROCESSED_BRANCH: ${{ env.PROCESSED_BRANCH }}
          IG_POST_JSON: ${{ env.IG_POST_JSON }}
          HASHTAG_MAX: ${{ env.HASHTAG_MAX }}
          HASHTAG_MIN_WORD_LEN: ${{ env.HASHTAG_MIN_WORD_LEN }}
          EXTRA_HASHTAGS: ${{ env.EXTRA_HASHTAGS }}
        run: |
          set -euo pipefail
          echo "Posting using JSON: $IG_POST_JSON"
          python3 scripts/send_ig.py

      - name: Cleanup (no-op)
        if: always()
        run: echo "done"
