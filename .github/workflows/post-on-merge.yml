name: Post changed article JSONs to social platforms (staging) — image resize & neutral doc name

on:
  push:
    branches:
      - staging
    paths:
      - 'assets/articles/**'
      - 'articles/**'
      - 'content/articles/**'
      - '.github/workflows/**'

permissions:
  contents: read

env:
  # Max width used for resizing (you can tweak)
  MAX_WIDTH: "1280"
  # JPEG quality for resized image
  JPEG_QUALITY: "85"

jobs:
  notify-telegram:
    name: Telegram — Post changed article JSONs (staging)
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools (jq, curl, imagemagick)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl imagemagick

      - name: Determine changed files in this push
        id: changes
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "${GITHUB_SHA}" "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            CHANGED=$(git show --name-only --pretty="" "${GITHUB_SHA}" || true)
          fi
          JSON_FILES=$(printf "%s\n" "$CHANGED" | grep -E '\.json$' || true)
          if [ -z "$JSON_FILES" ]; then
            JSON_FILES=$(git ls-files 'assets/articles/*.json' 'articles/*.json' 'content/articles/*.json' || true)
          fi
          JSON_FILES_CLEAN=$(printf "%s\n" "$JSON_FILES" | sed '/^\s*$/d' || true)
          if [ -z "$JSON_FILES_CLEAN" ]; then
            echo "json_files=" >> $GITHUB_OUTPUT
          else
            ENC=$(printf "%s" "$JSON_FILES_CLEAN" | sed ':a;N;$!ba;s/\n/<<NL>>/g')
            echo "json_files=${ENC}" >> $GITHUB_OUTPUT
          fi

      - name: Post each changed JSON to Telegram (resize image, neutral doc name fallback)
        if: steps.changes.outputs.json_files != ''
        run: |
          set -euo pipefail
          RAW="${{ steps.changes.outputs.json_files }}"
          JSON_FILES=$(printf "%s" "$RAW" | sed 's/<<NL>>/\n/g')
          TELEGRAM_API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          SEND_PHOTO="${TELEGRAM_API}/sendPhoto"
          SEND_DOCUMENT="${TELEGRAM_API}/sendDocument"
          SEND_MESSAGE="${TELEGRAM_API}/sendMessage"

          collapse_blank_lines() {
            awk 'BEGIN{blank=0} { if (NF==0) { if (!blank) { print ""; blank=1 } } else { print; blank=0 } }'
          }

          for jf in $JSON_FILES; do
            if [ ! -f "$jf" ]; then
              echo "Skipping (not a file): $jf"
              continue
            fi
            echo "Processing JSON: $jf"
            TITLE="$(jq -r '.title // empty' "$jf")"
            EXCERPT="$(jq -r '.excerpt // .description // empty' "$jf")"
            URL="$(jq -r '.url // .link // empty' "$jf")"
            RAW_COVER="$(jq -r '.cover_image // empty' "$jf")"
            SLUG="$(jq -r '.slug // empty' "$jf")"

            CAPTURE="$(printf "%s\n\n%s\n\n%s" "$TITLE" "$EXCERPT" "$URL")"
            CLEANED="$(printf "%s" "$CAPTURE" \
              | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' \
              | awk '{ sub(/[[:space:]]+$/, ""); print }' \
              | collapse_blank_lines )"
            CLEANED="$(printf "%s" "$CLEANED" | sed 's/\\n/\n/g')"

            echo "----- CAPTION PREVIEW START -----"
            printf "%s\n" "$CLEANED"
            echo "----- CAPTION PREVIEW END -----"

            # Image-finding (normalize cover path)
            IMAGE_PATH=""
            if [ -n "$RAW_COVER" ]; then
              COV="$(printf "%s" "$RAW_COVER" | sed -E 's@^https?://[^/]+@@; s@^\./@@; s@^/@@')"
            else
              COV=""
            fi

            if [ -n "$COV" ] && [ -f "./${COV}" ]; then
              IMAGE_PATH="./${COV}"
            fi

            if [ -z "$IMAGE_PATH" ]; then
              BASENAME_JSON="$(basename "$jf" .json)"
              if [ -n "$COV" ]; then
                SEARCH_NAME="$(basename "$COV")"
              else
                SEARCH_NAME="$BASENAME_JSON"
              fi
              exts="jpg jpeg png webp gif"
              for ext in $exts; do
                CAND="./assets/articles/${SEARCH_NAME}.${ext}"
                if [ -f "$CAND" ]; then
                  IMAGE_PATH="$CAND"; break
                fi
                CAND="./images/${SEARCH_NAME}.${ext}"
                if [ -f "$CAND" ]; then
                  IMAGE_PATH="$CAND"; break
                fi
                CAND="./images/uploads/${SEARCH_NAME}.${ext}"
                if [ -f "$CAND" ]; then
                  IMAGE_PATH="$CAND"; break
                fi
                CAND="./${SEARCH_NAME}.${ext}"
                if [ -f "$CAND" ]; then
                  IMAGE_PATH="$CAND"; break
                fi
              done

              if [ -z "$IMAGE_PATH" ] && [ -n "$SEARCH_NAME" ]; then
                FOUND=$(git ls-files | grep -E "/${SEARCH_NAME}\.(jpg|jpeg|png|webp|gif)$" || true)
                if [ -n "$FOUND" ]; then
                  IMAGE_PATH="$(printf "%s\n" "$FOUND" | head -n1)"
                fi
              fi
            fi

            # Resize if found
            UPLOADED=0
            TMP_RESIZED=""
            if [ -n "$IMAGE_PATH" ] && [ -f "$IMAGE_PATH" ]; then
              echo "Resizing image for Telegram (max width ${MAX_WIDTH})"
              TMP_RESIZED="$(mktemp --suffix=.jpg)"
              convert "$IMAGE_PATH" -resize "${MAX_WIDTH}x>" -strip -quality "${JPEG_QUALITY}" "$TMP_RESIZED" || TMP_RESIZED=""
            fi

            try_send_photo_file() {
              local file="$1"
              body=$(mktemp)
              http_code=$(curl -sS -w "%{http_code}" --show-error --fail --retry 2 --retry-delay 2 \
                -F chat_id="${TELEGRAM_CHAT_ID}" \
                -F "photo=@${file}" \
                -F "caption=${CLEANED}" \
                -F "parse_mode=HTML" \
                "${SEND_PHOTO}" -o "$body" 2>/dev/null || true)
              cat "$body" || true
              if [ "$http_code" = "200" ] && grep -q '"ok":true' "$body" 2>/dev/null; then rm -f "$body"; return 0; fi
              rm -f "$body"; return 1
            }

            try_send_document_neutralname() {
              local file="$1"
              local neutral="image.jpg"
              body=$(mktemp)
              http_code=$(curl -sS -w "%{http_code}" --show-error --fail --retry 2 --retry-delay 2 \
                -F chat_id="${TELEGRAM_CHAT_ID}" \
                -F "document=@${file};filename=${neutral}" \
                -F "caption=${CLEANED}" \
                -F "parse_mode=HTML" \
                "${SEND_DOCUMENT}" -o "$body" 2>/dev/null || true)
              cat "$body" || true
              if [ "$http_code" = "200" ] && grep -q '"ok":true' "$body" 2>/dev/null; then rm -f "$body"; return 0; fi
              rm -f "$body"; return 1
            }

            if [ -n "$TMP_RESIZED" ] && [ -f "$TMP_RESIZED" ]; then
              if try_send_photo_file "$TMP_RESIZED"; then UPLOADED=1; fi
            fi

            if [ "$UPLOADED" -eq 0 ] && [ -n "$IMAGE_PATH" ] && [ -f "$IMAGE_PATH" ]; then
              if try_send_photo_file "$IMAGE_PATH"; then UPLOADED=1; fi
            fi

            if [ "$UPLOADED" -eq 0 ] && printf "%s" "$RAW_COVER" | grep -qE '^https?://'; then
              body=$(mktemp)
              http_code=$(curl -sS -w "%{http_code}" --show-error --fail --data chat_id="${TELEGRAM_CHAT_ID}" \
                --data "photo=${RAW_COVER}" \
                --data "caption=${CLEANED}" \
                --data "parse_mode=HTML" \
                "${SEND_PHOTO}" -o "$body" 2>/dev/null || true)
              cat "$body" || true
              if [ "$http_code" = "200" ] && grep -q '"ok":true' "$body" 2>/dev/null; then UPLOADED=1; fi
              rm -f "$body"
            fi

            if [ "$UPLOADED" -eq 0 ] && [ -n "$IMAGE_PATH" ] && [ -f "$IMAGE_PATH" ]; then
              if [ -n "$TMP_RESIZED" ] && [ -f "$TMP_RESIZED" ]; then
                if try_send_document_neutralname "$TMP_RESIZED"; then UPLOADED=1; fi
              fi
              if [ "$UPLOADED" -eq 0 ]; then
                if try_send_document_neutralname "$IMAGE_PATH"; then UPLOADED=1; fi
              fi
            fi

            if [ "$UPLOADED" -eq 0 ]; then
              RESP=$(curl -sS --show-error --fail --data chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=${CLEANED}" \
                --data "parse_mode=HTML" \
                "${SEND_MESSAGE}" || true)
              if ! printf "%s" "$RESP" | grep -q '"ok":true'; then
                echo "ERROR: Telegram text send failed for $jf"
              fi
            fi

            if [ -n "$TMP_RESIZED" ] && [ -f "$TMP_RESIZED" ]; then rm -f "$TMP_RESIZED"; fi
            echo "Done processing $jf"
            echo "--------------------------------------------"
          done

      - name: No changed JSONs found notice
        if: steps.changes.outputs.json_files == ''
        run: |
          echo "No JSON files detected as changed in this push. Nothing to post to Telegram."

  post-linkedin:
    name: LinkedIn — Post changed article JSONs (staging)
    runs-on: ubuntu-latest
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}

    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools (jq, curl, imagemagick)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl imagemagick

      - name: Determine changed files in this push (LinkedIn)
        id: changes_li
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "${GITHUB_SHA}" "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            CHANGED=$(git show --name-only --pretty="" "${GITHUB_SHA}" || true)
          fi
          JSON_FILES=$(printf "%s\n" "$CHANGED" | grep -E '\.json$' || true)
          if [ -z "$JSON_FILES" ]; then
            JSON_FILES=$(git ls-files 'assets/articles/*.json' 'articles/*.json' 'content/articles/*.json' || true)
          fi
          JSON_FILES_CLEAN=$(printf "%s\n" "$JSON_FILES" | sed '/^\s*$/d' || true)
          if [ -z "$JSON_FILES_CLEAN" ]; then
            echo "json_files=" >> $GITHUB_OUTPUT
          else
            ENC=$(printf "%s" "$JSON_FILES_CLEAN" | sed ':a;N;$!ba;s/\n/<<NL>>/g')
            echo "json_files=${ENC}" >> $GITHUB_OUTPUT
          fi

      - name: Post each changed JSON to LinkedIn (resize image, register upload)
        if: steps.changes_li.outputs.json_files != ''
        run: |
          set -euo pipefail
          RAW="${{ steps.changes_li.outputs.json_files }}"
          JSON_FILES=$(printf "%s" "$RAW" | sed 's/<<NL>>/\n/g')

          collapse_blank_lines() {
            awk 'BEGIN{blank=0} { if (NF==0) { if (!blank) { print ""; blank=1 } } else { print; blank=0 } }'
          }

          for jf in $JSON_FILES; do
            if [ ! -f "$jf" ]; then
              echo "Skipping (not a file): $jf"
              continue
            fi
            echo "Processing JSON (LinkedIn): $jf"
            TITLE="$(jq -r '.title // empty' "$jf")"
            EXCERPT="$(jq -r '.excerpt // .description // empty' "$jf")"
            URL="$(jq -r '.url // .link // empty' "$jf")"
            RAW_COVER="$(jq -r '.cover_image // empty' "$jf")"

            CAPTURE="$(printf "%s\n\n%s\n\n%s" "$TITLE" "$EXCERPT" "$URL")"
            CLEANED="$(printf "%s" "$CAPTURE" \
              | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' \
              | awk '{ sub(/[[:space:]]+$/, ""); print }' \
              | collapse_blank_lines )"
            CLEANED="$(printf "%s" "$CLEANED" | sed 's/\\n/\n/g')"

            echo "----- CAPTION PREVIEW START -----"
            printf "%s\n" "$CLEANED"
            echo "----- CAPTION PREVIEW END -----"

            # Image find (same heuristic as Telegram)
            IMAGE_PATH=""
            if [ -n "$RAW_COVER" ]; then
              COV="$(printf "%s" "$RAW_COVER" | sed -E 's@^https?://[^/]+@@; s@^\./@@; s@^/@@')"
            else
              COV=""
            fi

            if [ -n "$COV" ] && [ -f "./${COV}" ]; then
              IMAGE_PATH="./${COV}"
            fi

            if [ -z "$IMAGE_PATH" ]; then
              BASENAME_JSON="$(basename "$jf" .json)"
              if [ -n "$COV" ]; then
                SEARCH_NAME="$(basename "$COV")"
              else
                SEARCH_NAME="$BASENAME_JSON"
              fi
              exts="jpg jpeg png webp gif"
              for ext in $exts; do
                CAND="./assets/articles/${SEARCH_NAME}.${ext}"
                if [ -f "$CAND" ]; then
                  IMAGE_PATH="$CAND"; break
                fi
                CAND="./images/${SEARCH_NAME}.${ext}"
                if [ -f "$CAND" ]; then
                  IMAGE_PATH="$CAND"; break
                fi
                CAND="./images/uploads/${SEARCH_NAME}.${ext}"
                if [ -f "$CAND" ]; then
                  IMAGE_PATH="$CAND"; break
                fi
                CAND="./${SEARCH_NAME}.${ext}"
                if [ -f "$CAND" ]; then
                  IMAGE_PATH="$CAND"; break
                fi
              done

              if [ -z "$IMAGE_PATH" ] && [ -n "$SEARCH_NAME" ]; then
                FOUND=$(git ls-files | grep -E "/${SEARCH_NAME}\.(jpg|jpeg|png|webp|gif)$" || true)
                if [ -n "$FOUND" ]; then
                  IMAGE_PATH="$(printf "%s\n" "$FOUND" | head -n1)"
                fi
              fi
            fi

            TMP_RESIZED=""
            if [ -n "$IMAGE_PATH" ] && [ -f "$IMAGE_PATH" ]; then
              echo "Resizing image for LinkedIn (max width ${MAX_WIDTH})"
              TMP_RESIZED="$(mktemp --suffix=.jpg)"
              convert "$IMAGE_PATH" -resize "${MAX_WIDTH}x>" -strip -quality "${JPEG_QUALITY}" "$TMP_RESIZED" || TMP_RESIZED=""
            fi

            if [ -z "${TMP_RESIZED:-}" ] || [ ! -f "${TMP_RESIZED:-}" ]; then
              echo "No image available for LinkedIn post. Creating text-only UGC post."
              payload=$(jq -n --arg owner "$LINKEDIN_ORG_URN" \
                --arg text "$CLEANED" \
                '{author:$owner, lifecycleState:"PUBLISHED", specificContent: { "com.linkedin.ugc.ShareContent": { "shareCommentary": { "text": $text }, "shareMediaCategory":"NONE" } }, visibility: { "com.linkedin.ugc.MemberNetworkVisibility": "PUBLIC" } }')
              curl -s -X POST \
                -H "Authorization: Bearer $LINKEDIN_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$payload" \
                "https://api.linkedin.com/v2/ugcPosts" | jq .
              echo "LinkedIn text post created for $jf"
              continue
            fi

            # 1) Register upload
            register_payload=$(jq -n --arg owner "$LINKEDIN_ORG_URN" \
              '{registerUploadRequest: { owner: $owner, recipes: ["urn:li:digitalmediaRecipe:feedshare-image"], serviceRelationships: [{identifier:"urn:li:userGeneratedContent", relationshipType:"OWNER"}], supportedUploadMechanism: ["SYNCHRONOUS_UPLOAD"]}}')
            reg_response=$(curl -s -X POST \
              -H "Authorization: Bearer $LINKEDIN_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$register_payload" "https://api.linkedin.com/v2/assets?action=registerUpload")

            upload_url=$(echo "$reg_response" | jq -r '.value.uploadMechanism["com.linkedin.digitalmedia.uploading.MediaUploadHttpRequest"].uploadUrl')
            asset_urn=$(echo "$reg_response" | jq -r '.value.asset')

            if [ -z "$upload_url" ] || [ "$upload_url" = "null" ]; then
              echo "Upload URL not found, falling back to text post"
              payload=$(jq -n --arg owner "$LINKEDIN_ORG_URN" \
                --arg text "$CLEANED" \
                '{author:$owner, lifecycleState:"PUBLISHED", specificContent: { "com.linkedin.ugc.ShareContent": { "shareCommentary": { "text": $text }, "shareMediaCategory":"NONE" } }, visibility: { "com.linkedin.ugc.MemberNetworkVisibility": "PUBLIC" } }')
              curl -s -X POST -H "Authorization: Bearer $LINKEDIN_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$payload" "https://api.linkedin.com/v2/ugcPosts" | jq .
              continue
            fi

            # 2) Upload binary
            curl -s -X PUT -H "Content-Type: application/octet-stream" --data-binary @"$TMP_RESIZED" "$upload_url" -w "\nHTTP_STATUS:%{http_code}\n" || true

            # 3) Create UGC post referencing the asset
            post_payload=$(jq -n --arg owner "$LINKEDIN_ORG_URN" --arg text "$CLEANED" --arg asset "$asset_urn" \
              '{author:$owner, lifecycleState:"PUBLISHED", specificContent: {"com.linkedin.ugc.ShareContent": {"shareCommentary": {"text": $text},"shareMediaCategory":"IMAGE","media":[{"status":"READY","description":{"text":""},"media":$asset,"title":{"text":""}}]}}, visibility: {"com.linkedin.ugc.MemberNetworkVisibility":"PUBLIC"}}')
            curl -s -X POST \
              -H "Authorization: Bearer $LINKEDIN_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$post_payload" "https://api.linkedin.com/v2/ugcPosts" | jq .
            echo "LinkedIn image post created for $jf"

            if [ -n "$TMP_RESIZED" ] && [ -f "$TMP_RESIZED" ]; then rm -f "$TMP_RESIZED"; fi
            echo "Done processing $jf (LinkedIn)"
            echo "--------------------------------------------"
          done

      - name: No changed JSONs found notice (LinkedIn)
        if: steps.changes_li.outputs.json_files == ''
        run: |
          echo "No JSON files detected as changed in this push. Nothing to post to LinkedIn."
