name: LinkedIn — Post single article (manual + master safe)

# HARD RULE: LinkedIn runs ONLY when explicitly dispatched
on:
  workflow_dispatch:
    inputs:
      json_path:
        description: "REQUIRED: Path to social JSON for ONE article"
        required: true

jobs:
  post-to-linkedin:
    runs-on: ubuntu-latest
    concurrency:
      group: linkedin-single-post
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Validate JSON input (fail fast)
        run: |
          if [ ! -f "${{ github.event.inputs.json_path }}" ]; then
            echo "❌ JSON file not found: ${{ github.event.inputs.json_path }}"
            exit 1
          fi
          echo "✅ Using JSON: ${{ github.event.inputs.json_path }}"
          python3 -m json.tool "${{ github.event.inputs.json_path }}" > /dev/null

      - name: Post to LinkedIn (personal)
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON: ${{ secrets.LINKEDIN_PERSON }}
          BASE_URL: ${{ secrets.BASE_URL }}
          LINKEDIN_KEEP_URL_WITH_IMAGE: "true"
          LINKEDIN_POST_IMAGE: "true"
        run: |
          set -euo pipefail
          echo "Posting to LinkedIn: ${{ github.event.inputs.json_path }}"
          python scripts/send_linkedin.py --json "${{ github.event.inputs.json_path }}"
