name: Post changed article JSONs to Facebook (staging) - strict

on:
  workflow_run:
    workflows:
      - "post-to-x.yml"
    types:
      - completed

permissions:
  contents: read

env:
  FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  SITE_URL_BASE: ${{ secrets.SITE_URL_BASE }}
  ASSETS_PATH: ${{ secrets.ASSETS_PATH }}

jobs:
  verify_and_post:
    name: Verify upstream success → Post to FB (and IG if URL reachable)
    runs-on: ubuntu-latest
    env:
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      SITE_URL_BASE: ${{ secrets.SITE_URL_BASE }}
      ASSETS_PATH: ${{ secrets.ASSETS_PATH }}

    steps:
      - name: Show trigger / upstream info
        run: |
          echo "Triggered by workflow_run: ${{ github.event.workflow_run.name }}"
          echo "Upstream conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Upstream head SHA: ${{ github.event.workflow_run.head_sha }}"

      - name: Ensure upstream concluded successfully
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Upstream workflow did not finish with success. Exiting."
            exit 1
          fi
          echo "Upstream workflow succeeded. Proceeding."

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          pip install requests || true

      - name: Diagnostic — detect image and resolved URL (prints diagnostic)
        id: diag
        run: |
          python3 - <<'PY'
import os, json
from pathlib import Path
import sys
try:
    import requests
except Exception as e:
    print("requests import failed:", e); sys.exit(2)

fn = "articles/test-automation.json"
if not Path(fn).exists():
    # try to detect changed JSONs from the commit head of upstream
    print("[DIAG] primary test JSON not found:", fn)
    # fallback - attempt to list known JSON locations
    candidates = list(Path("articles").glob("*.json")) + list(Path("content/articles").glob("*.json")) + list(Path("assets/articles").glob("*.json"))
    if candidates:
        fn = str(candidates[0])
        print("[DIAG] using candidate JSON:", fn)
    else:
        print("[DIAG] no JSON files found in repo; exiting diagnostic.")
        print("IMAGE_FOUND=False")
        sys.exit(0)

print("---- DIAGNOSTIC START ----")
print("Checking article file:", fn)
a = json.load(open(fn, encoding="utf-8"))
print("Article keys:", list(a.keys()))
img = None
for k in ("cover_image","image","featured_image","hero"):
    if a.get(k):
        img = a.get(k); print("Found image key:", k, "->", img); break
print("SITE_URL_BASE:", os.getenv("SITE_URL_BASE"))
ASSETS_PATH = os.getenv("ASSETS_PATH","").strip("/")
print("ASSETS_PATH:", repr(ASSETS_PATH))

def build_public_url(val):
    if not os.getenv("SITE_URL_BASE"):
        return None
    v = val.lstrip("/")
    base = os.getenv("SITE_URL_BASE").rstrip("/")
    if ASSETS_PATH and v.startswith(ASSETS_PATH):
        return f"{base}/{v}"
    if v.startswith("assets/"):
        return f"{base}/{v}"
    if ASSETS_PATH:
        return f"{base}/{ASSETS_PATH}/{Path(v).name}"
    return f"{base}/{v}"

if not img:
    print("IMAGE_FOUND=False")
    print("No image found in article.")
else:
    is_pub = isinstance(img, str) and (img.startswith("http://") or img.startswith("https://"))
    resolved = img if is_pub else build_public_url(img)
    print("IMAGE_FOUND=True")
    print("raw_image:", img)
    print("is_public_url:", is_pub)
    print("resolved_url:", resolved)
    if resolved:
        try:
            r = requests.head(resolved, timeout=10, allow_redirects=True)
            print("HEAD status:", r.status_code, "content-type:", r.headers.get("content-type"))
            print("HEAD_OK=" + ("1" if r.status_code == 200 else "0"))
        except Exception as e:
            print("HEAD_ERROR:", e)
            print("HEAD_OK=0")
    else:
        print("HEAD_OK=0")
print("---- DIAGNOSTIC END ----")
PY

      - name: Patch publisher for local file uploads (runner-side)
        id: patch
        run: |
          PYFILE="scripts/publish_fb_insta.py"
          if [ ! -f "$PYFILE" ]; then
            echo "No publisher script at $PYFILE; skipping patch."
            echo "PATCH_APPLIED=false"
            exit 0
          fi
          python3 - <<'PY'
from pathlib import Path
p = Path("scripts/publish_fb_insta.py")
s = p.read_text(encoding="utf-8")
old_snip = (
    "        if is_public_url(img):\n"
    "            print(f\"[FB] Uploading by URL: {img}\")\n"
    "            payload = {\"url\": img, \"caption\": caption, \"access_token\": token}\n"
    "            resp = requests.post(url, data=payload, timeout=TIMEOUT)\n"
    "            print_resp_summary(resp, \"FB_UPLOAD\")\n"
    "            resp.raise_for_status()\n"
    "            return resp.json()\n"
)
if old_snip in s:
    new_snip = old_snip + (
        "        else:\n"
        "            # Upload local file binary when image is a repo/local path\n"
        "            print(f\"[FB] Uploading local file: {img}\")\n"
        "            fp = Path(img)\n"
        "            if not fp.exists():\n"
        "                fp = Path.cwd() / img\n"
        "            if not fp.exists():\n"
        "                print(f\"[FB] Local file not found ({img}); falling back to URL upload\")\n"
        "                payload = {\"url\": img, \"caption\": caption, \"access_token\": token}\n"
        "                resp = requests.post(url, data=payload, timeout=TIMEOUT)\n"
        "                print_resp_summary(resp, \"FB_UPLOAD\")\n"
        "                resp.raise_for_status()\n"
        "                return resp.json()\n"
        "            with fp.open('rb') as fh:\n"
        "                files = {'source': fh}\n"
        "                payload = {'caption': caption, 'access_token': token}\n"
        "                resp = requests.post(url, data=payload, files=files, timeout=TIMEOUT)\n"
        "                print_resp_summary(resp, 'FB_UPLOAD')\n"
        "                resp.raise_for_status()\n"
        "                return resp.json()\n"
    )
    s2 = s.replace(old_snip, new_snip)
    p.write_text(s2, encoding="utf-8")
    print("PATCH_APPLIED=true")
    print("Patched scripts/publish_fb_insta.py with local-upload fallback.")
else:
    print("PATCH_APPLIED=false")
    print("Expected snippet not found; no patch applied.")
PY

      - name: Run FB publisher for detected JSONs
        id: run_fb
        run: |
          set -euo pipefail
          # select JSONs changed by the upstream commit (head_sha)
          SHA="${{ github.event.workflow_run.head_sha }}"
          CHANGED=$(git show --name-only --pretty="" "$SHA" || true)
          JSONS=$(printf "%s\n" "$CHANGED" | grep -E '\.json$' || true)
          if [ -z "$JSONS" ]; then
            JSONS=$(git ls-files 'assets/articles/*.json' 'articles/*.json' 'content/articles/*.json' || true)
          fi
          if [ -z "$JSONS" ]; then
            echo "No JSON files detected; nothing to post."
            exit 0
          fi
          for jf in $JSONS; do
            [ -f "$jf" ] || { echo "Skipping missing $jf"; continue; }
            echo "Publishing (FB) file: $jf"
            python3 -u scripts/publish_fb_insta.py "$jf" --mode fb
          done

      - name: Decide & run IG publisher (only if resolved URL reachable)
        id: run_ig
        run: |
          # We will inspect the diagnostic output for HEAD_OK and resolved_url
          # to decide whether IG can run (IG requires a public image URL).
          DIAG_LOG=$(mktemp)
          # re-run the diagnostic minimally to capture HEAD_OK & resolved_url for the first JSON found
          python3 - <<'PY' > $DIAG_LOG
import os, json
from pathlib import Path
import sys
try:
    import requests
except Exception as e:
    print("requests import failed:", e); sys.exit(2)

# find a JSON to test
cands = list(Path("articles").glob("*.json")) + list(Path("content/articles").glob("*.json")) + list(Path("assets/articles").glob("*.json"))
if not cands:
    print("NO_JSON")
    sys.exit(0)
fn = str(cands[0])
a = json.load(open(fn, encoding="utf-8"))
img = None
for k in ("cover_image","image","featured_image","hero"):
    if a.get(k):
        img = a.get(k); break
def build_public_url(val):
    v = val.lstrip("/")
    base = os.getenv("SITE_URL_BASE","").rstrip("/")
    ASSETS_PATH = os.getenv("ASSETS_PATH","").strip("/")
    if not base:
        return ""
    if ASSETS_PATH and v.startswith(ASSETS_PATH):
        return f"{base}/{v}"
    if v.startswith("assets/"):
        return f"{base}/{v}"
    if ASSETS_PATH:
        return f"{base}/{ASSETS_PATH}/{Path(v).name}"
    return f"{base}/{v}"
if not img:
    print("IMAGE_FOUND=0")
    sys.exit(0)
is_pub = isinstance(img, str) and (img.startswith("http://") or img.startswith("https://"))
resolved = img if is_pub else build_public_url(img)
ok = 0
if resolved:
    try:
        r = requests.head(resolved, timeout=10, allow_redirects=True)
        if r.status_code == 200:
            ok = 1
    except:
        ok = 0
print("RESOLVED_URL=" + (resolved or ""))
print("HEAD_OK=" + str(ok))
PY

          RESOLVED_URL=$(cat $DIAG_LOG | sed -n 's/^RESOLVED_URL=//p' | tr -d '\r\n')
          HEAD_OK=$(cat $DIAG_LOG | sed -n 's/^HEAD_OK=//p' | tr -d '\r\n')
          echo "IG decision: RESOLVED_URL=${RESOLVED_URL}  HEAD_OK=${HEAD_OK}"
          if [ -z "$RESOLVED_URL" ] || [ "$HEAD_OK" != "1" ]; then
            echo "Skipping IG publish: no publicly reachable image URL (IG requires image_url)."
            exit 0
          fi
          echo "Running IG publisher using public URL: $RESOLVED_URL"
          # Run IG publisher for the same JSONs we published to FB
          SHA="${{ github.event.workflow_run.head_sha }}"
          CHANGED=$(git show --name-only --pretty="" "$SHA" || true)
          JSONS=$(printf "%s\n" "$CHANGED" | grep -E '\.json$' || true)
          if [ -z "$JSONS" ]; then
            JSONS=$(git ls-files 'assets/articles/*.json' 'articles/*.json' 'content/articles/*.json' || true)
          fi
          for jf in $JSONS; do
            [ -f "$jf" ] || { echo "Skipping missing $jf"; continue; }
            echo "Publishing (IG) file: $jf"
            python3 -u scripts/publish_fb_insta.py "$jf" --mode ig
          done

      - name: Done
        run: echo "verify_and_post job completed."
