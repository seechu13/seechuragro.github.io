<nav class="site-nav" id="siteNav">
  <div class="nav-inner">
    <a class="brand" href="/" aria-label="Seechur Agro home">
      <img src="/logo.png?v=27" alt="Seechur Agro logo">
    </a>

    <!-- Mobile hamburger -->
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mobileMenu" aria-label="Open Menu">
      ☰ Menu
    </button>

    <!-- Menu (drawer on mobile) -->
    <div class="menu" id="mobileMenu" role="navigation" aria-label="Main menu">
      <a href="/index.html">Home</a>
      <a href="/about.html">About</a>
      <a href="/why-lakadong.html">Why Lakadong</a>
      <a href="/portfolio.html">Portfolio</a>
      <a href="/market.html">Market</a>
      <a href="/financials.html">Financials</a>
      <a href="/team.html">Team</a>
      <a href="/faq.html">FAQ</a>
      <a href="/advisors.html">Advisors</a>
      <a href="/articles.html">Articles</a>
      <a href="/contact.html">Contact</a>
      <a href="/investor-pack.html">Investor Pack</a>
    </div>
  </div>
</nav>
<div class="nav-overlay" id="navOverlay" hidden></div>

<style>
  :root{
    --nav-bg: rgba(10,25,10,0.72);
    --nav-solid: #1b4332;
    --nav-height: auto;
  }

  .site-nav{
    position: sticky;
    top: 0;
    z-index: 1000;
    background: var(--nav-bg);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(255,255,255,.10);
  }

  .nav-inner{
    max-width: 1100px;
    margin: 0 auto;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand { display:flex; align-items:center; text-decoration:none; }
  .brand img{
    width: 110px;
    height: auto;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,.45));
  }

  .menu {
    margin-left: auto;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  .menu a{
    color: #ffffff;
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 999px;
    transition: background .18s, transform .12s;
    font-weight: 600;
  }

  .menu a:hover { background: rgba(255,255,255,0.12); transform: translateY(-2px); }
  .menu a.active { background: rgba(255,255,255,0.18); box-shadow: 0 6px 18px rgba(0,0,0,.28); }

  .nav-toggle {
    display: none;
    margin-left: auto;
    border: 1px solid rgba(255,255,255,.28);
    background: rgba(0,0,0,.22);
    color: #eafff5;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
  }

  .nav-overlay { display:none; }

  /* Mobile / drawer */
  @media (max-width: 768px) {
    .brand img { width: 84px; }
    .nav-toggle { display: inline-block; }

    .menu {
      position: fixed;
      top: 0;
      right: -80%;
      width: 80%;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 18px;
      background: var(--nav-solid);
      border-left: 1px solid rgba(255,255,255,.10);
      box-shadow: -10px 0 24px rgba(0,0,0,.45);
      transition: right .28s ease-in-out;
      z-index: 1100;
      padding-top: 48px;
    }

    .menu a { padding: 12px 14px; border: 1px solid rgba(255,255,255,.06); background: rgba(255,255,255,.04); }
    .site-nav.open .menu { right: 0; }

    .nav-overlay {
      position: fixed;
      inset: 0;
      z-index: 1090;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(2px);
      display: none;
    }
    .site-nav.open + .nav-overlay { display: block; }
  }
</style>

<script>
(function(){
  // Prevent double init if navbar inserted multiple times
  if (window.__SEECHUR_NAVBAR_INIT__) return;
  window.__SEECHUR_NAVBAR_INIT__ = true;

  const nav = document.getElementById('siteNav');
  const toggle = document.getElementById('navToggle');
  const overlay = document.getElementById('navOverlay');

  function openMenu(){
    nav.classList.add('open');
    if(toggle) toggle.setAttribute('aria-expanded','true');
    if(overlay) overlay.removeAttribute('hidden');
    document.body.style.overflow = 'hidden';
  }
  function closeMenu(){
    nav.classList.remove('open');
    if(toggle) toggle.setAttribute('aria-expanded','false');
    if(overlay) overlay.setAttribute('hidden','');
    document.body.style.overflow = '';
  }

  if (toggle) {
    toggle.addEventListener('click', function(e){
      e.stopPropagation();
      nav.classList.contains('open') ? closeMenu() : openMenu();
    });
  }
  if (overlay) overlay.addEventListener('click', closeMenu);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeMenu(); });

  // ACTIVE LINK LOGIC (robust):
  // - normalize current path
  // - mark Articles active for any /articles/slug.html or /articles.html
  function normalizePath(p){
    if(!p) return '/';
    try { p = decodeURIComponent(p); } catch(e){}
    // remove query + hash
    p = p.split('?')[0].split('#')[0];
    // remove trailing slash (but keep root '/')
    if(p.length > 1 && p.endsWith('/')) p = p.slice(0,-1);
    return p.toLowerCase();
  }

  const current = normalizePath(location.pathname || '/');

  // decide which nav href to treat as active
  let activeHref = '/index.html';
  if (current === '/' || current === '/index.html') {
    activeHref = '/index.html';
  } else if (current.startsWith('/articles/')) {
    activeHref = '/articles.html';
  } else if (current === '/articles' || current === '/articles.html') {
    activeHref = '/articles.html';
  } else {
    // last segment fallback: /about.html -> /about.html
    const parts = current.split('/');
    const last = parts[parts.length-1] || 'index.html';
    activeHref = (last.startsWith('/')) ? last : ('/' + last);
  }

  // apply active class — tolerant of href formats (with and without leading slash)
  function applyActive(){
    const links = document.querySelectorAll('.menu a');
    links.forEach(a => {
      const raw = (a.getAttribute('href')||'').toLowerCase();
      const href = raw.startsWith('/') ? raw : ('/' + raw.replace(/^\//,''));
      if (href === activeHref) {
        a.classList.add('active');
      } else {
        a.classList.remove('active');
      }
    });
  }

  // run immediately and again after a brief delay (for injected navs)
  applyActive();
  setTimeout(applyActive, 150);

  // observe changes in menu (helpful if CMS modifies links later)
  if (window.MutationObserver) {
    const menuNode = document.querySelector('.menu') || document.body;
    const mo = new MutationObserver(() => applyActive());
    mo.observe(menuNode, { childList: true, subtree: true });
  }

  // Accessibility tweak: close menu if user clicks any menu link (mobile)
  document.addEventListener('click', function(e){
    const el = e.target.closest && e.target.closest('.menu a');
    if(el && nav.classList.contains('open')) { closeMenu(); }
  });
})();
</script>
