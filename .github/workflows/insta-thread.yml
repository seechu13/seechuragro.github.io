name: Generate Instagram + Threads Assets (AUTO)

on:
  push:
    paths:
      - "articles/**/*.html"

permissions:
  contents: write

jobs:
  generate-insta-thread:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (staging)
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pillow beautifulsoup4

      - name: Resolve latest article HTML
        id: article
        run: |
          set -euo pipefail

          ARTICLE=$(git diff --name-only HEAD~1 HEAD | grep '^articles/.*\.html$' | tail -n 1 || true)

          if [ -z "$ARTICLE" ]; then
            echo "❌ No article HTML detected"
            exit 1
          fi

          echo "Using article: $ARTICLE"
          echo "article=$ARTICLE" >> "$GITHUB_OUTPUT"

      - name: Generate Instagram assets + threads.json
        run: |
          python3 scripts/insta_thread.py "${{ steps.article.outputs.article }}"

      - name: Commit Instagram assets and threads.json
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add social/insta threads.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Generate Instagram assets and Threads JSON"
          git push
