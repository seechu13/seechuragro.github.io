name: Master — validate + dispatch (auto + manual)

on:
  workflow_dispatch:
    inputs:
      json_path:
        description: "Manual: Path to one article JSON"
        required: false

  push:
    paths:
      - 'articles/**/*.json'

concurrency:
  group: master-post-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.REPO_PAT }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Validate JSON and dispatch
        uses: actions/github-script@v6
        env:
          MANUAL_JSON: ${{ github.event.inputs.json_path }}
          TOKEN: ${{ secrets.REPO_PAT }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let jf = process.env.MANUAL_JSON;
            const eventPath = process.env.GITHUB_EVENT_PATH;

            // ============================================================
            // AUTO-DETECT JSON ON PUSH — supports commits[] and head_commit
            // ============================================================
            if (!jf) {
              const event = JSON.parse(fs.readFileSync(eventPath, 'utf8'));

              let files = [];

              // Normal pushes: event.commits[]
              if (Array.isArray(event.commits)) {
                for (const c of event.commits) {
                  const added = Array.isArray(c.added) ? c.added : [];
                  const modified = Array.isArray(c.modified) ? c.modified : [];
                  files.push(...added, ...modified);
                }
              }

              // GitHub UI / single file commits → head_commit fallback
              if (event.head_commit) {
                const added = Array.isArray(event.head_commit.added) ? event.head_commit.added : [];
                const modified = Array.isArray(event.head_commit.modified) ? event.head_commit.modified : [];
                files.push(...added, ...modified);
              }

              // Take only JSONs
              const jsons = files.filter(f => f.endsWith('.json'));

              if (jsons.length === 0) {
                core.setFailed("No JSON file detected in push event.");
                return;
              }

              jf = jsons[0];
              console.log("Auto-detected JSON file:", jf);
            } else {
              console.log("Manual mode JSON:", jf);
            }

            jf = path.normalize(jf);

            if (!fs.existsSync(jf)) {
              core.setFailed(`JSON not found: ${jf}`);
              return;
            }

            // ==============================
            // PARSE JSON SAFELY
            // ==============================
            let j;
            try {
              j = JSON.parse(fs.readFileSync(jf, 'utf8'));
            } catch (e) {
              core.setFailed(`Invalid JSON (${jf}): ${String(e).slice(0,200)}`);
              return;
            }
            console.log("JSON parsed successfully");

            // ==============================
            // FIND IMAGE PATHS
            // ==============================
            const imgs = [];
            function walk(o) {
              if (o && typeof o === "object") {
                if (Array.isArray(o)) o.forEach(walk);
                else Object.values(o).forEach(walk);
              } else if (typeof o === "string") {
                if (/\.(jpg|jpeg|png|webp)$/i.test(o.trim()))
                  imgs.push(o.trim());
              }
            }
            walk(j);

            const uniq = [...new Set(imgs)];

            if (uniq.length > 0) {
              console.log("Image candidates:");
              uniq.forEach(u => console.log(" -", u));
            } else {
              console.log("No images detected (OK).");
            }

            // ==============================
            // VALIDATE LOCAL IMAGES
            // ==============================
            let missing = false;

            for (const u of uniq) {
              if (/^https?:\/\//i.test(u)) {
                console.log("WARN: Remote image skipped:", u);
                continue;
              }

              const p1 = path.resolve(u);
              const p2 = path.resolve(".", u.replace(/^\/+/, ""));

              if (fs.existsSync(p1) || fs.existsSync(p2)) {
                console.log("OK local image:", u);
              } else {
                missing = true;
                core.error("Missing local image: " + u);
              }
            }

            if (missing) {
              core.setFailed("Missing image files detected.");
              return;
            }

            // ==============================
            // DISPATCH WRAPPERS
            // ==============================
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = (context.ref || "refs/heads/main").replace("refs/heads/", "");

            const octokit = github.getOctokit(process.env.TOKEN);

            const workflows = [
              { file: "telegram.yml",          input: "json_path" },
              { file: "linkedin.yml",          input: "json_path" },
              { file: "post-to-fb.yml",        input: "json_path" },
              { file: "post-to-instagram.yml", input: "ig_json" },
              { file: "post-to-x.yml",         input: "json_list" }
            ];

            for (const wf of workflows) {
              try {
                await octokit.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: wf.file,
                  ref,
                  inputs: { [wf.input]: jf }
                });

                console.log(`Dispatched ${wf.file} → ${jf}`);
              } catch (err) {
                core.error(`Dispatch failed for ${wf.file}: ${err}`);
                throw err;
              }
            }

            core.info("ALL WRAPPERS DISPATCHED SUCCESSFULLY.");
