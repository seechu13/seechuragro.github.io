name: Post Article to Socials on Staging Merge (Telegram only)

on:
  push:
    branches:
      - staging
    paths:
      - 'articles.html'
      - 'articles/**'
      - 'content/articles/**'
      - 'assets/articles/**'
      - 'article.json'
      - 'src/articles/**'
      - 'public/articles/**'

permissions:
  contents: read

jobs:
  post-articles:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SITE_URL_BASE: ${{ secrets.SITE_URL_BASE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find changed article files and post to Telegram
        run: |
          set -euo pipefail
          echo "Starting Telegram posting step"

          # Get changed files in the last commit
          CHANGED="$(git diff --name-only HEAD~1 HEAD || true)"
          echo "Changed files:"
          echo "$CHANGED"

          # Filter only the article JSON files we care about
          FILES="$(printf '%s\n' "$CHANGED" | grep -E '^articles/.*\.json$|^content/articles/.*\.json$|^src/articles/.*\.json$|^article\.json$' || true)"
          if [ -z "$FILES" ]; then
            echo "No article JSON files changed. Exiting."
            exit 0
          fi

          # Ensure curl and jq are available
          sudo apt-get update -y
          sudo apt-get install -y jq curl || true

          # Iterate files and post
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "Processing: $file"
            if [ ! -f "$file" ]; then
              echo "File not present on disk: $file"
              continue
            fi

            # Extract fields
            title="$(jq -r '.title // .headline // empty' "$file")"
            excerpt="$(jq -r '.excerpt // .summary // empty' "$file")"
            slug="$(jq -r '.slug // empty' "$file")"
            url="$(jq -r '.url // empty' "$file")"
            cover="$(jq -r '.cover_image // .cover // .image // empty' "$file")"

            if [ -z "$url" ] && [ -n "${SITE_URL_BASE:-}" ] && [ -n "$slug" ]; then
              url="${SITE_URL_BASE%/}/$slug"
            fi

            # Fallbacks
            test -n "$title" || title="New article"
            test -n "$excerpt" || excerpt=""

            caption="${title}\n\n${excerpt}\n\n${url}"
            echo "Caption length: ${#caption}"

            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              if [ -n "$cover" ]; then
                echo "Sending photo to Telegram: $cover"
                resp=$(curl -s -w "|%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
                  -F chat_id="${TELEGRAM_CHAT_ID}" \
                  -F photo="${cover}" \
                  -F caption="${caption}" \
                  -F parse_mode="HTML" || echo "error|0")
                code=$(echo "$resp" | awk -F'|' '{print $NF}')
                echo "Telegram photo response code: $code"
              else
                echo "Sending text message to Telegram"
                body=$(jq -nc --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$caption" '{chat_id:$chat_id, text:$text, parse_mode:"HTML"}')
                resp=$(curl -s -w "|%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -H "Content-Type: application/json" \
                  -d "$body" || echo "error|0")
                code=$(echo "$resp" | awk -F'|' '{print $NF}')
                echo "Telegram message response code: $code"
              fi
            else
              echo "Telegram secrets not set — skipped"
            fi

          done <<< "$FILES"

          echo "Telegram posting step complete."
