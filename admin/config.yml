backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: editorial_workflow

# TEMP collection just so the Admin UI loads.
# We'll add the real Articles collection in the next step.
collections:
  - name: placeholders
    label: “Placeholders”
    files:
      - name: welcome
        label: “Welcome (no action needed)”
        file: "cms/placeholder.md"
        fields:
          - { label: Note, name: body, widget: text, default: "Welcome to Seechur Agro Admin." }
