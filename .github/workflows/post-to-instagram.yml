name: Instagram — Post single article (manual + master safe)

on:
  workflow_dispatch:
    inputs:
      ig_json:
        description: "REQUIRED: Path to social JSON for ONE article (e.g. social_new.json)"
        required: true

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      GITHUB_REPO: seechu13/seechuragro.github.io
      GITHUB_BRANCH: staging
      PROCESSED_BRANCH: processed-images

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Validate JSON input
        run: |
          if [ ! -f "${{ github.event.inputs.ig_json }}" ]; then
            echo "❌ JSON not found: ${{ github.event.inputs.ig_json }}"
            exit 1
          fi
          echo "✅ Using JSON: ${{ github.event.inputs.ig_json }}"
          python -m json.tool "${{ github.event.inputs.ig_json }}" > /dev/null

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Instagram poster
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

          GITHUB_REPO: ${{ env.GITHUB_REPO }}
          GITHUB_BRANCH: ${{ env.GITHUB_BRANCH }}
          PROCESSED_BRANCH: ${{ env.PROCESSED_BRANCH }}
        run: |
          set -x
          python3 -u scripts/send_ig.py "${{ github.event.inputs.ig_json }}"

      - name: Cleanup
        if: always()
        run: echo "done"
