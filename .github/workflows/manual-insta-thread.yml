name: Generate Insta + Threads Assets (Manual)

on:
  workflow_dispatch:
    inputs:
      article_path:
        description: "Article HTML path (example: articles/dairy-farming-guide-20251122-201040.html)"
        required: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (staging)
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 pillow

      - name: Generate Insta + Threads assets
        run: |
          set -euo pipefail
          python3 scripts/insta_thread.py "${{ github.event.inputs.article_path }}"

      - name: Commit Insta + Threads output
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add social insta_thread.json

          if git diff --cached --quiet; then
            echo "No Insta/Threads changes"
            exit 0
          fi

          git commit -m "Manual generate Insta + Threads assets"
          git push
