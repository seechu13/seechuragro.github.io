<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Articles • Seechur Agro Private Limited</title>
<meta name="description" content="Insights on hydroponics, Lakadong turmeric, microgreens, and sustainable farming from Seechur Agro." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --text:#f3fff6; --muted:#cfe9d8;
    --nav-bg:rgba(10,25,10,0.7); --nav-solid:#1b4332;
    --glass:rgba(255,255,255,.12); --max:1100px;
    --accent:#2dbb7f; --hover:#33d18f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Poppins',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
    color:var(--text); min-height:100vh;
  }
  /* reader-friendly page background */
  body::before{ display:none; }

  /* ===== Navbar area is included via navbar.html ===== */

  .container{max-width:var(--max); margin:0 auto; padding:28px 18px 40px;}
  h1{font-size:2.2rem; font-weight:700; margin-bottom:8px; text-shadow:0 2px 8px rgba(0,0,0,.55)}
  p.lead{line-height:1.8; color:var(--muted); margin-bottom:18px;}

  /* Grid of article cards */
  .grid{
    display:grid; gap:18px;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  }
  a.card{
    display:block; text-decoration:none; color:inherit; cursor:pointer;
    background:var(--glass); border:1px solid rgba(255,255,255,.16);
    border-radius:18px; overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,.4);
    transition:transform .18s ease, filter .18s ease, box-shadow .18s ease;
  }
  a.card:hover{ transform:translateY(-2px); filter:brightness(1.03); box-shadow:0 10px 26px rgba(0,0,0,.45) }

  .thumb{
    height:180px; background:rgba(0,0,0,.18);
    display:block; overflow:hidden;
  }
  .thumb img{
    width:100%; height:100%; object-fit:cover; display:block;
    transition:transform .35s ease;
  }
  a.card:hover .thumb img{ transform:scale(1.03); }

  .body{padding:14px 14px 16px}
  .meta{font-size:.9rem; color:#baf5d0; opacity:.95; margin-bottom:4px}
  .title{font-weight:600; font-size:1.15rem; margin:2px 0 6px}
  .excerpt{color:var(--muted); font-size:.95rem; line-height:1.6}

  .empty{
    padding:14px; border-radius:12px;
    background:rgba(255,255,255,.08);
    border:1px dashed rgba(255,255,255,.2);
    color:#defbea; text-align:center;
  }

  footer{text-align:center; color:#d9ffe6; padding:40px 12px 60px; background:rgba(0,0,0,.4); backdrop-filter:blur(4px); margin-top:30px}
</style>
</head>
<body>

<!-- ✅ Shared navbar include -->
<div id="navbar-placeholder"></div>
<script>
(function loadNavbar(){
  fetch('navbar.html',{cache:'no-cache'}).then(r=>r.text()).then(html=>{
    const host=document.getElementById('navbar-placeholder'); host.innerHTML=html;
    // execute any scripts embedded in navbar.html
    host.querySelectorAll('script').forEach(s=>{
      const n=document.createElement('script');
      if(s.src){ n.src=s.src; } else { n.textContent=s.textContent; }
      document.body.appendChild(n);
    });
    // highlight Articles in nav
    document.querySelectorAll('.menu a').forEach(a=>{
      const href=(a.getAttribute('href')||'').toLowerCase();
      if(href==='articles.html') a.classList.add('active');
    });
  });
})();
</script>

<main class="container">
  <h1>Articles & Insights</h1>
  <p class="lead">Practical notes from our farm and advisors on hydroponics, Lakadong turmeric, and microgreens.</p>

  <div id="grid" class="grid" role="list"></div>
  <div id="fallback" class="empty" style="display:none">No articles yet.</div>
</main>

<footer>© <span id="year"></span> Seechur Agro Private Limited • Human by Chance, Farmer by Choice</footer>

<script>
(function(){
  const y=document.getElementById('year'); if(y) y.textContent=new Date().getFullYear();

  const grid = document.getElementById('grid');
  const fallback = document.getElementById('fallback');

  // Fetch the JSON from the site root.
  fetch('articles.json?ver=2', {cache:'no-cache'})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(list => {
      if(!Array.isArray(list) || !list.length){ fallback.style.display='block'; return; }

      // Sort newest first (by date string)
      list.sort((a,b)=> String(b.date).localeCompare(String(a.date)));

      const frag = document.createDocumentFragment();
      list.forEach(item=>{
        const url   = item.url   || '#';
        const img   = item.image || '';
        const cat   = item.category || '';
        const date  = item.date || '';
        const title = item.title || '';
        const ex    = item.excerpt || item.subtitle || '';

        // One big anchor to ensure full-card clickability
        const a = document.createElement('a');
        a.className = 'card';
        a.href = url;

        // thumbnail
        const t = document.createElement('div');
        t.className='thumb';
        if(img){
          const im = document.createElement('img');
          im.loading='lazy';
          im.alt = title || 'Article image';
          im.src = img; // paths in JSON are root-relative (images/...)
          im.onerror = ()=>{ t.remove(); /* no ugly box if image not found */ };
          t.appendChild(im);
        }
        a.appendChild(t);

        // body
        const b = document.createElement('div'); b.className='body';
        const m = document.createElement('div'); m.className='meta';
        m.textContent = [cat, date].filter(Boolean).join(' • ');
        const ti = document.createElement('div'); ti.className='title'; ti.textContent=title;
        const exd = document.createElement('div'); exd.className='excerpt'; exd.textContent=ex;

        b.appendChild(m); b.appendChild(ti); b.appendChild(exd);
        a.appendChild(b);

        frag.appendChild(a);
      });

      grid.innerHTML='';
      grid.appendChild(frag);
    })
    .catch(()=>{
      fallback.style.display='block';
    });
})();
</script>
</body>
</html>
