name: Instagram — Post single article (manual + master safe)

on:
  workflow_dispatch:
    inputs:
      ig_json:
        description: "REQUIRED: Path to social JSON for ONE article"
        required: true

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Verify script file (CRITICAL)
        run: |
          echo "---- ls scripts ----"
          ls -la scripts
          echo "---- sha256 ----"
          sha256sum scripts/send_ig.py
          echo "---- first 40 lines ----"
          sed -n '1,40p' scripts/send_ig.py
          echo "---- last 40 lines ----"
          sed -n '$((`wc -l < scripts/send_ig.py`-40)),${p}' scripts/send_ig.py

      - name: Validate JSON
        run: |
          test -f "${{ github.event.inputs.ig_json }}"
          python -m json.tool "${{ github.event.inputs.ig_json }}" > /dev/null

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Run Instagram script (forced traceback)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          IG_POST_JSON: ${{ github.event.inputs.ig_json }}
        run: |
          set -x
          python3 -X faulthandler -u scripts/send_ig.py || echo "EXIT CODE: $?"
