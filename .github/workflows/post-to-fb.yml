name: Post changed article JSONs to Facebook (staging)

on:
  push:
    branches:
      - staging
    paths:
      - 'assets/articles/**'
      - 'articles/**'
      - 'content/articles/**'

permissions:
  contents: read

concurrency:
  group: post-fb-${{ github.ref }}
  cancel-in-progress: false

# workflow-level env — jobs will inherit these automatically
env:
  BASE_URL: "https://seechuragro.in"
  SLEEP_SECONDS: "0"

jobs:
  detect:
    name: Detect changed JSONs
    runs-on: ubuntu-latest
    outputs:
      json_files: ${{ steps.detect.outputs.json_files }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq/git
        run: sudo apt-get update -y && sudo apt-get install -y jq git

      - id: detect
        name: Detect changed JSONs
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "${GITHUB_SHA}" "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            CHANGED=$(git show --name-only --pretty="" "${GITHUB_SHA}" || true)
          fi
          JSONS=$(printf "%s\n" "$CHANGED" | grep -E '\.json$' || true)
          if [ -z "$JSONS" ]; then
            JSONS=$(git ls-files 'assets/articles/*.json' 'articles/*.json' 'content/articles/*.json' || true)
          fi
          CLEAN=$(printf "%s\n" "$JSONS" | sed '/^\s*$/d' || true)
          if [ -z "$CLEAN" ]; then
            echo "json_files=" >> $GITHUB_OUTPUT
          else
            ENC=$(printf "%s" "$CLEAN" | sed ':a;N;$!ba;s/\n/<<NL>>/g')
            echo "json_files=${ENC}" >> $GITHUB_OUTPUT
          fi

  post-fb:
    name: Facebook — Post changed article JSONs
    needs: detect
    runs-on: ubuntu-latest
    if: needs.detect.outputs.json_files != ''
    env:
      # map secrets explicitly here (no ${ { env.* } } usage)
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      BASE_URL: ${{ env.BASE_URL }}
      SLEEP_SECONDS: ${{ env.SLEEP_SECONDS }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Quick debug — confirm secrets presence (no secret values printed)
        run: |
          set -euo pipefail
          [ -n "${FB_PAGE_ID:-}" ] && echo "FB_PAGE_ID: PRESENT" || echo "FB_PAGE_ID: MISSING"
          [ -n "${FB_PAGE_ACCESS_TOKEN:-}" ] && echo "FB_PAGE_ACCESS_TOKEN: PRESENT" || echo "FB_PAGE_ACCESS_TOKEN: MISSING"

      - name: Install deps (ImageMagick, Pillow, requests)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl git imagemagick
          python3 -m pip install --upgrade pip
          pip install --user requests Pillow

      - name: (Optional) Safety sleep
        run: |
          if [ "${SLEEP_SECONDS}" != "0" ]; then
            echo "Sleeping ${SLEEP_SECONDS}s..."
            sleep "${SLEEP_SECONDS}"
          else
            echo "No safety sleep"
          fi

      - name: Post each JSON to Facebook (runner script + debug)
        run: |
          set -euo pipefail
          RAW="${{ needs.detect.outputs.json_files }}"
          LIST=$(printf "%s" "$RAW" | sed 's/<<NL>>/\n/g')

          for jf in $LIST; do
            if [ ! -f "$jf" ]; then
              echo "Skipping missing file: $jf"
              continue
            fi

            echo "----------------------------------------"
            echo "Posting: $jf"
            echo "--- JSON preview (first 200 lines) ---"
            sed -n '1,200p' "$jf" || true

            echo "--- Extracted images ---"
            python3 - <<'PY' "$jf" "${BASE_URL:-https://seechuragro.in}"
import sys, json, urllib.parse
path = sys.argv[1]
base = sys.argv[2].rstrip('/') + '/'
with open(path, 'r', encoding='utf-8') as f:
    j = json.load(f)
imgs = []
if isinstance(j.get('images'), list) and j.get('images'):
    imgs = j.get('images')
elif j.get('cover_image') is not None:
    ci = j.get('cover_image')
    if isinstance(ci, list):
        imgs = ci
    elif isinstance(ci, str) and ci.strip() != '':
        imgs = [ci]
elif isinstance(j.get('media'), list) and j.get('media'):
    imgs = j.get('media')

def normalize(u):
    if not u: return None
    u = u.strip()
    if u.startswith('http://') or u.startswith('https://'):
        return u
    if u.startswith('/'):
        return urllib.parse.urljoin(base, u.lstrip('/'))
    return urllib.parse.urljoin(base, u)
norm = [normalize(u) for u in imgs if normalize(u)]
print("EXTRACTED_IMAGES_COUNT:", len(norm))
for i,u in enumerate(norm,1):
    print(f"IMAGE_{i}:", u)
PY

            # run the script and capture stdout/stderr; fail fast if script fails
            echo "--- run send_fb.py ---"
            python3 scripts/send_fb.py "$jf" || { echo "send_fb.py failed for $jf"; exit 1; }
            echo "----------------------------------------"
          done
