name: Manual Generate Insta + Threads Assets

on:
  workflow_dispatch:
    inputs:
      article_path:
        description: "Article HTML path (e.g. articles/microgreens-basics.html)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (staging)
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 🔴 REQUIRED FIX
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Validate article exists
        run: |
          set -euo pipefail
          test -f "${{ github.event.inputs.article_path }}"

      - name: Generate Insta + Threads assets
        run: |
          set -euo pipefail
          python3 scripts/insta_thread.py "${{ github.event.inputs.article_path }}"

      - name: Commit Insta + Threads assets
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add social/insta threads.json || true

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Manual generate Insta + Threads assets"
          git push
