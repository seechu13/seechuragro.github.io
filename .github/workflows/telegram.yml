name: Telegram - Post on article push

on:
  push:
    paths:
      - "articles/**"
  workflow_dispatch:

jobs:
  telegram-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install small deps
        run: |
          python3 -m pip install --upgrade pip
          pip3 install requests

      - name: Show changed files (debug)
        run: |
          echo "COMMIT: ${{ github.sha }}"
          git --no-pager show --name-only --pretty="" ${{ github.sha }} | sed -n '1,200p' || true

      - name: Determine changed article JSONs
        id: changed_files
        run: |
          # find JSON files under articles/ changed in this push (safe fallback if previous commit unavailable)
          PREV="${{ github.sha }}~1"
          CHANGED=$(git diff --name-only "$PREV" ${{ github.sha }} 2>/dev/null | grep '^articles/.*\.json$' || true)
          if [ -z "$CHANGED" ]; then
            # fallback: list all jsons in articles (useful for manual dispatch)
            CHANGED=$(ls -1 articles/*.json 2>/dev/null || true)
          fi
          echo "Changed files: $CHANGED"
          # put into env for next step
          echo "CHANGED_FILES<<EOF" >> $GITHUB_OUTPUT
          printf "%s\n" "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Process changed article JSONs and post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          set -euo pipefail
          CHANGED_FILES="${{ steps.changed_files.outputs.CHANGED_FILES }}"
          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed article JSON files found - nothing to do."
            exit 0
          fi

          # iterate over each changed file
          echo "$CHANGED_FILES" | while IFS= read -r jf || [ -n "$jf" ]; do
            jf_trimmed="$(echo "$jf" | tr -d '\r')"
            [ -z "$jf_trimmed" ] && continue
            if [ ! -f "$jf_trimmed" ]; then
              echo "Warning: $jf_trimmed does not exist in workspace - skipping."
              continue
            fi
            echo "Processing article JSON: $jf_trimmed"

            # Validate images presence for local paths (allow http/https)
            python3 - "$jf_trimmed" <<'PY'
import sys, json, re
from pathlib import Path
jf=sys.argv[1]
data=json.load(open(jf, encoding='utf-8'))
imgs = data.get('images') or data.get('cover_image') or data.get('cover_images') or []
missing=[]
for im in imgs:
    if not isinstance(im, str): continue
    s=im.strip()
    if s.lower().startswith('http://') or s.lower().startswith('https://') or s.startswith('//'):
        continue
    # remove leading slash if present
    p = Path(s.lstrip('/'))
    if not p.exists():
        missing.append(s)
if missing:
    print("MISSING_IMAGES", missing)
    # exit non-zero to prevent posting for this file
    sys.exit(2)
print("ALL_IMAGES_PRESENT")
PY
            RC=$? || true
            if [ $RC -ne 0 ]; then
              echo "Image validation failed for $jf_trimmed — aborting this file (check assets committed)."
              exit $RC
            fi

            # Post to Telegram using your existing script
            echo "Posting $jf_trimmed to Telegram..."
            python3 scripts/send_telegram.py "$jf_trimmed"
            POST_RC=$? || true
            if [ $POST_RC -ne 0 ]; then
              echo "Telegram post failed for $jf_trimmed (exit $POST_RC)."
              exit $POST_RC
            fi
            echo "Posted $jf_trimmed successfully."
          done

      - name: Done
        run: echo "Telegram posting job completed."
