name: X — Post article JSONs (manual + master safe)

# HARD RULE: X runs ONLY when explicitly dispatched
on:
  workflow_dispatch:
    inputs:
      json_list:
        description: "REQUIRED: JSON file or newline-separated list of JSON files to post"
        required: true

permissions:
  contents: read

concurrency:
  group: post-x-${{ github.ref }}
  cancel-in-progress: false

env:
  # X credentials
  X_API_KEY: ${{ secrets.X_API_KEY }}
  X_API_SECRET: ${{ secrets.X_API_SECRET }}
  X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
  X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

jobs:
  post-x:
    name: X — Post article JSONs
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BASE_URL: "https://seechuragro.in"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl git
          python3 -m pip install --upgrade pip
          pip install tweepy requests

      - name: Normalize supplied JSON list
        id: jsonprep
        run: |
          set -euo pipefail

          RAW="${{ github.event.inputs.json_list }}"
          if [ -z "$RAW" ]; then
            echo "❌ json_list input is empty"
            exit 1
          fi

          # Decode line breaks
          LIST=$(printf "%s" "$RAW" | sed 's/<<NL>>/\n/g')

          if [ -z "$LIST" ]; then
            echo "❌ No JSON paths resolved from input"
            exit 1
          fi

          # Re-encode safely for outputs
          ENC=$(printf "%s" "$LIST" | sed ':a;N;$!ba;s/\n/<<NL>>/g')
          echo "json_files=$ENC" >> $GITHUB_OUTPUT

      - name: Validate JSON files (fail fast)
        run: |
          set -euo pipefail
          RAW="${{ steps.jsonprep.outputs.json_files }}"
          LIST=$(printf "%s" "$RAW" | sed 's/<<NL>>/\n/g')

          for jf in $LIST; do
            if [ ! -f "$jf" ]; then
              echo "❌ JSON file not found: $jf"
              exit 1
            fi
            echo "✅ Validating JSON: $jf"
            python3 -m json.tool "$jf" > /dev/null
          done

      - name: Post each JSON to X
        run: |
          set -euo pipefail
          RAW="${{ steps.jsonprep.outputs.json_files }}"
          LIST=$(printf "%s" "$RAW" | sed 's/<<NL>>/\n/g')

          for jf in $LIST; do
            echo "Posting to X: $jf"
            python3 scripts/send_x.py "$jf"
            echo "--------------------------------"
          done
