name: Manual Generate Instagram + Threads Assets

on:
  workflow_dispatch:
    inputs:
      article_path:
        description: "Path to article HTML (e.g. articles/aeroponics-farming-20251213-205856.html)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate-manual:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (staging)
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pillow beautifulsoup4

      - name: Validate article path
        run: |
          set -euo pipefail

          ARTICLE="${{ github.event.inputs.article_path }}"
          ARTICLE="$(echo "$ARTICLE" | xargs)"   # trim spaces

          if [ ! -f "$ARTICLE" ]; then
            echo "❌ Article not found: $ARTICLE"
            exit 1
          fi

          echo "Using article: $ARTICLE"

      - name: Generate Instagram assets + threads.json
        run: |
          python3 scripts/insta_thread.py "${{ github.event.inputs.article_path }}"

      - name: Commit Instagram assets and threads.json
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add social/insta threads.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Manual regenerate Instagram assets and Threads JSON"
          git push
