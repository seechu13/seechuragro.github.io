<!-- navbar.html -->
<nav class="site-nav" id="siteNav">
  <div class="nav-inner">
    <a class="brand" href="/" aria-label="Seechur Agro home">
      <!-- absolute path to ensure it resolves from any page -->
      <img src="/logo.png?v=27" alt="Seechur Agro logo">
    </a>

    <!-- Mobile hamburger -->
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mobileMenu" aria-label="Open Menu">
      ☰ Menu
    </button>

    <!-- Menu (drawer on mobile) -->
    <div class="menu" id="mobileMenu" role="navigation" aria-label="Primary">
      <a href="/index.html">Home</a>
      <a href="/about.html">About</a>
      <a href="/why-lakadong.html">Why Lakadong</a>
      <a href="/portfolio.html">Portfolio</a>
      <a href="/market.html">Market</a>
      <a href="/financials.html">Financials</a>
      <a href="/team.html">Team</a>
      <a href="/faq.html">FAQ</a>
      <a href="/advisors.html">Advisors</a>
      <a href="/articles.html">Articles</a>
      <a href="/contact.html">Contact</a>
      <a href="/investor-pack.html">Investor Pack</a>
    </div>
  </div>
</nav>

<!-- overlay -->
<div class="nav-overlay" id="navOverlay" hidden></div>

<script>
(function(){
  // Prevent double-init if included multiple times
  if (window.__SEECHUR_NAVBAR_INIT__) return;
  window.__SEECHUR_NAVBAR_INIT__ = true;

  const nav = document.getElementById('siteNav');
  const toggle = document.getElementById('navToggle');
  const overlay = document.getElementById('navOverlay');

  function openMenu(){
    nav.classList.add('open');
    if (toggle) toggle.setAttribute('aria-expanded','true');
    if (overlay) overlay.removeAttribute('hidden');
    document.body.style.overflow = 'hidden';
  }
  function closeMenu(){
    nav.classList.remove('open');
    if (toggle) toggle.setAttribute('aria-expanded','false');
    if (overlay) overlay.setAttribute('hidden','');
    document.body.style.overflow = '';
  }

  if (toggle) toggle.addEventListener('click', ()=>{ nav.classList.contains('open') ? closeMenu() : openMenu(); });
  if (overlay) overlay.addEventListener('click', closeMenu);
  document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeMenu(); });

  // Active-link logic: resilient for both site root and /articles/* pages
  const path = (location.pathname || '/').toLowerCase();
  const normalized = (path.endsWith('/') && path.length>1) ? path.slice(0,-1) : path;

  let activeHref = '/index.html';
  if (normalized === '/' || normalized === '/index.html') {
    activeHref = '/index.html';
  } else if (normalized.startsWith('/articles/')) {
    // any article detail -> highlight articles listing
    activeHref = '/articles.html';
  } else {
    const parts = normalized.split('/');
    const last = parts[parts.length-1] || 'index.html';
    // ensure it starts with slash
    activeHref = '/' + last;
  }

  function applyActive(){
    const links = document.querySelectorAll('.menu a');
    links.forEach(a=>{
      const href = (a.getAttribute('href')||'').toLowerCase();
      const norm = href.startsWith('/') ? href : ('/' + href);
      a.classList.toggle('active', norm === activeHref);
    });
  }

  // Run after a short microtask so if content is injected it still works
  setTimeout(applyActive, 10);

  // Observe menu in case CMS rewrites links later
  if (window.MutationObserver){
    const target = document.querySelector('.menu') || document.body;
    const mo = new MutationObserver(applyActive);
    mo.observe(target, { childList:true, subtree:true });
  }
})();
</script>
