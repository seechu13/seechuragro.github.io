name: Post to Instagram after FB (strict)

on:
  workflow_run:
    workflows:
      - "Post changed article JSONs to Facebook (staging) - full strict"
    types:
      - completed

permissions:
  contents: read

env:
  FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  SITE_URL_BASE: ${{ secrets.SITE_URL_BASE }}
  ASSETS_PATH: ${{ secrets.ASSETS_PATH }}

jobs:
  publish_ig:
    name: Publish to Instagram (after FB)
    runs-on: ubuntu-latest

    steps:
      - name: Ensure upstream FB succeeded
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Upstream FB workflow did not succeed; exiting."
            exit 1
          fi
          echo "Upstream FB succeeded; proceeding."

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests || true

      - name: Detect JSONs and run IG publisher
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha }}"

          CHANGED=$(git show --name-only --pretty="" "$SHA" || true)
          if [ -z "$CHANGED" ]; then
            CHANGED=$(git ls-files 'assets/articles/*.json' 'articles/*.json' 'content/articles/*.json' || true)
          fi

          JSONS=$(printf "%s\n" "$CHANGED" | grep -E '\.json$' || true)
          if [ -z "$JSONS" ]; then
            echo "No JSON files detected; nothing to post."
            exit 0
          fi

          for jf in $JSONS; do
            if [ ! -f "$jf" ]; then
              echo "Skipping missing file: $jf"
              continue
            fi
            echo "Publishing (IG) file: $jf"
            python3 -u scripts/publish_fb_insta.py "$jf" --mode ig || true
          done

      - name: Done
        run: echo "publish_ig job completed."
