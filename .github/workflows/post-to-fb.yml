name: Post to Facebook
on:
  push:
    branches:
      - staging
  workflow_dispatch: {}

jobs:
  detect:
    name: Detect JSON posts
    runs-on: ubuntu-latest
    outputs:
      json_files: ${{ steps.find.outputs.json_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: find
        name: Find JSON files
        run: |
          RAW1=$(find posts -type f -name '*.json' 2>/dev/null || true)
          RAW2=$(find .github/test-posts -type f -name '*.json' 2>/dev/null || true)
          RAW3=$(find articles -type f -name '*.json' 2>/dev/null || true)
          ALL="$RAW1
$RAW2
$RAW3"
          CLEAN=$(printf "%s" "$ALL" | sed '/^\s*$/d')
          if [ -z "$CLEAN" ]; then
            echo "json_files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUT=$(printf "%s" "$CLEAN" | sed ':a;N;$!ba;s/\n/<<NL>>/g')
          echo "json_files=$OUT" >> "$GITHUB_OUTPUT"

  post-fb:
    name: Post each JSON to Facebook
    needs: detect
    runs-on: ubuntu-latest
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      BASE_URL: ${{ secrets.BASE_URL }}
      SLEEP_SECONDS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret presence debug
        run: |
          [ -n "${FB_PAGE_ID:-}" ] && echo "FB_PAGE_ID: PRESENT" || echo "FB_PAGE_ID: MISSING"
          [ -n "${FB_PAGE_ACCESS_TOKEN:-}" ] && echo "FB_PAGE_ACCESS_TOKEN: PRESENT" || echo "FB_PAGE_ACCESS_TOKEN: MISSING"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick jq curl
          python3 -m pip install --upgrade pip
          python3 -m pip install requests Pillow

      - name: Create image extractor script (safe)
        run: |
          echo '#!/usr/bin/env python3' > /tmp/extract_images.py
          echo 'import sys, json, urllib.parse' >> /tmp/extract_images.py
          echo 'path = sys.argv[1]' >> /tmp/extract_images.py
          echo 'base = sys.argv[2].rstrip("/") + "/"' >> /tmp/extract_images.py
          echo 'with open(path, "r", encoding="utf-8") as f:' >> /tmp/extract_images.py
          echo '    j = json.load(f)' >> /tmp/extract_images.py
          echo 'imgs = []' >> /tmp/extract_images.py
          echo 'if isinstance(j.get("images"), list) and j.get("images"):' >> /tmp/extract_images.py
          echo '    imgs = j.get("images")' >> /tmp/extract_images.py
          echo 'elif j.get("cover_image") is not None:' >> /tmp/extract_images.py
          echo '    ci = j.get("cover_image")' >> /tmp/extract_images.py
          echo '    if isinstance(ci, list):' >> /tmp/extract_images.py
          echo '        imgs = ci' >> /tmp/extract_images.py
          echo '    elif isinstance(ci, str) and ci.strip() != "":' >> /tmp/extract_images.py
          echo '        imgs = [ci]' >> /tmp/extract_images.py
          echo 'elif isinstance(j.get("media"), list) and j.get("media"):' >> /tmp/extract_images.py
          echo '    imgs = j.get("media")' >> /tmp/extract_images.py
          echo 'def normalize(u):' >> /tmp/extract_images.py
          echo '    if not u: return None' >> /tmp/extract_images.py
          echo '    u = u.strip()' >> /tmp/extract_images.py
          echo '    if u.startswith("http://") or u.startswith("https://"): return u' >> /tmp/extract_images.py
          echo '    if u.startswith("/"):' >> /tmp/extract_images.py
          echo '        return urllib.parse.urljoin(base, u.lstrip("/"))' >> /tmp/extract_images.py
          echo '    return urllib.parse.urljoin(base, u)' >> /tmp/extract_images.py
          echo 'norm = [normalize(u) for u in imgs if normalize(u)]' >> /tmp/extract_images.py
          echo 'print("EXTRACTED_IMAGES_COUNT:", len(norm))' >> /tmp/extract_images.py
          echo 'for i,u in enumerate(norm,1): print(f"IMAGE_{i}:", u)' >> /tmp/extract_images.py
          chmod +x /tmp/extract_images.py

      - name: Post each JSON to Facebook (runner + debug)
        shell: bash
        run: |
          set -euo pipefail

          RAW="${{ needs.detect.outputs.json_files }}"
          if [ -z "$RAW" ]; then
            echo "No JSON files detected. Exiting."
            exit 0
          fi

          LIST=$(printf "%s" "$RAW" | sed 's/<<NL>>/\n/g')

          for jf in $LIST; do
            if [ ! -f "$jf" ]; then
              echo "Skipping missing file: $jf"
              continue
            fi

            echo "----------------------------------------"
            echo "Posting: $jf"
            echo "--- JSON preview (first 200 lines) ---"
            sed -n '1,200p' "$jf" || true

            echo "--- Extracted images ---"
            python3 /tmp/extract_images.py "$jf" "${BASE_URL:-https://seechuragro.in}"

            echo "--- run send_fb.py ---"
            python3 scripts/send_fb.py "$jf" || { echo "send_fb.py failed for $jf"; exit 1; }
            echo "----------------------------------------"
          done

      - name: Cleanup
        if: always()
        run: rm -f /tmp/extract_images.py || true

