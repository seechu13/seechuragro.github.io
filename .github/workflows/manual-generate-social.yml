name: Manual Generate Social JSON

on:
  workflow_dispatch:
    inputs:
      article_path:
        description: "Article HTML path (example: articles/xyz.html)"
        required: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (staging)
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Generate social_new.json
        run: |
          set -euo pipefail
          echo "Using article: ${{ github.event.inputs.article_path }}"
          python3 scripts/generate_social_json.py "${{ github.event.inputs.article_path }}"

      - name: Commit social_new.json
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add social_new.json

          if git diff --cached --quiet; then
            echo "No changes to social_new.json"
            exit 0
          fi

          git commit -m "Manual regenerate social_new.json"
          git push
