name: Instagram — Post single article (manual + master safe)

# HARD RULE: Instagram runs ONLY when explicitly dispatched
on:
  workflow_dispatch:
    inputs:
      ig_json:
        description: "REQUIRED: Path to social JSON for ONE article"
        required: true

concurrency:
  group: post-to-instagram-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  post:
    name: Post to Instagram
    runs-on: ubuntu-latest

    env:
      GITHUB_REPO: seechu13/seechuragro.github.io
      GITHUB_BRANCH: staging
      PROCESSED_BRANCH: processed-images

      HASHTAG_MAX: '30'
      HASHTAG_MIN_WORD_LEN: '3'
      EXTRA_HASHTAGS: 'seechuragro,agriculture'

    steps:
      # -----------------------------
      # ALWAYS CHECK OUT STAGING BRANCH
      # -----------------------------
      - name: Checkout repo (force staging branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: staging

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate JSON input (fail fast)
        run: |
          if [ ! -f "${{ github.event.inputs.ig_json }}" ]; then
            echo "❌ JSON file not found: ${{ github.event.inputs.ig_json }}"
            exit 1
          fi
          echo "✅ Using JSON: ${{ github.event.inputs.ig_json }}"
          python -m json.tool "${{ github.event.inputs.ig_json }}" > /dev/null

      - name: Normalize hashtags for Instagram + Threads
        run: |
          CLEANED=$(echo "${EXTRA_HASHTAGS}" | sed 's/,/ /g' | sed 's/  */ /g')
          FORMATTED=$(for t in $CLEANED; do echo -n "#$t "; done)
          echo "Normalized hashtags: $FORMATTED"
          echo "EXTRA_HASHTAGS=$FORMATTED" >> $GITHUB_ENV

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Run Instagram poster
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GITHUB_REPO: ${{ env.GITHUB_REPO }}
          GITHUB_BRANCH: ${{ env.GITHUB_BRANCH }}
          PROCESSED_BRANCH: ${{ env.PROCESSED_BRANCH }}

          IG_POST_JSON: ${{ github.event.inputs.ig_json }}
          HASHTAG_MAX: ${{ env.HASHTAG_MAX }}
          HASHTAG_MIN_WORD_LEN: ${{ env.HASHTAG_MIN_WORD_LEN }}
          EXTRA_HASHTAGS: ${{ env.EXTRA_HASHTAGS }}
        run: |
          set -euo pipefail
          echo "Posting using JSON: $IG_POST_JSON"
          python3 scripts/send_ig.py

      - name: Cleanup (no-op)
        if: always()
        run: echo "done"
