<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Articles • Seechur Agro Private Limited</title>
<meta name="description" content="Insights on hydroponics, Lakadong turmeric, microgreens, and sustainable farming from Seechur Agro." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css"/>
</head>
<body>

<div id="navbar-placeholder"></div>
<script>
(function loadNavbar(){
  fetch('/navbar.html',{cache:'no-cache'}).then(r=>r.text()).then(html=>{
    const host=document.getElementById('navbar-placeholder'); host.innerHTML=html;
    host.querySelectorAll('script').forEach(s=>{ const n=document.createElement('script'); if(s.src){ n.src=s.src } else { n.textContent=s.textContent } document.body.appendChild(n); });
    document.querySelectorAll('.menu a').forEach(a=>{ const href=(a.getAttribute('href')||'').toLowerCase(); if(href.endsWith('articles.html')) a.classList.add('active'); });
  }).catch(()=>{/* ignore */});
})();
</script>

<main class="container">
  <h1>Articles & Insights</h1>
  <p class="lead">Readable, practical notes on hydroponics, Lakadong turmeric, and microgreens.</p>

  <div id="grid" class="grid" role="list" aria-live="polite"></div>
  <div id="fallback" class="empty" style="display:none">No articles yet.</div>
</main>

<footer>© <span id="year"></span> Seechur Agro Private Limited • Human by Chance, Farmer by Choice</footer>

<script>
(function(){ const y=document.getElementById('year'); if(y) y.textContent=new Date().getFullYear();
 const grid=document.getElementById('grid'), fallback=document.getElementById('fallback');
 fetch('/articles/articles.json?ts=' + Date.now(), {cache:'no-cache'}).then(r=>r.ok? r.json() : Promise.reject(r.status)).then(list=>{
   if(!Array.isArray(list) || !list.length){ fallback.style.display='block'; return; }
   list.sort((a,b)=> new Date(b.date) - new Date(a.date));
   const frag=document.createDocumentFragment();
   list.forEach(item=>{
     const a=document.createElement('a'); a.className='card'; a.href=item.url; a.setAttribute('aria-label', item.title);
     const t=document.createElement('div'); t.className='thumb';
     if(item.image){ const im=document.createElement('img'); im.src=item.image; im.alt=item.title; im.loading='lazy'; t.appendChild(im); }
     a.appendChild(t);
     const b=document.createElement('div'); b.className='body';
     const m=document.createElement('div'); m.className='meta'; m.textContent=[item.category || '', (new Date(item.date)).toLocaleDateString()].filter(Boolean).join(' • ');
     const ti=document.createElement('div'); ti.className='title'; ti.textContent=item.title;
     const ex=document.createElement('div'); ex.className='excerpt'; ex.textContent=item.excerpt || '';
     b.appendChild(m); b.appendChild(ti); b.appendChild(ex);
     a.appendChild(b); frag.appendChild(a);
   });
   grid.innerHTML=''; grid.appendChild(frag);
 }).catch(()=>{ fallback.style.display='block'; });
})();
</script>
</body>
</html>
