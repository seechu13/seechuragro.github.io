name: Post to Facebook

on:
  push:
    branches: [ "staging" ]
  workflow_dispatch:

jobs:
  detect:
    name: Detect JSON posts
    runs-on: ubuntu-latest
    outputs:
      json_files: ${{ steps.set.outputs.json_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find JSON files
        id: set
        run: |
          # Find JSONs in posts/ or .github/test-posts/ as example; adapt pattern if needed
          RAW=$(find posts -type f -name '*.json' -maxdepth 2 2>/dev/null || true)
          if [ -z "$RAW" ]; then
            RAW=$(find .github/test-posts -type f -name '*.json' -maxdepth 2 2>/dev/null || true)
          fi
          # Convert newlines to <<NL>> so outputs are single-line safe
          OUT=$(printf "%s" "$RAW" | sed ':a;N;$!ba;s/\n/<<NL>>/g')
          echo "::set-output name=json_files::$OUT"

  post-fb:
    name: Post each JSON to Facebook
    runs-on: ubuntu-latest
    needs: detect
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      BASE_URL: ${{ secrets.BASE_URL || 'https://seechuragro.in' }}
      SLEEP_SECONDS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret presence debug
        run: |
          echo "DEBUG: Checking secrets presence"
          [ -n "${FB_PAGE_ID:-}" ] && echo "FB_PAGE_ID: PRESENT" || echo "FB_PAGE_ID: MISSING"
          [ -n "${FB_PAGE_ACCESS_TOKEN:-}" ] && echo "FB_PAGE_ACCESS_TOKEN: PRESENT" || echo "FB_PAGE_ACCESS_TOKEN: MISSING"

      - name: Install deps (ImageMagick, Pillow, requests)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl git imagemagick
          python3 -m pip install --upgrade pip
          python3 -m pip install --user requests Pillow

      - name: (Optional) Safety sleep
        run: |
          if [ "${SLEEP_SECONDS}" != "0" ]; then
            echo "Sleeping ${SLEEP_SECONDS}s..."
            sleep "${SLEEP_SECONDS}"
          else
            echo "No safety sleep"
          fi

      - name: Post each JSON to Facebook (runner script + debug)
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ needs.detect.outputs.json_files }}"
          if [ -z "$RAW" ]; then
            echo "No JSON files detected. Exiting."
            exit 0
          fi
          # Restore newline separators
          LIST=$(printf "%s" "$RAW" | sed 's/<<NL>>/\n/g')

          for jf in $LIST; do
            if [ ! -f "$jf" ]; then
              echo "Skipping missing file: $jf"
              continue
            fi

            echo "----------------------------------------"
            echo "Posting: $jf"
            echo "--- JSON preview (first 200 lines) ---"
            sed -n '1,200p' "$jf" || true

            echo "--- Extracted images ---"
            python3 - <<'PY' "$jf" "${BASE_URL}"
import sys, json, urllib.parse
path = sys.argv[1]
base = sys.argv[2].rstrip('/') + '/'
with open(path, 'r', encoding='utf-8') as f:
    j = json.load(f)
imgs = []
if isinstance(j.get('images'), list) and j.get('images'):
    imgs = j.get('images')
elif j.get('cover_image') is not None:
    ci = j.get('cover_image')
    if isinstance(ci, list):
        imgs = ci
    elif isinstance(ci, str) and ci.strip() != '':
        imgs = [ci]
elif isinstance(j.get('media'), list) and j.get('media'):
    imgs = j.get('media')

def normalize(u):
    if not u: return None
    u = u.strip()
    if u.startswith('http://') or u.startswith('https://'):
        return u
    if u.startswith('/'):
        return urllib.parse.urljoin(base, u.lstrip('/'))
    return urllib.parse.urljoin(base, u)
norm = [normalize(u) for u in imgs if normalize(u)]
print("EXTRACTED_IMAGES_COUNT:", len(norm))
for i,u in enumerate(norm,1):
    print(f"IMAGE_{i}:", u)
PY

            echo "--- run send_fb.py ---"
            # Ensure script is executable and uses python3
            python3 scripts/send_fb.py "$jf" || { echo "send_fb.py failed for $jf"; exit 1; }
            echo "----------------------------------------"
          done
