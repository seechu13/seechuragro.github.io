<style>
  :root{
    --nav-bg: rgba(10,25,10,0.75);
    --nav-solid: #16382d;
    --nav-height: 84px;
  }

  /* navbar container */
  .site-nav{
    position: sticky;
    top: 0;
    z-index: 1100;
    background: var(--nav-bg);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .nav-inner{
    max-width: 1100px;
    margin: 0 auto;
    padding: 10px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    min-height: var(--nav-height);
  }

  /* brand */
  .brand{ display:flex; align-items:center; text-decoration:none; }
  .brand img{
    width: 110px;
    height: auto;
    object-fit: contain;
    display:block;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,.45));
  }

  /* desktop menu */
  .menu{
    margin-left:auto;
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    align-items:center;
  }
  .menu a{
    color:#ffffff;
    text-decoration:none;
    padding:8px 12px;
    border-radius:999px;
    transition: background .18s ease, transform .12s;
    font-weight:600;
    display:inline-block;
    cursor:pointer;
  }
  .menu a:hover{ background: rgba(255,255,255,0.12); transform: translateY(-2px); }
  .menu a.active{ background: rgba(255,255,255,0.14); }

  /* hamburger toggle (hidden desktop) */
  .nav-toggle{
    display:none;
    margin-left:auto;
    border:1px solid rgba(255,255,255,.18);
    background: rgba(0,0,0,.25);
    color:#eafff5;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
    position: relative;
  }

  .nav-overlay{ display:none; }

  /* --------------------
     MOBILE / SMALL SCREENS
     -------------------- */
  @media (max-width: 768px){
    .brand img{ width: 84px; } /* smaller on mobile */

    .nav-toggle{ display:inline-block; z-index: 1304; }

    /* drawer menu: slide from right, pill buttons stacked */
    .menu{
      position: fixed;
      top: 0;
      right: -100%;
      width: min(84%, 360px);
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 26px 18px;
      align-items: center;
      background: var(--nav-solid);
      border-left: 1px solid rgba(255,255,255,.06);
      box-shadow: -8px 0 30px rgba(0,0,0,.45);
      transition: right .28s cubic-bezier(.2,.9,.3,1);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 1302; /* mobile drawer sits above overlay and page */
      pointer-events: auto;
    }

    /* pill style full */
    .menu a{
      width: 86%;
      text-align: center;
      padding: 12px 10px; /* slightly reduced padding to fit more items */
      border: 1px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.03);
      border-radius: 999px;
      color: #eaf7ef;
      font-size: 1.0rem; /* slightly smaller for better fit */
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.01);
      line-height:1.2;
    }
    .menu a:hover{ background: rgba(255,255,255,.06); transform:none; }

    /* show drawer when .open */
    .site-nav.open .menu{ right: 0; }

    /* overlay */
    .nav-overlay{
      position: fixed;
      inset: 0;
      z-index: 1300; /* sits below drawer but above page */
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(2px);
      display: none;
      pointer-events: auto;
    }
    .site-nav.open + .nav-overlay{ display: block; }

    /* ensure brand & toggle remain visible above drawer */
    .site-nav .brand,
    .site-nav .nav-toggle { position: relative; z-index: 1305; }
  }

  /* small tweak for very small screens */
  @media (max-width:420px){
    .menu a{ width:90%; padding:10px 8px; font-size:.95rem; }
  }
</style>

<script>
(function(){
  if (window.__SEECHUR_NAVBAR_INIT__) return;
  window.__SEECHUR_NAVBAR_INIT__ = true;

  const isMobile = () => window.matchMedia && window.matchMedia('(max-width: 768px)').matches;
  if (!isMobile()) return;

  // helpers to find *all* navs/menus/overlays
  const allNavs = () => Array.from(document.querySelectorAll('.site-nav'));
  const allMenus = () => Array.from(document.querySelectorAll('.menu, #mobileMenu'));
  const allToggles = () => Array.from(document.querySelectorAll('.nav-toggle, #navToggle'));
  const allOverlays = () => Array.from(document.querySelectorAll('.nav-overlay, #navOverlay'));

  function lockScroll(enable){
    if (enable) document.body.classList.add('nav-open');
    else document.body.classList.remove('nav-open');
  }

  function openAllMenus(sourceToggle){
    allNavs().forEach(nav => nav.classList.add('open'));
    allOverlays().forEach(o=>{
      o.classList.remove('hidden');
      o.removeAttribute('hidden');
      o.setAttribute('aria-hidden','false');
      o.style.display = 'block';
    });
    allToggles().forEach(t => t.setAttribute('aria-expanded','true'));
    lockScroll(true);
    // focus first visible menu link
    setTimeout(()=>{
      const first = document.querySelector('.site-nav.open .menu a, .site-nav.open #mobileMenu a');
      try{ first && first.focus(); }catch(e){}
    },60);
  }

  function closeAllMenus(){
    allNavs().forEach(nav => nav.classList.remove('open'));
    allOverlays().forEach(o=>{
      o.classList.add('hidden');
      try { o.setAttribute('hidden',''); } catch(e){}
      o.setAttribute('aria-hidden','true');
      o.style.display = 'none';
    });
    allToggles().forEach(t => t.setAttribute('aria-expanded','false'));
    lockScroll(false);
    // return focus to visible toggle if any
    try { const t = document.querySelector('.nav-toggle, #navToggle'); t && t.focus(); } catch(e){}
  }

  // attach toggle handlers for every toggle button present
  allToggles().forEach(toggle=>{
    // avoid double-attach
    if (toggle.__seechurToggleInit) return;
    toggle.__seechurToggleInit = true;

    toggle.addEventListener('click', (e)=>{
      e.preventDefault();
      e.stopPropagation();
      // If any nav is open, close all; else open all
      const anyOpen = allNavs().some(n=> n.classList.contains('open'));
      anyOpen ? closeAllMenus() : openAllMenus(toggle);
    }, {passive:false});
  });

  // overlay click closes all overlays (but only when clicking overlay itself)
  allOverlays().forEach(overlay=>{
    if (overlay.__seechurOverlayInit) return;
    overlay.__seechurOverlayInit = true;
    overlay.addEventListener('click', (e)=>{
      if (e.target === overlay) {
        e.preventDefault();
        e.stopPropagation();
        closeAllMenus();
      }
    }, {passive:false});
  });

  // ESC closes everything
  document.addEventListener('keydown', (e)=>{
    if (e.key === 'Escape') closeAllMenus();
  });

  // Patch links inside *all* menus so they close all overlays and then navigate.
  function patchAllMenuLinks(){
    allMenus().forEach(menu=>{
      const anchors = Array.from(menu.querySelectorAll('a'));
      anchors.forEach(orig=>{
        if (orig.__seechurPermPatched) return;
        orig.__seechurPermPatched = true;

        const clone = orig.cloneNode(true);
        clone.removeAttribute('onclick');

        clone.addEventListener('click', function(ev){
          // allow modifier clicks to open in new tab
          if (ev.metaKey || ev.ctrlKey || ev.button === 1) return;
          ev.preventDefault();
          ev.stopPropagation();

          // close overlays/drawers immediately for instant UI feedback
          closeAllMenus();

          // update active state visually
          try {
            document.querySelectorAll('.menu a').forEach(x=> x.classList.remove('active'));
            clone.classList.add('active');
          } catch(e){}

          const href = clone.getAttribute('href') || clone.href || '';
          // small delay to allow close animation; then navigate forcibly
          setTimeout(()=>{
            if (!href) return;
            if (href.startsWith('#')) { location.hash = href.slice(1); return; }
            try { location.href = new URL(href, location.href).href; } catch(e) { location.href = href; }
          }, 80);
        }, {passive:false});

        clone.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); clone.click(); } });

        orig.replaceWith(clone);
      });
    });
  }

  // initial patch and observe for CMS DOM rewrites
  patchAllMenuLinks();
  if (window.MutationObserver){
    const mo = new MutationObserver(()=> {
      // re-run patches (debounced mildly)
      setTimeout(()=> patchAllMenuLinks(), 80);
    });
    mo.observe(document.body, { childList:true, subtree:true });
  }

  // One-time safety: ensure everything hidden if some overlay was accidentally left visible
  setTimeout(()=> {
    // if any overlay visible but none of navs open, hide overlays
    const anyOpen = allNavs().some(n=> n.classList.contains('open'));
    if (!anyOpen) closeAllMenus();
  }, 300);
})();
</script>
