name: Post changed article JSONs to Telegram (staging)

# Trigger on pushes to staging branch (adjust if you use a different branch)
on:
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  notify-telegram:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl

      - name: Determine changed files in this push
        id: changes
        run: |
          set -euo pipefail

          # Robust changed-file detection: try git diff between HEAD and its parent.
          # If that fails (first commit), fall back to listing files in last commit.
          CHANGED=$(git diff --name-only "${GITHUB_SHA}" "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            CHANGED=$(git show --name-only --pretty="" "${GITHUB_SHA}" || true)
          fi

          echo "Raw changed files:"
          echo "$CHANGED"

          # Filter only JSON files (article jsons). Adjust grep pattern if your JSONs live elsewhere.
          JSON_FILES=$(printf "%s\n" "$CHANGED" | grep -E '\.json$' || true)

          # If no JSON files detected, as a safe fallback scan common article folders for recent changes
          if [ -z "$JSON_FILES" ]; then
            echo "No .json changed files detected by diff. Attempting fallback search in common folders..."
            JSON_FILES=$(git ls-files 'assets/articles/*.json' 'articles/*.json' 'content/articles/*.json' || true)
          fi

          # Normalize to newlines and output to step output
          JSON_FILES_CLEAN=$(printf "%s\n" "$JSON_FILES" | sed '/^\s*$/d' || true)

          echo "Detected JSON files:"
          printf "%s\n" "$JSON_FILES_CLEAN"

          # Export as step output (newline-separated)
          echo "::set-output name=json_files::$(printf "%s" "$JSON_FILES_CLEAN" | sed ':a;N;$!ba;s/\n/<<NL>>/g')"

      - name: Post each changed JSON to Telegram (caption sanitizer + image fallback)
        if: steps.changes.outputs.json_files != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          # Read newline-separated JSON file list from previous step (we used <<NL>> to encode newlines)
          RAW="${{ steps.changes.outputs.json_files }}"
          JSON_FILES=$(printf "%s" "$RAW" | sed 's/<<NL>>/\n/g')

          TELEGRAM_API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          SEND_PHOTO="${TELEGRAM_API}/sendPhoto"
          SEND_MESSAGE="${TELEGRAM_API}/sendMessage"

          # helper to collapse duplicate blank lines
          collapse_blank_lines() {
            awk 'BEGIN{blank=0} { if (NF==0) { if (!blank) { print ""; blank=1 } } else { print; blank=0 } }'
          }

          # For each changed JSON file, build caption and attempt upload
          for jf in $JSON_FILES; do
            if [ ! -f "$jf" ]; then
              echo "Skipping (not a file): $jf"
              continue
            fi

            echo "Processing JSON: $jf"

            # Extract fields; jq -r will decode escape sequences like "\n" into real newlines
            TITLE="$(jq -r '.title // empty' "$jf")"
            EXCERPT="$(jq -r '.excerpt // .description // empty' "$jf")"
            URL="$(jq -r '.url // .link // empty' "$jf")"
            RAW_COVER="$(jq -r '.cover_image // empty' "$jf")"

            echo "Extracted title: ${TITLE:-<none>}"
            echo "Extracted url: ${URL:-<none>}"
            echo "Extracted raw_cover: ${RAW_COVER:-<none>}"

            # Build caption pieces. Use printf so newlines are preserved.
            CAPTURE="$(printf "%s\n\n%s\n\n%s" "$TITLE" "$EXCERPT" "$URL")"

            # Trim leading/trailing spaces per line, collapse multiple blank lines to single blank line
            CLEANED="$(printf "%s" "$CAPTURE" \
              | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' \
              | awk '{ sub(/[[:space:]]+$/, ""); print }' \
              | collapse_blank_lines )"

            # Remove literal backslash-n sequences if any remain
            CLEANED="$(printf "%s" "$CLEANED" | sed 's/\\n/\n/g')"

            # Final preview in logs
            echo "----- CAPTION PREVIEW START -----"
            printf "%s\n" "$CLEANED"
            echo "----- CAPTION PREVIEW END -----"

            # Try to find a local image by scanning common directories:
            # - assets/articles/
            # - images/
            # - images/uploads/
            # - repo root (filename only)
            IMAGE_PATH=""
            # If raw_cover is already an absolute path or starts with ./ or / try it
            if [ -n "$RAW_COVER" ]; then
              # If the field is a filename only (no slash), try common folders
              if printf "%s" "$RAW_COVER" | grep -qE '^https?://'; then
                echo "Cover appears to be a URL; will try URL later: $RAW_COVER"
              else
                # Remove any leading "./"
                COV="$(printf "%s" "$RAW_COVER" | sed 's@^\./@@')"
                # Check common locations
                CHECKS=(
                  "./assets/articles/${COV}"
                  "./images/${COV}"
                  "./images/uploads/${COV}"
                  "./${COV}"
                )
                for p in "${CHECKS[@]}"; do
                  if [ -f "$p" ]; then
                    IMAGE_PATH="$p"
                    echo "Found local image candidate: $IMAGE_PATH"
                    break
                  fi
                done
              fi
            fi

            # If still empty, attempt a broad search for common filenames (basename match)
            if [ -z "$IMAGE_PATH" ] && [ -n "$RAW_COVER" ]; then
              BASENAME="$(basename "$RAW_COVER")"
              if [ -n "$BASENAME" ]; then
                echo "Searching repo for file basename: $BASENAME"
                FOUND=$(git ls-files | grep -E "/$BASENAME$" || true)
                if [ -n "$FOUND" ]; then
                  IMAGE_PATH="$(printf "%s\n" "$FOUND" | head -n1)"
                  echo "Found image via git ls-files: $IMAGE_PATH"
                fi
              fi
            fi

            # Upload attempt flags
            UPLOADED=0

            # Function: try send local file
            try_send_local() {
              local file="$1"
              echo "Trying local upload: $file"
              # Attempt with limited retries
              for i in 1 2 3; do
                echo "Local upload attempt #$i"
                RESP=$(curl -sS --show-error --fail --retry 2 --retry-delay 2 \
                  -F chat_id="${TELEGRAM_CHAT_ID}" \
                  -F "photo=@${file}" \
                  -F "caption=${CLEANED}" \
                  -F "parse_mode=HTML" \
                  "${SEND_PHOTO}" || true)
                echo "Response: $RESP"
                if printf "%s" "$RESP" | grep -q '"ok":true'; then
                  echo "Local photo upload OK"
                  return 0
                fi
                sleep 1
              done
              return 1
            }

            # Function: try send by URL
            try_send_url() {
              local url="$1"
              echo "Trying remote URL upload: $url"
              RESP=$(curl -sS --show-error --fail --data chat_id="${TELEGRAM_CHAT_ID}" \
                --data "photo=${url}" \
                --data "caption=${CLEANED}" \
                --data "parse_mode=HTML" \
                "${SEND_PHOTO}" || true)
              echo "Response: $RESP"
              if printf "%s" "$RESP" | grep -q '"ok":true'; then
                echo "Remote URL photo upload OK"
                return 0
              fi
              return 1
            }

            # 1) Try local file upload if a candidate exists
            if [ -n "$IMAGE_PATH" ] && [ -f "$IMAGE_PATH" ]; then
              if try_send_local "$IMAGE_PATH"; then
                UPLOADED=1
              else
                echo "Local upload attempts failed for $IMAGE_PATH"
              fi
            fi

            # 2) If not uploaded, and RAW_COVER is an http(s) url, try URL upload
            if [ "$UPLOADED" -eq 0 ] && printf "%s" "$RAW_COVER" | grep -qE '^https?://'; then
              if try_send_url "$RAW_COVER"; then
                UPLOADED=1
              else
                echo "Remote URL upload failed for $RAW_COVER"
              fi
            fi

            # 3) If still not uploaded, fallback to text-only sendMessage
            if [ "$UPLOADED" -eq 0 ]; then
              echo "Falling back to send text-only message."
              RESP=$(curl -sS --show-error --fail --data chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=${CLEANED}" \
                --data "parse_mode=HTML" \
                "${SEND_MESSAGE}" || true)
              echo "Text send response: $RESP"
              if ! printf "%s" "$RESP" | grep -q '"ok":true'; then
                echo "ERROR: Telegram text send also failed for $jf"
                # Do not abort whole job; continue with next JSON
              fi
            fi

            echo "Done processing $jf"
            echo "--------------------------------------------"
          done

      - name: No changed JSONs found notice
        if: steps.changes.outputs.json_files == ''
        run: |
          echo "No JSON files detected as changed in this push. Nothing to post to Telegram."
