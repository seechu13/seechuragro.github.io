name: Post changed article JSONs to X (staging) — upstream-safe, resize, neutral filename

on:
  push:
    branches:
      - staging
    paths:
      - 'assets/articles/**'
      - 'articles/**'
      - 'content/articles/**'
  workflow_run:
    workflows:
      - "Post changed article JSONs to social platforms (staging) — image resize & neutral doc name"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: post-x-${{ github.ref }}
  cancel-in-progress: false

env:
  MAX_WIDTH: "1280"
  JPEG_QUALITY: "85"

  UPSTREAM_WORKFLOW_FILE: "post-on-merge.yml"
  MAX_WAIT_SECONDS: "180"
  POLL_INTERVAL: "10"
  PROCEED_IF_UPSTREAM_MISSING: "false"
  SLEEP_SECONDS: "120"

  X_API_KEY: ${{ secrets.X_API_KEY }}
  X_API_SECRET: ${{ secrets.X_API_SECRET }}
  X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
  X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

jobs:
  post-x:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'staging')
    name: X — Post changed article JSONs (staging)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OS packages & Python deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl imagemagick git
          python3 -m pip install --upgrade pip
          pip install tweepy Pillow requests

      - name: If triggered by push — wait for upstream workflow completion
        if: github.event_name == 'push'
        id: upstream_wait
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          SHA="${GITHUB_SHA}"
          WORKFLOW_FILE="${UPSTREAM_WORKFLOW_FILE}"
          MAX_WAIT=${MAX_WAIT_SECONDS}
          POLL=${POLL_INTERVAL}
          PROCEED=${PROCEED_IF_UPSTREAM_MISSING}

          echo "Polling upstream workflow ${WORKFLOW_FILE} for commit ${SHA}..."

          API_URL="https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?head_sha=${SHA}"

          elapsed=0
          found="false"

          while [ "$elapsed" -le "$MAX_WAIT" ]; do
            resp=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" "$API_URL")
            run_id=$(echo "$resp" | jq -r '.workflow_runs[0].id // empty')

            if [ -n "$run_id" ]; then
              status=$(echo "$resp" | jq -r '.workflow_runs[0].status')
              conclusion=$(echo "$resp" | jq -r '.workflow_runs[0].conclusion')
              echo "Upstream run id=$run_id status=$status conclusion=$conclusion"

              if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
                echo "upstream_found=true" >> $GITHUB_OUTPUT
                echo "upstream_conclusion=success" >> $GITHUB_OUTPUT
                found="true"
                break
              fi

              if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
                echo "upstream_found=false" >> $GITHUB_OUTPUT
                echo "upstream_conclusion=$conclusion" >> $GITHUB_OUTPUT
                found="false"
                break
              fi
            else
              echo "No upstream run yet…"
            fi

            sleep "$POLL"
            elapsed=$((elapsed + POLL))
          done

          if [ "$found" = "false" ]; then
            echo "upstream_found=false" >> $GITHUB_OUTPUT
            if [ "$PROCEED" = "true" ]; then
              echo "Proceeding anyway (PROCEED_IF_UPSTREAM_MISSING=true)"
            else
              echo "Upstream not successful within wait window. Exiting."
              exit 1
            fi
          fi

      - name: Optional safety sleep
        if: >
          github.event_name == 'workflow_run' ||
          (github.event_name == 'push' &&
           steps.upstream_wait.outputs.upstream_found == 'true')
        run: |
          if [ "${SLEEP_SECONDS}" != "0" ]; then
            echo "Sleeping ${SLEEP_SECONDS}s for safety…"
            sleep "${SLEEP_SECONDS}"
          fi

      - name: Create scripts/send_x.py
        run: |
          mkdir -p scripts
          cat > scripts/send_x.py << 'PY'
#!/usr/bin/env python3
import os, sys, json, tempfile, shutil, subprocess, logging
from pathlib import Path
import requests

logging.basicConfig(level=logging.INFO, format="%(levelname)s: %(message)s")

try:
    import tweepy
except:
    logging.error("tweepy missing"); sys.exit(2)

try:
    from PIL import Image, UnidentifiedImageError
    PIL_AVAILABLE = True
except:
    PIL_AVAILABLE = False

MAX_WIDTH = int(os.getenv("MAX_WIDTH", "1280"))
JPEG_QUALITY = int(os.getenv("JPEG_QUALITY", "85"))

X_API_KEY = os.getenv("X_API_KEY")
X_API_SECRET = os.getenv("X_API_SECRET")
X_ACCESS_TOKEN = os.getenv("X_ACCESS_TOKEN")
X_ACCESS_SECRET = os.getenv("X_ACCESS_SECRET")

def normalize(raw):
    if not raw: return ""
    s = raw.strip()
    if s.startswith("http://") or s.startswith("https://"):
        parts = s.split("/", 3)
        return parts[3] if len(parts) >= 4 else Path(s).name
    return s.lstrip("./").lstrip("/")

def find_local_image(candidate, jf):
    exts = ["jpg","jpeg","png","webp","gif"]
    name = Path(candidate).name
    base = Path(name).stem

    checks = [
        Path(candidate),
        jf.parent / name,
        Path("assets/articles")/name,
        Path("images")/name,
        Path("images/uploads")/name,
        Path(name),
    ]
    for p in checks:
        if p.exists(): return p.resolve()

    for ext in exts:
        for p in [
            Path("assets/articles")/f"{base}.{ext}",
            Path("images")/f"{base}.{ext}",
            Path("images/uploads")/f"{base}.{ext}",
            Path(f"{base}.{ext}"),
            jf.parent/f"{base}.{ext}",
        ]:
            if p.exists(): return p.resolve()

    try:
        out = subprocess.check_output(["git","ls-files"], text=True)
        for line in out.splitlines():
            if Path(line).stem == base and Path(line).exists():
                return Path(line).resolve()
    except:
        pass

    return None

def resize_im(src):
    try:
        tmp = Path(tempfile.mktemp(suffix=".jpg"))
        subprocess.check_call([
            "convert", str(src),
            "-resize", f"{MAX_WIDTH}x>",
            "-strip", "-quality", str(JPEG_QUALITY),
            str(tmp)
        ])
        return tmp
    except:
        return None

def resize_pillow(src):
    if not PIL_AVAILABLE: return None
    try:
        img = Image.open(src)
        w,h = img.size
        if w <= MAX_WIDTH:
            tmp = Path(tempfile.mktemp(suffix=".jpg"))
            if img.mode!="RGB":
                img = img.convert("RGB")
            img.save(tmp, format="JPEG", quality=JPEG_QUALITY)
            return tmp
        nh = int(h * (MAX_WIDTH/w))
        img = img.resize((MAX_WIDTH, nh), Image.LANCZOS)
        if img.mode!="RGB":
            img = img.convert("RGB")
        tmp = Path(tempfile.mktemp(suffix=".jpg"))
        img.save(tmp, format="JPEG", quality=JPEG_QUALITY)
        return tmp
    except:
        return None

def caption(t, e, u):
    parts=[p for p in [t,e,u] if p]
    out="\n\n".join(parts).strip()
    return out[:2800]

def post_text(api, text):
    try:
        api.update_status(status=text)
        return True
    except Exception as e:
        logging.error(e); return False

def post_media(api, text, img):
    tmp = Path(tempfile.mktemp(suffix=".jpg"))
    shutil.copyfile(img, tmp)
    try:
        media = api.media_upload(str(tmp))
        mid = getattr(media, "media_id_string", None)
        api.update_status(status=text, media_ids=[mid])
        return True
    except Exception as e:
        logging.error(e); return False
    finally:
        tmp.unlink(missing_ok=True)

def main():
    if len(sys.argv)<2:
        print("Usage: send_x.py file.json"); sys.exit(2)
    jf = Path(sys.argv[1])
    data = json.loads(jf.read_text())
    title = data.get("title","")
    excerpt = data.get("excerpt") or data.get("description","")
    url = data.get("url") or data.get("link","")
    raw = data.get("cover_image","")

    cap = caption(title,excerpt,url)

    auth = tweepy.OAuth1UserHandler(
        X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET
    )
    api = tweepy.API(auth, wait_on_rate_limit=True)

    img_final=None
    tmp_resized=None

    if raw.startswith("http"):
        try:
            r = requests.get(raw, stream=True, timeout=20); r.raise_for_status()
            tmp = Path(tempfile.mktemp(suffix=".jpg"))
            with open(tmp,"wb") as f:
                for c in r.iter_content(8192): f.write(c)
            img_final=tmp
        except:
            img_final=None
    else:
        norm = normalize(raw)
        found = find_local_image(norm, jf)
        img_final = found or None

    if not img_final:
        found = find_local_image(jf.stem, jf)
        img_final = found or None

    if img_final:
        tmp = resize_im(img_final)
        if not tmp:
            tmp = resize_pillow(img_final)
        if tmp:
            tmp_resized = tmp

    ok=False
    if tmp_resized:
        ok = post_media(api, cap, tmp_resized)
        tmp_resized.unlink(missing_ok=True)
    elif img_final:
        ok = post_media(api, cap, img_final)
        if str(img_final).startswith("/tmp"):
            img_final.unlink(missing_ok=True)
    else:
        ok = post_text(api, cap)

    sys.exit(0 if ok else 3)

if __name__=="__main__":
    main()
PY

      - name: Detect changed JSONs
        id: changes_x
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "${GITHUB_SHA}" "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            CHANGED=$(git show --name-only --pretty="" "${GITHUB_SHA}" || true)
          fi
          JSONS=$(printf "%s\n" "$CHANGED" | grep -E '\.json$' || true)
          if [ -z "$JSONS" ]; then
            JSONS=$(git ls-files 'assets/articles/*.json' 'articles/*.json' 'content/articles/*.json' || true)
          fi
          CLEAN=$(printf "%s\n" "$JSONS" | sed '/^\s*$/d' || true)
          if [ -z "$CLEAN" ]; then
            echo "json_files=" >> $GITHUB_OUTPUT
          else
            echo "json_files=$(printf "%s" "$CLEAN" | sed ':a;N;$!ba;s/\n/<<NL>>/g')" >> $GITHUB_OUTPUT
          fi

      - name: Post each JSON to X
        if: steps.changes_x.outputs.json_files != ''
        run: |
          set -euo pipefail
          RAW="${{ steps.changes_x.outputs.json_files }}"
          LIST=$(printf "%s" "$RAW" | sed 's/<<NL>>/\n/g')

          for jf in $LIST; do
            if [ ! -f "$jf" ]; then
              echo "Skipping: $jf"
              continue
            fi
            echo "Posting: $jf"
            python3 scripts/send_x.py "$jf"
            echo "--------------------------------"
          done

      - name: No JSONs found notice
        if: steps.changes_x.outputs.json_files == ''
        run: echo "No changed JSONs — nothing to post to X."
