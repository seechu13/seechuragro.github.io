<div class="nav-overlay" id="navOverlay"></div>

<script>
(() => {
  const nav=document.getElementById('siteNav');
  const btn=document.getElementById('navToggle');
  const overlay=document.getElementById('navOverlay');

  function openM(){ nav.classList.add('open'); btn.setAttribute('aria-expanded','true'); document.body.style.overflow='hidden'; }
  function closeM(){ nav.classList.remove('open'); btn.setAttribute('aria-expanded','false'); document.body.style.overflow=''; }

  btn?.addEventListener('click', ()=> nav.classList.contains('open') ? closeM() : openM());
  overlay?.addEventListener('click', closeM);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeM(); });

  const current=(location.pathname.split('/').pop()||'index.html').toLowerCase();
  document.querySelectorAll('.menu a').forEach(a=>{
    if(a.getAttribute('href').toLowerCase()===current) a.classList.add('active');
  });
})();
</script>
