name: Post changed article JSONs to X (staging) — upstream-safe, image-resize, neutral filename

on:
  push:
    branches:
      - staging
    paths:
      - 'assets/articles/**'
      - 'articles/**'
      - 'content/articles/**'
  workflow_run:
    workflows:
      - "Post changed article JSONs to social platforms (staging) — image resize & neutral doc name"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: post-x-${{ github.ref }}
  cancel-in-progress: false

env:
  MAX_WIDTH: "1280"
  JPEG_QUALITY: "85"
  UPSTREAM_WORKFLOW_FILE: "post-on-merge.yml"
  MAX_WAIT_SECONDS: "180"
  POLL_INTERVAL: "10"
  PROCEED_IF_UPSTREAM_MISSING: "false"
  SLEEP_SECONDS: "120"
  X_API_KEY: ${{ secrets.X_API_KEY }}
  X_API_SECRET: ${{ secrets.X_API_SECRET }}
  X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
  X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

jobs:
  post-x:
    # Allow runs both when triggered by workflow_run (upstream already finished)
    # and when triggered by push (we'll poll for upstream run in that case).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging')

    name: X — Post changed article JSONs (staging)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OS packages & Python deps (including ImageMagick)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl imagemagick git
          python -m pip install --upgrade pip
          pip install --quiet tweepy Pillow requests

      - name: If triggered by push — wait for upstream workflow completion (poll)
        if: github.event_name == 'push'
        id: upstream_wait
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          SHA="${GITHUB_SHA}"
          WORKFLOW_FILE="${UPSTREAM_WORKFLOW_FILE}"
          MAX_WAIT=${MAX_WAIT_SECONDS}
          POLL=${POLL_INTERVAL}
          PROCEED=${PROCEED_IF_UPSTREAM_MISSING}
          API_URL="https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?head_sha=${SHA}"

          echo "Polling for upstream workflow run for ${WORKFLOW_FILE} at commit ${SHA} (max ${MAX_WAIT}s)..."

          elapsed=0
          found_success=false

          while [ "$elapsed" -le "$MAX_WAIT" ]; do
            resp=$(curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" "$API_URL")
            run_id=$(echo "$resp" | jq -r '.workflow_runs[0].id // empty')
            if [ -n "$run_id" ]; then
              status=$(echo "$resp" | jq -r '.workflow_runs[0].status // empty')
              conclusion=$(echo "$resp" | jq -r '.workflow_runs[0].conclusion // empty')
              echo "Found run id=$run_id, status=$status, conclusion=$conclusion"
              if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
                echo "upstream_conclusion=success" >> $GITHUB_OUTPUT
                found_success=true
                break
              fi
              if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
                echo "upstream_conclusion=${conclusion}" >> $GITHUB_OUTPUT
                found_success=false
                break
              fi
            else
              echo "No upstream run found yet for this commit"
            fi
            sleep "$POLL"
            elapsed=$((elapsed + POLL))
          done

          if [ "$found_success" = "true" ]; then
            echo "upstream_found=true" >> $GITHUB_OUTPUT
          else
            echo "upstream_found=false" >> $GITHUB_OUTPUT
            if [ "$PROCEED" = "true" ]; then
              echo "Proceeding despite upstream missing/failed (PROCEED_IF_UPSTREAM_MISSING=true)"
              echo "upstream_conclusion=missing_or_failed" >> $GITHUB_OUTPUT
            else
              echo "Upstream did not finish successfully within wait window. Exiting to avoid conflict."
              exit 1
            fi
          fi

      - name: Optional safety sleep after upstream success
        if: >-
          github.event_name == 'workflow_run' ||
          (github.event_name == 'push' && steps.upstream_wait.outputs.upstream_found == 'true')
        run: |
          if [ "${SLEEP_SECONDS}" != "0" ]; then
            echo "Sleeping ${SLEEP_SECONDS}s as safety delay..."
            sleep "${SLEEP_SECONDS}"
          else
            echo "No safety sleep configured"
          fi

      - name: Create runner-local scripts/send_x.py (self-contained, ImageMagick first)
        run: |
          mkdir -p scripts
          cat > scripts/send_x.py << 'PY'
#!/usr/bin/env python3
"""
scripts/send_x.py
Usage: python3 scripts/send_x.py path/to/article.json

Respects the same heuristics used by Telegram/LinkedIn:
- normalize cover_image path
- search local paths and git ls-files fallback
- resize using ImageMagick 'convert' first; fallback to Pillow
- post to X (tweepy, OAuth1), using neutral filename copy for uploads
"""
import os, sys, json, tempfile, shutil, subprocess, logging
from pathlib import Path
import requests

logging.basicConfig(level=logging.INFO, format="%(levelname)s: %(message)s")

try:
    import tweepy
except Exception:
    logging.error("tweepy is required; please install it.")
    sys.exit(2)

try:
    from PIL import Image
    PIL_AVAILABLE = True
except Exception:
    PIL_AVAILABLE = False

MAX_WIDTH = int(os.getenv("MAX_WIDTH", "1280"))
JPEG_QUALITY = int(os.getenv("JPEG_QUALITY", "85"))

X_API_KEY = os.getenv("X_API_KEY")
X_API_SECRET = os.getenv("X_API_SECRET")
X_ACCESS_TOKEN = os.getenv("X_ACCESS_TOKEN")
X_ACCESS_SECRET = os.getenv("X_ACCESS_SECRET")

if not all([X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET]):
    logging.error("Missing X credentials in environment.")
    sys.exit(2)

def normalize_cover_path(raw):
    if not raw:
        return ""
    s = raw.strip()
    if s.startswith("http://") or s.startswith("https://"):
        parts = s.split("/", 3)
        return parts[3] if len(parts) >= 4 else Path(parts[-1]).name
    return s.lstrip("./").lstrip("/")

def find_local_image(candidate, json_path):
    exts = ["jpg","jpeg","png","webp","gif"]
    cand_name = Path(candidate).name
    base = Path(cand_name).stem

    candidates = [
        Path(candidate),
        json_path.parent / cand_name,
        Path("assets/articles") / cand_name,
        Path("images") / cand_name,
        Path("images/uploads") / cand_name,
        Path(cand_name),
    ]
    for p in candidates:
        if p.exists() and p.is_file():
            return p.resolve()

    for ext in exts:
        for p in [
            Path("assets/articles") / f"{base}.{ext}",
            Path("images") / f"{base}.{ext}",
            Path("images/uploads") / f"{base}.{ext}",
            json_path.parent / f"{base}.{ext}",
            Path(f"{base}.{ext}"),
        ]:
            if p.exists() and p.is_file():
                return p.resolve()

    try:
        out = subprocess.check_output(["git","ls-files"], text=True)
        for line in out.splitlines():
            if Path(line).stem == base and Path(line).exists():
                return Path(line).resolve()
    except Exception:
        pass

    return None

def resize_with_imagemagick(src, maxw, quality):
    try:
        tmp = Path(tempfile.mktemp(suffix=".jpg"))
        cmd = ["convert", str(src), "-resize", f"{maxw}x>", "-strip", "-quality", str(quality), str(tmp)]
        subprocess.check_call(cmd)
        return tmp.resolve()
    except Exception:
        return None

def resize_with_pillow(src, maxw, quality):
    if not PIL_AVAILABLE:
        return None
    try:
        img = Image.open(src)
        w,h = img.size
        if w <= maxw:
            tmp = Path(tempfile.mktemp(suffix=".jpg"))
            if img.mode in ("RGBA","LA") or img.mode=="P":
                img = img.convert("RGB")
            img.save(tmp, format="JPEG", quality=quality)
            return tmp.resolve()
        ratio = maxw / w
        nh = int(h * ratio)
        img = img.resize((maxw, nh), Image.LANCZOS)
        if img.mode in ("RGBA","LA") or img.mode=="P":
            img = img.convert("RGB")
        tmp = Path(tempfile.mktemp(suffix=".jpg"))
        img.save(tmp, format="JPEG", quality=quality)
        return tmp.resolve()
    except Exception:
        return None

def compose_caption(title, excerpt, url):
    parts = []
    if title: parts.append(title.strip())
    if excerpt: parts.append(excerpt.strip())
    if url: parts.append(url.strip())
    cap = "\n\n".join(parts).strip()
    return cap[:2800]

def post_text(api, text):
    try:
        resp = api.update_status(status=text)
        logging.info("Posted text-only; id=%s", getattr(resp, "id", "<id>"))
        return True
    except Exception as e:
        logging.error("Post text failed: %s", e)
        return False

def post_with_media(api, text, image_path):
    tmp_neutral = Path(tempfile.mktemp(suffix=".jpg"))
    try:
        shutil.copyfile(image_path, tmp_neutral)
    except Exception as e:
        logging.error("Failed copying file for neutral filename: %s", e)
        return False
    try:
        media = api.media_upload(str(tmp_neutral))
        media_id = getattr(media, "media_id_string", getattr(media, "media_id", None))
        if not media_id:
            logging.error("No media id from upload")
            return False
        resp = api.update_status(status=text, media_ids=[media_id])
        logging.info("Posted with media; id=%s", getattr(resp, "id", "<id>"))
        return True
    except Exception as e:
        logging.error("Upload/post failed: %s", e)
        return False
    finally:
        try: tmp_neutral.unlink(missing_ok=True)
        except: pass

def main():
    if len(sys.argv) < 2:
        print("Usage: send_x.py <jsonfile>")
        sys.exit(2)
    jf = Path(sys.argv[1])
    if not jf.exists():
        logging.error("JSON not found: %s", jf)
        sys.exit(2)

    data = json.loads(jf.read_text(encoding="utf-8"))
    title = data.get("title", "")
    excerpt = data.get("excerpt", data.get("description", ""))
    url = data.get("url", data.get("link", ""))
    raw_cover = data.get("cover_image", "")

    caption = compose_caption(title, excerpt, url)

    # Authenticate X (tweepy OAuth1)
    try:
        auth = tweepy.OAuth1UserHandler(X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET)
        api = tweepy.API(auth, wait_on_rate_limit=True)
        api.verify_credentials()
    except Exception as e:
        logging.error("Tweepy auth failed: %s", e)
        sys.exit(2)

    image_final = None
    tmp_resized = None

    if raw_cover:
        if raw_cover.startswith("http://") or raw_cover.startswith("https://"):
            try:
                r = requests.get(raw_cover, stream=True, timeout=20)
                r.raise_for_status()
                tmp_dl = Path(tempfile.mktemp(suffix=".jpg"))
                with open(tmp_dl, "wb") as fh:
                    for chunk in r.iter_content(8192):
                        fh.write(chunk)
                image_final = tmp_dl
            except Exception as e:
                logging.warning("Download failed: %s", e)
                image_final = None
        else:
            norm = normalize_cover_path(raw_cover)
            found = find_local_image(norm, jf)
            if found:
                image_final = found

    if not image_final:
        found = find_local_image(jf.stem, jf)
        if found:
            image_final = found

    if image_final:
        resized = resize_with_imagemagick(image_final, MAX_WIDTH, JPEG_QUALITY)
        if resized:
            tmp_resized = resized
        else:
            resized2 = resize_with_pillow(image_final, MAX_WIDTH, JPEG_QUALITY)
            if resized2:
                tmp_resized = resized2

    uploaded = False
    if tmp_resized and tmp_resized.exists():
        uploaded = post_with_media(api, caption, tmp_resized)
    elif image_final and image_final.exists():
        uploaded = post_with_media(api, caption, image_final)
    else:
        uploaded = post_text(api, caption)

    try:
        if tmp_resized and tmp_resized.exists(): tmp_resized.unlink(missing_ok=True)
        if image_final and image_final.exists() and str(image_final).startswith("/tmp"): image_final.unlink(missing_ok=True)
    except Exception:
        pass

    if uploaded:
        logging.info("done")
        sys.exit(0)
    else:
        logging.error("failed to post")
        sys.exit(3)

if __name__ == "__main__":
    main()
PY

      - name: Determine changed JSONs (same heuristic)
        id: changes_x
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "${GITHUB_SHA}" "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            CHANGED=$(git show --name-only --pretty="" "${GITHUB_SHA}" || true)
          fi
          JSON_FILES=$(printf "%s\n" "$CHANGED" | grep -E '\.json$' || true)
          if [ -z "$JSON_FILES" ]; then
            JSON_FILES=$(git ls-files 'assets/articles/*.json' 'articles/*.json' 'content/articles/*.json' || true)
          fi
          JSON_FILES_CLEAN=$(printf "%s\n" "$JSON_FILES" | sed '/^\s*$/d' || true)
          if [ -z "$JSON_FILES_CLEAN" ]; then
            echo "json_files=" >> $GITHUB_OUTPUT
          else
            ENC=$(printf "%s" "$JSON_FILES_CLEAN" | sed ':a;N;$!ba;s/\n/<<NL>>/g')
            echo "json_files=${ENC}" >> $GITHUB_OUTPUT
          fi

      - name: Post each changed JSON to X (runner script)
        if: steps.changes_x.outputs.json_files != ''
        run: |
          set -euo pipefail
          RAW="${{ steps.changes_x.outputs.json_files }}"
          JSON_FILES=$(printf "%s" "$RAW" | sed 's/<<NL>>/\n/g')
          for jf in $JSON_FILES; do
            if [ ! -f "$jf" ]; then
              echo "Skipping (not a file): $jf"
              continue
            fi
            echo "Processing: $jf"
            python3 scripts/send_x.py "$jf"
            echo "Done: $jf"
            echo "-----------------------------------"
          done

      - name: No changed JSONs found notice (X)
        if: steps.changes_x.outputs.json_files == ''
        run: |
          echo "No JSON files detected as changed in this trigger. Nothing to post to X."
