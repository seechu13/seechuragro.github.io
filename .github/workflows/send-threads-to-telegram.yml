name: Send Threads Post to Telegram

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Generate Instagram + Threads Assets (AUTO)"
      - "Manual Generate Instagram + Threads Assets"
    types:
      - completed

permissions:
  contents: read

jobs:
  send-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (staging)
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate inputs
        run: |
          set -euo pipefail
          test -f threads.json
          test -d social/insta/images

      - name: Send Threads post to Telegram
        env:
          BOT_TOKEN: ${{ secrets.THREADS_TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.THREADS_TELEGRAM_CHAT_ID }}
        run: |
          python3 <<'PYCODE'
          import json
          import os
          import requests
          from pathlib import Path

          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = os.environ["CHAT_ID"]

          with open("threads.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          caption = data["caption"]

          img_dir = Path("social/insta/images")
          images = sorted(img_dir.glob("*.jpg"))[:4]

          if not images:
              raise SystemExit("❌ No Instagram images found for Telegram")

          files = {}
          media = []

          for i, img in enumerate(images):
              key = f"photo{i}"
              files[key] = img.open("rb")

              item = {
                  "type": "photo",
                  "media": f"attach://{key}"
              }

              if i == 0:
                  item["caption"] = caption

              media.append(item)

          resp = requests.post(
              f"https://api.telegram.org/bot{BOT_TOKEN}/sendMediaGroup",
              data={
                  "chat_id": CHAT_ID,
                  "media": json.dumps(media)
              },
              files=files,
              timeout=30
          )

          if resp.status_code != 200:
              print(resp.text)
              raise SystemExit("❌ Telegram send failed")

          print("✅ Threads post sent to Telegram")
          PYCODE
