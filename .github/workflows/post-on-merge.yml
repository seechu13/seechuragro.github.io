          # export outputs
          CAPTION="$(python -c "import json; print(json.load(open('/tmp/article_parse.json'))['title'] if True else '')")"
          # The second python produced the final /tmp json
          FINAL_JSON="$(python - <<'PY'
import json
a=json.load(open('/tmp/article_parse.json',encoding='utf-8'))
title=a.get('title','').strip()
summary=a.get('summary','').strip()
img=a.get('image','').strip()
base = "$SITE_URL"
import os
article_file = "${{ steps.detect.outputs.article }}"
if not article_file:
    article_file = ''
name = ''
if article_file:
    name = os.path.splitext(os.path.basename(article_file))[0]
