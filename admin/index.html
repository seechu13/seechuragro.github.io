<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Seechur Agro — Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Netlify Identity Widget only (load first). We will load Decap CMS later after auth. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    /* Background image layer that cannot block clicks */
    .bg {
      position: fixed; inset: 0;
      background: #0b1a0f url("../hydroponic-bg.jpg?v=31") center/cover no-repeat;
      filter: saturate(1.05) brightness(.95);
      pointer-events: none;   /* <- important: never block clicks */
    }
    /* Foreground panel */
    .wrap {
      position: relative; z-index: 10;   /* <- ensure it’s on top and clickable */
      min-height: 100%;
      display: grid;
      place-items: center;
    }
    .panel {
      width: 92%; max-width: 560px;
      padding: 28px 22px;
      text-align: center;
      color: #eafff5;
      background: rgba(0, 0, 0, .50);
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0,0,0,.55);
      backdrop-filter: blur(2px);
    }
    .logo {
      width: 64px; height: 64px; border-radius: 12px; object-fit: cover; margin-bottom: 10px;
    }
    h1 { font-size: 1.35rem; margin: 6px 0 10px; }
    p  { margin: 0 0 18px; line-height: 1.55; color: #d8fff0; }
    .btn {
      display: inline-block; cursor: pointer;
      padding: 11px 20px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.14); color: #eafff5;
      font-weight: 700; text-decoration: none;
      transition: filter .15s ease, background .15s ease;
      position: relative; z-index: 20;   /* <- button itself is above everything */
    }
    .btn:hover { background: rgba(255,255,255,.22); }
    .hint { font-size: .9rem; opacity: .9; margin-top: 8px; }

    /* Safety: if anything else on the page uses ::before overlays, disable their pointer events */
    *, *::before, *::after { pointer-events: auto; } /* default */
    body::before { pointer-events: none !important; } /* just in case a theme adds one */
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="wrap">
    <div class="panel">
      <img src="../logo.png?v=27" alt="Seechur Agro" class="logo" />
      <h1>Seechur Agro — Admin</h1>
      <p>If you clicked an invite link and don’t see “Set password”, click below to open the login window.</p>
      <a id="loginBtn" class="btn" href="#">Log in</a>
      <div id="status" class="hint"></div>
    </div>
  </div>

  <script>
    // --- Utilities ---
    const $ = (sel) => document.querySelector(sel);
    const statusMsg = (t) => { const s = $('#status'); if (s) s.textContent = t || ''; };

    function whenIdentityReady(cb) {
      if (window.netlifyIdentity) { cb(); return; }
      let tries = 0;
      const timer = setInterval(() => {
        tries++;
        if (window.netlifyIdentity) { clearInterval(timer); cb(); }
        else if (tries > 40) { clearInterval(timer); statusMsg('Identity failed to load. Refresh and try again.'); }
      }, 150);
    }

    function loadDecapCMS() {
      // Load Decap CMS only after we’re authenticated or user finished invite flow
      if (document.getElementById('decap-loader')) return;
      const s = document.createElement('script');
      s.id = 'decap-loader';
      s.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
      document.body.appendChild(s);
    }

    // --- Main ---
    whenIdentityReady(() => {
      const id = window.netlifyIdentity;
      id.init();
      statusMsg('');

      // Make the button definitely clickable
      const btn = $('#loginBtn');
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        statusMsg('Opening login…');
        id.open('login');
      });

      // If user is already logged in, go straight into CMS
      id.on('init', (user) => {
        if (user) {
          statusMsg('Logged in. Loading CMS…');
          loadDecapCMS();
        } else {
          statusMsg('');
        }
      });

      // After login -> load CMS
      id.on('login', () => {
        statusMsg('Login successful. Loading CMS…');
        loadDecapCMS();
      });

      // Accept invite tokens automatically (supports both formats)
      const h = window.location.hash || '';
      const m1 = h.match(/#\/invite\/([^/?#]+)/);
      const m2 = h.match(/invite_token=([^&]+)/);
      const token = m1 ? m1[1] : (m2 ? m2[1] : null);

      if (token) {
        statusMsg('Invite detected. Preparing signup…');
        id.on('init', (user) => {
          if (!user) {
            id.acceptInvite(token)
              .then(() => { statusMsg('Invite accepted. Opening signup…'); id.open('signup'); })
              .catch((err) => {
                console.error('Invite accept failed', err);
                statusMsg('Invite detected, but could not open signup. Click “Log in”.');
                id.open('login');
              });
          }
        });
      } else {
        // As a convenience, auto-open the login after ~1s if not logged in.
        setTimeout(() => {
          const u = id.currentUser();
          if (!u) { id.open('login'); }
        }, 1000);
      }
    });
  </script>
</body>
</html>
