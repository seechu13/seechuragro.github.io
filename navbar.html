<!-- navbar.html (mobile fixes applied) -->
<nav class="site-nav" id="siteNav">
  <div class="nav-inner">
    <a class="brand" href="/" aria-label="Seechur Agro home">
      <img src="/logo.png?v=27" alt="Seechur Agro logo" />
    </a>

    <!-- Mobile hamburger -->
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mobileMenu" aria-label="Open Menu">
      ☰ Menu
    </button>

    <!-- Menu (drawer on mobile) -->
    <div class="menu" id="mobileMenu" role="navigation" aria-label="Primary">
      <a href="/index.html">Home</a>
      <a href="/about.html">About</a>
      <a href="/why-lakadong.html">Why Lakadong</a>
      <a href="/portfolio.html">Portfolio</a>
      <a href="/market.html">Market</a>
      <a href="/financials.html">Financials</a>
      <a href="/team.html">Team</a>
      <a href="/faq.html">FAQ</a>
      <a href="/advisors.html">Advisors</a>
      <a href="/articles.html">Articles</a>
      <a href="/contact.html">Contact</a>
      <a href="/investor-pack.html">Investor Pack</a>
    </div>
  </div>
</nav>

<div class="nav-overlay" id="navOverlay" hidden></div>

<style>
  :root{
    --nav-bg: rgba(10,25,10,0.78);
    --nav-solid: #1b4332;
    --nav-height: 74px;
  }

  .site-nav{
    position: sticky;
    top: 0;
    z-index: 1120;
    background: var(--nav-bg);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .nav-inner{
    max-width: 1100px;
    margin: 0 auto;
    padding: 10px 18px;
    display:flex;
    align-items:center;
    gap:16px;
    min-height: var(--nav-height);
  }

  .brand { display:flex; align-items:center; text-decoration:none; }
  .brand img {
    width:110px;
    height:auto;
    object-fit:contain;
    display:block;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.45));
  }

  .menu {
    margin-left: auto;
    display:flex;
    gap:18px;
    align-items:center;
    flex-wrap:wrap;
  }
  .menu a {
    color:#ffffff;
    text-decoration:none;
    padding:8px 12px;
    border-radius:999px;
    transition: background .18s ease, transform .12s ease;
    font-weight:600;
  }
  .menu a:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }
  .menu a.active { background: rgba(255,255,255,0.12); }

  .nav-toggle{
    display:none;
    margin-left:auto;
    border:1px solid rgba(255,255,255,0.18);
    background: rgba(0,0,0,0.25);
    color: #eafff5;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
  }

  .nav-overlay{ display:none; }

  @media (max-width: 768px){
    .brand img { width: 84px; }
    .nav-toggle{ display:inline-block; }

    /* Drawer off-screen and layered above overlay */
    .menu {
      position: fixed;
      top: 0;
      right: -100%;              /* fully off-screen when closed */
      width: 84%;
      height: 100vh;
      margin: 0;
      display:flex;
      flex-direction: column;
      gap: 14px;
      padding: 28px 18px;
      background: var(--nav-solid);
      border-left: 1px solid rgba(255,255,255,0.06);
      box-shadow: -10px 0 28px rgba(0,0,0,0.45);
      transition: right .28s cubic-bezier(.2,.9,.2,1);
      overflow-y:auto;
      z-index: 1130;             /* above overlay + page */
      -webkit-overflow-scrolling: touch;
    }

    .menu a{
      padding:14px 18px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      color: #eafff5;
      font-size:1.05rem;
      text-align:center;
    }
    .menu a:hover { background: rgba(255,255,255,0.08); }

    .site-nav.open .menu { right: 0; } /* slide in */

    .nav-overlay{
      position: fixed;
      inset: 0;
      z-index: 1125;             /* below the drawer but above page */
      background: rgba(0,0,0,0.52);
      backdrop-filter: blur(2px);
      transition: opacity .16s ease;
    }
    .site-nav.open + .nav-overlay{ display:block; }

    /* ensure toggle is easy to tap (left side) */
    .nav-toggle { z-index: 1140; position: relative; }
  }

  @media (max-width: 420px){
    .menu a { font-size: 1rem; padding:12px 14px; }
  }
</style>

<script>
(function(){
  if (window.__SEECHUR_NAVBAR_INIT__) return;
  window.__SEECHUR_NAVBAR_INIT__ = true;

  const nav = document.getElementById('siteNav');
  const toggle = document.getElementById('navToggle');
  const overlay = document.getElementById('navOverlay');
  const menu = document.getElementById('mobileMenu');

  function openMenu(){
    nav.classList.add('open');
    if (toggle) toggle.setAttribute('aria-expanded','true');
    if (overlay) overlay.removeAttribute('hidden');
    document.body.style.overflow = 'hidden';
    // For iOS - ensure body doesn't jump
    document.documentElement.style.touchAction = 'none';
  }
  function closeMenu(){
    nav.classList.remove('open');
    if (toggle) toggle.setAttribute('aria-expanded','false');
    if (overlay) overlay.setAttribute('hidden','');
    document.body.style.overflow = '';
    document.documentElement.style.touchAction = '';
  }

  if (toggle) toggle.addEventListener('click', ()=> {
    nav.classList.contains('open') ? closeMenu() : openMenu();
  });
  if (overlay) overlay.addEventListener('click', closeMenu);

  document.addEventListener('keydown', (e)=> { if (e.key === 'Escape') closeMenu(); });

  // Close drawer on navigation (tap a link) - helps mobile UX
  if (menu){
    menu.addEventListener('click', (ev) => {
      const a = ev.target.closest && ev.target.closest('a');
      if (a && a.getAttribute('href')) {
        // small timeout so navigation can start
        setTimeout(()=> closeMenu(), 120);
      }
    }, {passive:true});
  }

  // Active link logic
  (function highlightActive(){
    const path = (location.pathname || '/').toLowerCase();
    const normalized = path.endsWith('/') && path.length>1 ? path.slice(0,-1) : path;

    let activeHref = '/index.html';
    if (normalized === '/' || normalized === '/index.html') {
      activeHref = '/index.html';
    } else if (normalized.startsWith('/articles/') || normalized === '/articles' || normalized.endsWith('/articles.html')) {
      activeHref = '/articles.html';
    } else {
      const parts = normalized.split('/');
      const last = parts[parts.length-1] || 'index.html';
      activeHref = '/' + last;
    }

    function apply(){
      document.querySelectorAll('.menu a').forEach(a=>{
        const href = (a.getAttribute('href')||'').toLowerCase();
        const hrefNorm = href.startsWith('/') ? href : ('/' + href.replace(/^\.\//,''));
        if (hrefNorm === activeHref || (activeHref === '/index.html' && (hrefNorm === '/' || hrefNorm === '/index.html'))){
          a.classList.add('active');
        } else {
          a.classList.remove('active');
        }
      });
    }

    apply();
    if (window.MutationObserver){
      const mo = new MutationObserver(()=> apply());
      mo.observe(document.querySelector('.menu') || document.body, { childList:true, subtree:true });
    }
  })();

})();
</script>
