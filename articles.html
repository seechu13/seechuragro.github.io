<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Articles • Seechur Agro Private Limited</title>
<meta name="description" content="Insights on hydroponics, Lakadong turmeric, microgreens, and sustainable farming from Seechur Agro." />

<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<!-- inline navbar placeholder will be loaded from navbar.html on the client -->
<div id="navbar-placeholder"></div>
<script>
(function loadNavbar(){
  fetch('/navbar.html',{cache:'no-cache'}).then(r=>r.text()).then(html=>{
    const host=document.getElementById('navbar-placeholder'); host.innerHTML=html;
    // move any inline scripts in navbar into the page
    host.querySelectorAll('script').forEach(s=>{
      const n=document.createElement('script');
      if(s.src){ n.src = s.src; } else { n.textContent = s.textContent; }
      document.body.appendChild(n);
    });
    // mark active link
    document.querySelectorAll('.menu a').forEach(a=>{
      const href=(a.getAttribute('href')||'').toLowerCase();
      if(href.endsWith('articles.html')) a.classList.add('active');
    });
  }).catch(()=>{ /* silently fail if navbar not available */ });
})();
</script>

<main class="container articles-listing">
  <h1>Articles & Insights</h1>
  <p class="lead">Readable, practical notes on hydroponics, Lakadong turmeric, and microgreens.</p>

  <div id="grid" class="grid" role="list" aria-live="polite"></div>
  <div id="fallback" class="empty" style="display:none">No articles yet.</div>
</main>

<footer>© <span id="year"></span> Seechur Agro Private Limited • Human by Chance, Farmer by Choice</footer>

<script>
(function(){
  document.getElementById('year').textContent = new Date().getFullYear();
  const grid = document.getElementById('grid'), fallback = document.getElementById('fallback');

  // fetch root articles.json (build writes this)
  fetch('/articles.json?ver=1', {cache:'no-cache'}).then(r=>{
    if(!r.ok) throw r.status;
    return r.json();
  }).then(list=>{
    if(!Array.isArray(list) || !list.length){ fallback.style.display='block'; return; }
    // sort newest first (defensive)
    list.sort((a,b)=> (new Date(b.date)) - (new Date(a.date)));

    const frag = document.createDocumentFragment();
    list.forEach(item=>{
      const url = item.url || '#';
      const img = item.image || '';
      const cat = item.category || '';
      const date = item.date ? (new Date(item.date)).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '';
      const title = item.title || '';
      const ex = item.excerpt || '';

      const a = document.createElement('a');
      a.className = 'card';
      a.href = url;
      a.setAttribute('aria-label', title);

      const t = document.createElement('div'); t.className='thumb';
      if(img){
        const im = document.createElement('img'); im.loading='lazy'; im.alt = title || 'Article image';
        im.src = (img.startsWith('/') || img.startsWith('http')) ? img : '/' + img;
        im.onerror = ()=> t.remove();
        t.appendChild(im);
      }
      a.appendChild(t);

      const b = document.createElement('div'); b.className='body';
      const m = document.createElement('div'); m.className='meta'; m.textContent = [cat, date].filter(Boolean).join(' • ');
      const ti = document.createElement('div'); ti.className='title'; ti.textContent = title;
      const exd = document.createElement('div'); exd.className='excerpt'; exd.textContent = ex;

      b.appendChild(m); b.appendChild(ti); b.appendChild(exd);
      a.appendChild(b);

      frag.appendChild(a);
    });

    grid.innerHTML=''; grid.appendChild(frag);
  }).catch(err=>{
    console.warn('articles fetch failed', err);
    fallback.style.display='block';
  });
})();
</script>
</body>
</html>
