<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Articles • Seechur Agro Private Limited</title>
<meta name="description" content="Insights on hydroponics, Lakadong turmeric, microgreens, and sustainable farming from Seechur Agro." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css"/>
</head>
<body>

<div id="navbar-placeholder"></div>
<script>
(function loadNavbar(){
  fetch('/navbar.html',{cache:'no-cache'}).then(r=>r.text()).then(html=>{
    const host=document.getElementById('navbar-placeholder'); host.innerHTML=html;
    host.querySelectorAll('script').forEach(s=>{ const n=document.createElement('script'); if(s.src){ n.src=s.src } else { n.textContent=s.textContent } document.body.appendChild(n); });
    document.querySelectorAll('.menu a').forEach(a=>{ const href=(a.getAttribute('href')||'').toLowerCase(); if(href.endsWith('articles.html')) a.classList.add('active'); });
  }).catch(()=>{/* ignore */});
})();
</script>

<main class="container">
  <h1>Articles & Insights</h1>
  <p class="lead">Readable, practical notes on hydroponics, Lakadong turmeric, and microgreens.</p>

  <div id="grid" class="grid" role="list" aria-live="polite"></div>
  <div id="fallback" class="empty" style="display:none">No articles yet.</div>
</main>

<footer>© <span id="year"></span> Seechur Agro Private Limited • Human by Chance, Farmer by Choice</footer>

<script>
(function(){
  // footer year
  const y=document.getElementById('year'); if(y) y.textContent=new Date().getFullYear();

  const grid=document.getElementById('grid'), fallback=document.getElementById('fallback');

  // Helper: ensure leading slash
  function ensureRootPath(path){
    if(!path) return '';
    path = String(path).trim();
    if(path.startsWith('http://') || path.startsWith('https://') || path.startsWith('/')) return path;
    return '/' + path.replace(/^\.\//,'');
  }

  // fetch root-level articles.json (robust to where JSON sits)
  fetch('/articles.json?ts=' + Date.now(), {cache:'no-cache'})
    .then(r => {
      if(!r.ok) return Promise.reject(r.status);
      return r.json();
    })
    .then(list => {
      if(!Array.isArray(list) || !list.length){ fallback.style.display='block'; return; }

      // sort descending by date
      list.sort((a,b)=> new Date(b.date) - new Date(a.date));

      const frag = document.createDocumentFragment();

      list.forEach(item=>{
        // normalize values
        const url   = ensureRootPath(item.url || item.path || ('/articles/' + (item.id || item.slug || '').replace(/^\//,'')));
        const img   = ensureRootPath(item.image || item.thumbnail || '');
        const cat   = item.category || '';
        const date  = item.date ? (new Date(item.date)).toLocaleDateString() : '';
        const title = item.title || '';
        const ex    = item.excerpt || item.subtitle || '';

        const a = document.createElement('a');
        a.className = 'card';
        a.href = url;
        a.setAttribute('aria-label', title);

        // thumbnail wrapper
        const t = document.createElement('div'); t.className='thumb';
        if(img){
          const im = document.createElement('img');
          im.loading='lazy';
          im.alt = title || 'Article image';
          im.src = img;
          im.onerror = ()=>{ t.remove(); };
          t.appendChild(im);
        }
        a.appendChild(t);

        // body
        const b = document.createElement('div'); b.className='body';
        const m = document.createElement('div'); m.className='meta';
        m.textContent = [cat, date].filter(Boolean).join(' • ');
        const ti = document.createElement('div'); ti.className='title'; ti.textContent=title;
        const exd = document.createElement('div'); exd.className='excerpt'; exd.textContent=ex;

        b.appendChild(m); b.appendChild(ti); b.appendChild(exd);
        a.appendChild(b);

        frag.appendChild(a);
      });

      grid.innerHTML='';
      grid.appendChild(frag);
    })
    .catch(err=>{
      console.warn('Failed to load /articles.json:', err);
      fallback.style.display='block';
    });
})();
</script>
</body>
</html>
