name: Post changed article JSONs to X (staging)

# Wrapper: run ONLY when dispatched by the master workflow
on:
  workflow_dispatch:
    inputs:
      json_list:
        description: "JSON file or newline-separated list of JSONs to post"
        required: true

permissions:
  contents: read

concurrency:
  group: post-x-${{ github.ref }}
  cancel-in-progress: false

env:
  # X credentials
  X_API_KEY: ${{ secrets.X_API_KEY }}
  X_API_SECRET: ${{ secrets.X_API_SECRET }}
  X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
  X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

jobs:
  post-x:
    name: X — Post changed article JSONs (staging)
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BASE_URL: "https://seechuragro.in"

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl git
          python3 -m pip install --upgrade pip
          pip install tweepy requests

      - name: Normalize master-supplied JSON list
        id: jsonprep
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.json_list }}"

          # Convert linebreaks safely
          LIST=$(printf "%s" "$RAW" | sed 's/<<NL>>/\n/g')

          if [ -z "$LIST" ]; then
            echo "json_files=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Encode safely
          ENC=$(printf "%s" "$LIST" | sed ':a;N;$!ba;s/\n/<<NL>>/g')
          echo "json_files=$ENC" >> $GITHUB_OUTPUT

      - name: Post each JSON to X (runner script)
        if: steps.jsonprep.outputs.json_files != ''
        run: |
          set -euo pipefail
          RAW="${{ steps.jsonprep.outputs.json_files }}"
          LIST=$(printf "%s" "$RAW" | sed 's/<<NL>>/\n/g')

          for jf in $LIST; do
            if [ ! -f "$jf" ]; then
              echo "Skipping: $jf (not found)"
              continue
            fi

            echo "Posting to X: $jf"
            python3 scripts/send_x.py "$jf"
            echo "--------------------------------"
          done

      - name: No JSONs found notice
        if: steps.jsonprep.outputs.json_files == ''
        run: |
          echo "No JSONs to post to X."
