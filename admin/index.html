<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Seechur Agro — Admin</title>

  <!-- Netlify Identity (for login/invites) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- Decap (Netlify) CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <style>
    /* zero chrome; no overlay at all */
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial}
    body{
      color:#e8fff4;
      background:#0b1a0f url("../hydroponic-bg.jpg?v=31") center/cover no-repeat fixed;
    }
  </style>
</head>
<body>
  <!-- Decap CMS mounts itself; we keep the page empty so nothing blocks it -->

  <script>
    (function () {
      // If the invite arrives as "#invite_token=TOKEN", normalize it to "#/invite/TOKEN"
      if (location.pathname === '/admin/' && /invite_token=/.test(location.hash)) {
        const t = (location.hash.match(/invite_token=([^&]+)/) || [])[1];
        if (t) location.replace('/admin/#/invite/' + t);
      }

      // Handle invite acceptance automatically (for "#/invite/TOKEN")
      function autoAcceptInvite() {
        const h = location.hash || '';
        const m = h.match(/^#\/invite\/([^/?#]+)/);
        const token = m ? decodeURIComponent(m[1]) : null;
        if (!token || typeof netlifyIdentity === 'undefined') return;

        netlifyIdentity.on('init', (user) => {
          if (user) return; // already logged in
          netlifyIdentity.acceptInvite(token)
            .then(() => netlifyIdentity.open('signup'))
            .catch(() => netlifyIdentity.open('login'));
        });
        netlifyIdentity.init();
      }

      // Clear invite hash after successful login so the CMS router is happy
      if (typeof netlifyIdentity !== 'undefined') {
        netlifyIdentity.on('login', () => {
          if (/^#\/invite\//.test(location.hash)) {
            history.replaceState(null, '', '/admin/'); // remove the invite fragment
          }
        });
      }

      // Always initialize Identity (safe to call multiple times)
      if (typeof netlifyIdentity !== 'undefined') {
        netlifyIdentity.init();
      }

      autoAcceptInvite();
    })();
  </script>
</body>
</html>
