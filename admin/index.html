<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seechur Agro — Admin</title>

  <!-- Netlify Identity widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Decap (Netlify) CMS - will auto-load /admin/config.yml -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <style>
    html,body{height:100%}
    body{
      margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      color:#fff; background:#0b1a0f;
      background-image:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.45)),url("../hydroponic-bg.jpg?v=40");
      background-size:cover; background-position:center;
    }
    .shell{max-width:900px;margin:56px auto;padding:0 16px}
    .panel{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);border-radius:16px;box-shadow:0 10px 28px rgba(0,0,0,.45);overflow:hidden}
    .head{display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(0,0,0,.35)}
    .head img{width:36px;height:36px;border-radius:8px;object-fit:cover}
    .body{padding:18px;color:#e8fff4}
    .btn{margin-left:auto;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.12);
         border:1px solid rgba(255,255,255,.2);color:#eafff5;text-decoration:none}
    .btn:hover{background:rgba(255,255,255,.2)}
    #status{margin-top:6px;opacity:.9}
  </style>
</head>
<body>
  <div class="shell">
    <div class="panel">
      <div class="head">
        <img src="../logo.png?v=28" alt="Seechur Agro">
        <div style="font-weight:700">Seechur Agro — Admin</div>
        <a class="btn" id="loginBtn" href="#">Log in</a>
      </div>
      <div class="body">
        <div>If you clicked an invite link and don’t see <b>“Set password”</b>, this page will open the Identity window for you.</div>
        <div id="status"></div>
      </div>
    </div>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const statusEl = $('#status');

    function inviteToken() {
      const h = window.location.hash || '';
      const m = h.match(/#\/invite\/([^/?#]+)/);
      if (m) return m[1];
      const q = new URLSearchParams(location.search);
      return q.get('invite_token');
    }

    $('#loginBtn').addEventListener('click', e => {
      e.preventDefault();
      netlifyIdentity && netlifyIdentity.open('login');
    });

    netlifyIdentity.init();

    netlifyIdentity.on('init', user => {
      const token = inviteToken();

      // If we have an invite link and user isn't logged in, accept it.
      if (token && !user) {
        statusEl.textContent = 'Invite detected. Opening password screen...';

        let fellBack = false;
        const fallback = setTimeout(() => {
          if (!fellBack) {
            fellBack = true;
            statusEl.textContent = 'Could not open password screen automatically. Click “Log in”, then use “Forgot password?” if needed.';
            netlifyIdentity.open('login');
          }
        }, 1500);

        netlifyIdentity.acceptInvite(token)
          .then(() => { if (!fellBack) { clearTimeout(fallback); netlifyIdentity.open('signup'); } })
          .catch(() => {
            if (!fellBack) {
              clearTimeout(fallback);
              statusEl.textContent = 'Invite invalid or already used. Click “Log in” → “Forgot password?” to set a new password.';
              netlifyIdentity.open('login');
            }
          });
      }
    });

    netlifyIdentity.on('login',  () => location.reload());
    netlifyIdentity.on('logout', () => location.reload());
  </script>
</body>
</html>
