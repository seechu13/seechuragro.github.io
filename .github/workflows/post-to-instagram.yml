name: Instagram — Post single article (manual + master safe)

on:
  workflow_dispatch:
    inputs:
      ig_json:
        description: "REQUIRED: Path to social JSON for ONE article"
        required: true

concurrency:
  group: post-to-instagram-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    env:
      GITHUB_REPO: seechu13/seechuragro.github.io
      GITHUB_BRANCH: staging
      PROCESSED_BRANCH: processed-images
      HASHTAG_MAX: "30"
      HASHTAG_MIN_WORD_LEN: "3"
      EXTRA_HASHTAGS: "seechuragro,agriculture"

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Validate JSON
        run: |
          test -f "${{ github.event.inputs.ig_json }}"
          python -m json.tool "${{ github.event.inputs.ig_json }}" > /dev/null

      - name: Normalize hashtags
        run: |
          CLEANED=$(echo "${EXTRA_HASHTAGS}" | sed 's/,/ /g' | sed 's/  */ /g')
          FORMATTED=""
          for t in $CLEANED; do FORMATTED="$FORMATTED #$t"; done
          echo "EXTRA_HASHTAGS=$FORMATTED" >> "$GITHUB_ENV"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Debug env (safe)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "IG_USER_ID set -> ${IG_USER_ID:+YES}"
          echo "IG_ACCESS_TOKEN set -> ${IG_ACCESS_TOKEN:+YES}"
          echo "GITHUB_TOKEN set -> ${GITHUB_TOKEN:+YES}"

      - name: Run Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_POST_JSON: ${{ github.event.inputs.ig_json }}
        run: |
          set -x
          python3 scripts/send_ig.py

      - name: Cleanup
        if: always()
        run: echo done
