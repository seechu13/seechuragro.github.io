name: Post articles to social on merge (staging)

on:
  push:
    branches:
      - staging
    paths:
      - 'articles/**'
      - 'articles.json'
      - 'images/**'
      - 'content/articles/**'

jobs:
  post-to-telegram:
    name: Post changed article to Telegram
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SITE_URL: https://seechuragro.github.io   # adjust if your site has different base URL
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed article JSON
        id: detect
        run: |
          # list files changed in this push
          echo "Getting changed files between $GITHUB_EVENT_BEFORE and $GITHUB_SHA"
          changed_files="$(git diff --name-only $GITHUB_EVENT_BEFORE $GITHUB_SHA || true)"
          echo "Changed files:"
          printf "%s\n" "$changed_files"
          # prefer explicit article JSON inside articles/ or content/articles/ or top-level articles.json
          article_path="$(printf "%s\n" "$changed_files" | grep -E '(^articles/.*\.json$|^content/articles/.*\.json$|^articles.json$)' | head -n1 || true)"
          if [ -z "$article_path" ]; then
            echo "no_article=true" >> "$GITHUB_OUTPUT"
            echo "No article JSON changed. Exiting."
            exit 0
          fi
          echo "article=${article_path}" >> "$GITHUB_OUTPUT"
          echo "Detected article: ${article_path}"

      - name: Read article JSON and prepare post variables
        id: prepare
        run: |
          if [ "${{ steps.detect.outputs.no_article }}" = "true" ]; then
            echo "No article to post, exiting."
            exit 0
          fi

          ARTICLE_FILE="${{ steps.detect.outputs.article }}"
          echo "Reading article file: $ARTICLE_FILE"

          if [ ! -f "$ARTICLE_FILE" ]; then
            echo "::error::Article file not found at path: $ARTICLE_FILE"
            exit 2
          fi

          # Use python to parse the JSON reliably (works for nested or missing keys)
          python - <<'PY' > /tmp/article_parse.json
import json,sys
p = json.load(open(sys.argv[1], encoding='utf-8'))
out = {}
# try common keys
out['title'] = p.get('title') or p.get('name') or ''
summary = p.get('summary') or p.get('description') or p.get('excerpt') or ''
out['summary'] = summary
# possible image fields
img = p.get('image') or p.get('hero_image') or p.get('cover') or p.get('thumbnail') or ''
# normalize image path (strip leading ./)
if isinstance(img,str) and img.startswith('./'):
    img = img[2:]
out['image'] = img or ''
# canonical article url if exists or build from slug/file path
url = p.get('url') or p.get('permalink') or ''
if not url:
    # try to construct from site + file path
    file_path = sys.argv[1]
    # if file is articles/slug.json try to convert
    import os
    name = os.path.splitext(os.path.basename(file_path))[0]
    url = ''
    if name:
        url = ''
out['url'] = url
print(json.dumps(out, ensure_ascii=False))
PY
          python - <<'PY'
