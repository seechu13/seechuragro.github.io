name: Post changed article JSONs to Facebook (staging)

on:
  push:
    branches:
      - staging
    paths:
      - 'assets/articles/**'
      - 'articles/**'
      - 'content/articles/**'

permissions:
  contents: read

concurrency:
  group: post-fb-${{ github.ref }}
  cancel-in-progress: false

# Workflow-level environment (jobs inherit these automatically)
env:
  BASE_URL: "https://seechuragro.in"
  SLEEP_SECONDS: "0"

  # FB credentials — set as repo secrets
  # These values are *secrets* in GitHub; do NOT hardcode here.
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

jobs:
  detect:
    name: Detect changed JSONs
    runs-on: ubuntu-latest
    outputs:
      json_files: ${{ steps.detect.outputs.json_files }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq git

      - id: detect
        name: Detect changed JSONs
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "${GITHUB_SHA}" "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            CHANGED=$(git show --name-only --pretty="" "${GITHUB_SHA}" || true)
          fi
          JSONS=$(printf "%s\n" "$CHANGED" | grep -E '\.json$' || true)
          if [ -z "$JSONS" ]; then
            JSONS=$(git ls-files 'assets/articles/*.json' 'articles/*.json' 'content/articles/*.json' || true)
          fi
          CLEAN=$(printf "%s\n" "$JSONS" | sed '/^\s*$/d' || true)
          if [ -z "$CLEAN" ]; then
            echo "json_files=" >> $GITHUB_OUTPUT
          else
            ENC=$(printf "%s" "$CLEAN" | sed ':a;N;$!ba;s/\n/<<NL>>/g')
            echo "json_files=${ENC}" >> $GITHUB_OUTPUT
          fi

  post-fb:
    name: Facebook — Post changed article JSONs
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.json_files != ''
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl git
          python3 -m pip install --upgrade pip
          pip install requests Pillow

      - name: (Optional) Safety sleep
        run: |
          if [ "${SLEEP_SECONDS}" != "0" ]; then
            echo "Sleeping ${SLEEP_SECONDS}s..."
            sleep "${SLEEP_SECONDS}"
          else
            echo "No safety sleep"
          fi

      - name: Post each JSON to Facebook (runner script)
        env:
          # If you want, you can explicitly expose secrets here too; not required because
          # workflow-level env already sets FB_PAGE_ID and FB_PAGE_ACCESS_TOKEN
          # FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          # FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          BASE_URL: ${{ env.BASE_URL }}
        run: |
          set -euo pipefail
          RAW="${{ needs.detect.outputs.json_files }}"
          LIST=$(printf "%s" "$RAW" | sed 's/<<NL>>/\n/g')
          for jf in $LIST; do
            if [ ! -f "$jf" ]; then
              echo "Skipping missing file: $jf"
              continue
            fi
            echo "Posting to FB: $jf"
            python3 scripts/send_fb.py "$jf"
            echo "--------------------------------"
          done
