name: Generate Instagram + Threads Assets (AUTO)

on:
  # AUTO: ONLY when article HTML is merged into STAGING
  push:
    branches:
      - staging
    paths:
      - "articles/**/*.html"

# 🔒 Prevent multiple Insta jobs from colliding
concurrency:
  group: insta-assets-staging
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    # Extra safety: never run unless staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (staging)
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow beautifulsoup4

      - name: Resolve latest article HTML
        id: article
        run: |
          set -euo pipefail

          ARTICLE=$(git diff --name-only HEAD~1 HEAD | grep '^articles/.*\.html$' | tail -n 1 || true)

          if [ -z "$ARTICLE" ]; then
            echo "❌ No article HTML found"
            exit 1
          fi

          if [ ! -f "$ARTICLE" ]; then
            echo "❌ Article not found: $ARTICLE"
            exit 1
          fi

          echo "Using article: $ARTICLE"
          echo "article=$ARTICLE" >> $GITHUB_OUTPUT

      - name: Generate Insta + Threads assets
        run: |
          set -euo pipefail
          python3 scripts/insta_thread.py "${{ steps.article.outputs.article }}"

      - name: Commit Insta + Threads assets
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Add only Insta + Threads outputs
          git add social/insta threads.json || true

          # If nothing changed, exit cleanly
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Generate Insta + Threads assets"

          # 🔒 Rebase before push to avoid non-fast-forward
          git pull --rebase origin staging

          git push origin staging
