<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seechur Agro — Admin</title>

  <!-- Netlify Identity (must load before Decap) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Tell Decap we will provide the config manually -->
  <script>window.CMS_MANUAL_INIT = true;</script>

  <!-- Decap (Netlify) CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <style>
    html,body{height:100%}
    body{
      margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      color:#fff; background:#0b1a0f;
      background-image: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.45)),
                       url("../hydroponic-bg.jpg?v=34");
      background-size:cover; background-position:center;
    }
    .shell{max-width:900px;margin:56px auto;padding:0 16px}
    .panel{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);
           border-radius:16px; box-shadow:0 10px 28px rgba(0,0,0,.45); overflow:hidden}
    .head{display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(0,0,0,.35)}
    .head img{width:36px;height:36px;border-radius:8px;object-fit:cover}
    .body{padding:18px;color:#e8fff4}
    .btn{margin-left:auto;padding:8px 12px;border-radius:999px;
         background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
         color:#eafff5;text-decoration:none}
    .btn:hover{background:rgba(255,255,255,.2)}
  </style>
</head>
<body>
  <div class="shell">
    <div class="panel">
      <div class="head">
        <img src="../logo.png?v=28" alt="Seechur Agro">
        <div style="font-weight:700">Seechur Agro — Admin</div>
        <a class="btn" id="loginBtn" href="#">Log in</a>
      </div>
      <div class="body" id="msg">
        If you clicked an invite link and don’t see “Set password”, this page will open the Identity window for you.
      </div>
    </div>
  </div>

  <script>
    // Open login popup on click
    function openLogin(){ if (window.netlifyIdentity) netlifyIdentity.open('login'); }
    document.getElementById('loginBtn').addEventListener('click', (e)=>{ e.preventDefault(); openLogin(); });

    // Initialize CMS with inline config
    function initCMS(){
      if (!window.CMS) return;
      CMS.init({
        config: {
          backend: {
            name: 'git-gateway',
            branch: 'main'
            // Do NOT hardcode identity_url or gateway_url; Netlify will use same-origin automatically.
          },
          media_folder: 'images/uploads',
          public_folder: '/images/uploads',
          publish_mode: 'editorial_workflow',
          collections: [
            {
              name: 'articles',
              label: 'Articles',
              folder: 'articles',
              create: true,
              slug: '{{slug}}',
              sort: 'date:desc',
              fields: [
                { label: 'Title', name: 'title', widget: 'string' },
                { label: 'Date', name: 'date', widget: 'datetime' },
                { label: 'Category', name: 'category', widget: 'select',
                  options: ['Hydroponics','Lakadong','Microgreens'] },
                { label: 'Author', name: 'author', widget: 'string',
                  default: 'Seechur Agro — Editorial Team' },
                { label: 'Cover Image', name: 'image', widget: 'image', choose_url: true },
                { label: 'Summary', name: 'excerpt', widget: 'text' },
                { label: 'Body', name: 'body', widget: 'markdown' },
              ],
            },
          ],
        }
      });
    }

    // Identity lifecycle – reload so the editor mounts after auth
    if (window.netlifyIdentity){
      netlifyIdentity.on('login', ()=>window.location.reload());
      netlifyIdentity.on('logout', ()=>window.location.reload());
      netlifyIdentity.init(); // same-origin site: https://gentle-twilight-37079a.netlify.app
    }

    // Decap may load after identity; init when ready
    if (document.readyState === 'complete') initCMS();
    else window.addEventListener('load', initCMS);
  </script>
</body>
</html>
