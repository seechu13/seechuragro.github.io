name: Post article to Telegram (staging)

on:
  push:
    branches: [staging]
    paths:
      - "articles/**"
      - "articles.json"
      - "content/articles/**"
      - "assets/**"
      - "images/**"

env:
  SITE_URL: https://seechuragro.in

jobs:
  telegram:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed article JSON
        id: detect
        run: |
          BEFORE="${GITHUB_EVENT_BEFORE}"
          AFTER="${GITHUB_SHA}"

          if [ -n "$BEFORE" ]; then
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" || true)
          else
            if git rev-parse "${AFTER}^" >/dev/null 2>&1; then
              CHANGED=$(git diff --name-only "${AFTER}^" "$AFTER" || true)
            else
              CHANGED=$(git ls-tree -r --name-only "$AFTER" || true)
            fi
          fi

          echo "$CHANGED"

          FILE=$(echo "$CHANGED" | grep -E 'articles/.*\.json$|articles.json$|content/articles/.*\.json$' | head -n1 || true)

          if [ -z "$FILE" ]; then
            echo "no=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Install jq
        if: steps.detect.outputs.no != 'true'
        run: sudo apt-get install -y jq

      - name: Parse json & build caption
        id: prep
        if: steps.detect.outputs.no != 'true'
        run: |
          F="${{ steps.detect.outputs.file }}"

          TITLE=$(jq -r '.title // ""' "$F")
          EXCERPT=$(jq -r '.excerpt // .summary // .description // ""' "$F")
          IMAGE=$(jq -r '.cover_image // .image // .hero_image // .thumbnail // ""' "$F")
          URL=$(jq -r '.url // ""' "$F")

          [ -z "$URL" ] && URL="${SITE_URL%/}/$(basename "$F" .json).html"

          IMAGE="${IMAGE#./}"

          case "$IMAGE" in
            http*) IMG_URL="$IMAGE" ;;
            "") IMG_URL="" ;;
            *) IMG_URL="${SITE_URL%/}/$IMAGE" ;;
          esac

          TITLE_ESC=$(echo "$TITLE" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          EXCERPT_ESC=$(echo "$EXCERPT" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          CAPTION="<b>$TITLE_ESC</b>"
          [ -n "$EXCERPT_ESC" ] && CAPTION="$CAPTION\n\n<i>$EXCERPT_ESC</i>"
          CAPTION="$CAPTION\n\n$URL"

          echo "caption<<EOF" >> $GITHUB_OUTPUT
          echo "$CAPTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "img=$IMG_URL" >> $GITHUB_OUTPUT

      - name: Telegram send (photo → fallback upload → fallback text)
        if: steps.detect.outputs.no != 'true'
        run: |
          CAPTION="${{ steps.prep.outputs.caption }}"
          IMG="${{ steps.prep.outputs.img }}"
          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"

          POSTED=0

          if [ -n "$IMG" ]; then
            echo "Checking image availability…"
            for i in {1..20}; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "$IMG" || echo 000)
              echo "Try $i: HTTP $CODE"
              [ "$CODE" = "200" ] && break
              sleep 3
            done

            if [ "$CODE" = "200" ]; then
              echo "Sending photo via URL..."
              curl -s -X POST "$API/sendPhoto" \
                -F chat_id="${TELEGRAM_CHAT_ID}" \
                -F photo="$IMG" \
                -F caption="$CAPTION" \
                -F parse_mode=HTML \
                -o resp.json &&
              POSTED=1
            fi

            if [ $POSTED -eq 0 ]; then
              echo "Downloading image for upload..."
              curl -s -L -o /tmp/img.jpg "$IMG" && \
              curl -s -X POST "$API/sendPhoto" \
                -F chat_id="${TELEGRAM_CHAT_ID}" \
                -F photo=@"/tmp/img.jpg" \
                -F caption="$CAPTION" \
                -F parse_mode=HTML \
                -o resp.json &&
              POSTED=1
            fi
          fi

          if [ $POSTED -eq 0 ]; then
            echo "Falling back to text..."
            curl -s -X POST "$API/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="$CAPTION" \
              --data-urlencode parse_mode=HTML \
              -o resp.json
          fi

          echo "--- Telegram API Response ---"
          cat resp.json
