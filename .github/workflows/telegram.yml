name: Telegram - Post on article push

on:
  push:
    paths:
      - "articles/**"
  workflow_dispatch:

jobs:
  telegram-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install requests
        run: python3 -m pip install --upgrade pip && pip3 install requests

      - name: Run article processor
        run: |
          echo "Running process_articles.py"
          export TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          export TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          export BASE_URL="${{ secrets.BASE_URL }}"
          python3 scripts/process_articles.py
