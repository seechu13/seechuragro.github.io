<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Articles • Seechur Agro Private Limited</title>
<meta name="description" content="Insights on hydroponics, Lakadong turmeric, microgreens, and sustainable farming from Seechur Agro." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<!-- use site stylesheet -->
<link href="/assets/style.css" rel="stylesheet">

<style>
  /* page-specific helpers (keeps cards light but page dark like other article pages) */
  :root{
    --text:#f3fff6; --muted:#cfe9d8;
    --nav-bg:rgba(10,25,10,0.7); --nav-solid:#1b4332;
    --glass:rgba(255,255,255,.12); --max:1100px;
    --accent:#2dbb7f; --hover:#33d18f;
    --card-bg:#ffffff; --card-text:#1d2a21; --card-sub:#495a50;
    --card-meta:#0f7a52; --card-border:rgba(5,26,15,.12);
  }

  /* ensure body background uses site dark background (matching article detail pages) */
  body { background-color: var(--dark); color:var(--text); }

  /* set the hero/backdrop so page has the same background image/overlay as articles */
  body::before{
    content:""; position:fixed; inset:0; z-index:-1;
    background:
      linear-gradient(180deg, rgba(0,0,0,.30), rgba(0,0,0,.40)),
      url('/assets/hydroponic-bg.jpg?v=32') center/cover no-repeat;
    filter:saturate(1.05) brightness(.97);
  }

  .container{max-width:var(--max); margin:0 auto; padding:28px 18px 40px;}
  h1{font-size:2.3rem; font-weight:700; margin-bottom:8px; text-shadow:0 2px 8px rgba(0,0,0,.55)}
  p.lead{line-height:1.8; color:var(--muted); margin-bottom:18px;}

  /* keep cards the same white/light style so listing looks like the design */
  .grid{ display:grid; gap:22px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
  a.card{ background:var(--card-bg); color:var(--card-text); border:1px solid var(--card-border); }
  .thumb{ height:190px; background:#f3f7f4; overflow:hidden; }

  /* ensure the main container is transparent so underlying dark background shows through */
  main.container { background: transparent !important; }

  footer{text-align:center; color:#d9ffe6; padding:40px 12px 60px; background:rgba(0,0,0,.4); backdrop-filter:blur(4px); margin-top:30px}
</style>
</head>
<body>

<!-- ✅ Shared navbar include (absolute path so it works from / and /articles/slug.html) -->
<div id="navbar-placeholder"></div>
<script>
(function loadNavbar(){
  // use absolute path so fetching works from any subpath
  fetch('/navbar.html',{cache:'no-cache'}).then(r=>{
    if(!r.ok) throw new Error('navbar fetch failed');
    return r.text();
  }).then(html=>{
    const host=document.getElementById('navbar-placeholder'); host.innerHTML=html;

    // run any inline scripts found inside navbar.html (preserve previous behavior)
    host.querySelectorAll('script').forEach(s=>{
      const n=document.createElement('script');
      if(s.src){
        n.src = s.src;
        if(!/^(https?:|\/)/.test(n.src)){
          n.src = window.location.origin + '/' + s.src.replace(/^\.\//,'');
        }
      } else {
        n.textContent = s.textContent;
      }
      document.body.appendChild(n);
    });

    // highlight Articles in nav robustly
    document.querySelectorAll('.menu a').forEach(a=>{
      const href=(a.getAttribute('href')||'').toLowerCase();
      if(href.endsWith('articles.html') || href.endsWith('/articles') || href.endsWith('/articles.html')) {
        a.classList.add('active');
      }
    });
  }).catch(()=>{/* silent: if navbar missing, page still shows */});
})();
</script>

<main class="container" role="main">
  <h1>Articles & Insights</h1>
  <p class="lead">Readable, practical notes on hydroponics, Lakadong turmeric, and microgreens.</p>

  <div id="grid" class="grid" role="list"></div>
  <div id="fallback" class="empty" style="display:none">No articles yet.</div>
</main>

<footer>© <span id="year"></span> Seechur Agro Private Limited • Human by Chance, Farmer by Choice</footer>

<script>
(function(){
  const y=document.getElementById('year'); if(y) y.textContent=new Date().getFullYear();

  const grid = document.getElementById('grid');
  const fallback = document.getElementById('fallback');

  fetch('/articles.json?ver=3', {cache:'no-cache'})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(list => {
      if(!Array.isArray(list) || !list.length){ fallback.style.display='block'; return; }

      list.sort((a,b)=> String(b.date).localeCompare(String(a.date)));

      const frag = document.createDocumentFragment();
      list.forEach(item=>{
        const url   = item.url   || '#';
        const img   = item.image || '';
        const cat   = item.category || '';
        const date  = item.date || '';
        const title = item.title || '';
        const ex    = item.excerpt || item.subtitle || '';

        const a = document.createElement('a');
        a.className = 'card';
        a.href = (url && url.startsWith('/')) ? url : ('/' + url.replace(/^\//,''));
        a.setAttribute('aria-label', title);

        const t = document.createElement('div'); t.className='thumb';
        if(img){
          const im = document.createElement('img');
          im.loading='lazy';
          im.alt = title || 'Article image';
          im.src = (img.startsWith('/')) ? img : ('/' + img.replace(/^\//,''));
          im.onerror = ()=>{ t.remove(); };
          t.appendChild(im);
        }
        a.appendChild(t);

        const b = document.createElement('div'); b.className='body';
        const m = document.createElement('div'); m.className='meta';
        m.textContent = [cat, date].filter(Boolean).join(' • ');
        const ti = document.createElement('div'); ti.className='title'; ti.textContent=title;
        const exd = document.createElement('div'); exd.className='excerpt'; exd.textContent=ex;

        b.appendChild(m); b.appendChild(ti); b.appendChild(exd);
        a.appendChild(b);

        frag.appendChild(a);
      });

      grid.innerHTML='';
      grid.appendChild(frag);
    })
    .catch(()=>{ fallback.style.display='block'; });
})();
</script>
</body>
</html>
