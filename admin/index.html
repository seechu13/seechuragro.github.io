<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Seechur Agro — Admin</title>

  <!-- Netlify Identity (for login/invites) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Ask Decap to wait; we’ll init so we can show helpful UI if it fails -->
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial}
    body{
      color:#e8fff4;
      background:#0b1a0f url("../hydroponic-bg.jpg?v=31") center/cover no-repeat fixed;
    }
    /* small helper bar so you always have controls visible */
    .helper {
      position: fixed; inset: 16px 16px auto 16px;
      display: inline-flex; gap: 8px; align-items: center;
      background: rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.15);
      border-radius: 12px; padding: 8px 10px; z-index: 9999;
      backdrop-filter: blur(4px);
    }
    .helper b{font-weight:700; margin-right: 6px;}
    .btn {
      appearance: none; border:1px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.12); color:#eafff5;
      padding: 6px 10px; border-radius: 999px; cursor: pointer;
    }
    .btn:hover{background:rgba(255,255,255,.2)}
    .status{opacity:.9; font-size:.9rem}
    .error{color:#ffd6d6}
  </style>
</head>
<body>

  <!-- Tiny helper toolbar -->
  <div class="helper" id="helper">
    <b>Admin</b>
    <button class="btn" id="loginBtn" type="button">Log in</button>
    <button class="btn" id="reloadBtn" type="button">Reload CMS</button>
    <span class="status" id="status">Initializing…</span>
  </div>

  <script>
    (function () {
      // Normalize old invite hash to the modern route the CMS expects
      if (location.pathname === '/admin/' && /invite_token=/.test(location.hash)) {
        const t = (location.hash.match(/invite_token=([^&]+)/) || [])[1];
        if (t) location.replace('/admin/#/invite/' + t);
      }

      // Identity events
      function ensureIdentityInit() {
        if (typeof netlifyIdentity !== 'undefined') {
          netlifyIdentity.init();
          netlifyIdentity.on('login', () => {
            if (/^#\/invite\//.test(location.hash)) {
              history.replaceState(null, '', '/admin/'); // drop invite hash
            }
          });
        }
      }

      // Wire up helper buttons
      const statusEl = document.getElementById('status');
      document.getElementById('loginBtn').onclick = () => {
        if (typeof netlifyIdentity !== 'undefined') netlifyIdentity.open('login');
      };
      document.getElementById('reloadBtn').onclick = () => location.reload();

      // Start Identity
      ensureIdentityInit();

      // Initialize Decap CMS (manual init)
      // It will still read /admin/config.yml from your repo.
      function initCMS() {
        try {
          if (window.CMS && typeof window.CMS.init === 'function') {
            window.CMS.init();
            statusEl.textContent = 'CMS requested…';
          } else {
            statusEl.textContent = 'CMS script not ready yet…';
          }
        } catch (e) {
          statusEl.textContent = 'CMS init error';
          console.error(e);
        }
      }
      initCMS();

      // After a short wait, check if the CMS iframe appeared
      function checkMounted() {
        const iframe = document.querySelector('iframe[src*="decap-cms"]') || document.querySelector('#nc-root, iframe');
        if (iframe) {
          statusEl.textContent = 'CMS loaded.';
          // Optional: hide helper after load; comment this out if you want it always
          // document.getElementById('helper').style.display = 'none';
        } else {
          statusEl.innerHTML = '<span class="error">CMS did not mount. Click “Reload CMS” or “Log in”.</span>';
        }
      }
      // Give the script a moment, then verify
      setTimeout(checkMounted, 1500);
    })();
  </script>
</body>
</html>
