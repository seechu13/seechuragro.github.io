name: Master — validate + dispatch (auto + manual)

on:
  workflow_dispatch:
    inputs:
      json_path:
        description: "Manual: Path to one article file (HTML or JSON)"
        required: false

  push:
    paths:
      - 'articles/**/*.html'
      - 'articles/**/*.json'
      - 'articles.json'

permissions:
  contents: write
  actions: write

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.REPO_PAT }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect article file (auto or manual)
        id: detect
        run: |
          # ---- MANUAL OVERRIDE ----
          if [ -n "${{ github.event.inputs.json_path }}" ]; then
            echo "Using manual input: ${{ github.event.inputs.json_path }}"
            echo "file=${{ github.event.inputs.json_path }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ---- AUTO MODE (push trigger) ----
          FILE=$(git diff --name-only HEAD~1 HEAD \
            | grep -E '^articles/.*\.(html|json)$' \
            | grep -v '^articles\.json$' \
            | head -n 1 || true)

          if [ -z "$FILE" ]; then
            echo "No article file found in git diff"
            exit 1
          fi

          echo "Auto-detected article: $FILE"
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Dispatch platform workflows
        uses: actions/github-script@v6
        env:
          ARTICLE_FILE: ${{ steps.detect.outputs.file }}
        with:
          script: |
            const jf = process.env.ARTICLE_FILE;
            console.log("Dispatching article file:", jf);

            const octokit = github;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.ref.replace("refs/heads/", "");

            // IMPORTANT:
            // These input names match your EXISTING workflows exactly
            const workflows = [
              { file: "telegram.yml",          input: "json_path" },
              { file: "linkedin.yml",          input: "json_path" },
              { file: "post-to-fb.yml",        input: "json_path" },
              { file: "post-to-instagram.yml", input: "ig_json" },
              { file: "post-to-x.yml",         input: "json_list" }
            ];

            for (const wf of workflows) {
              await octokit.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: wf.file,
                ref,
                inputs: { [wf.input]: jf }
              });
              console.log("Dispatched:", wf.file);
            }

            console.log("DONE.");
