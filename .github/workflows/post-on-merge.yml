name: Post changed article JSONs to Telegram (staging)

on:
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  notify-telegram:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl

      - name: Determine changed files in this push
        id: changes
        run: |
          set -euo pipefail

          # Try git diff between this commit and parent to list changed files
          CHANGED=$(git diff --name-only "${GITHUB_SHA}" "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            CHANGED=$(git show --name-only --pretty="" "${GITHUB_SHA}" || true)
          fi

          echo "Raw changed files:"
          echo "$CHANGED"

          # Filter only JSON files
          JSON_FILES=$(printf "%s\n" "$CHANGED" | grep -E '\.json$' || true)

          # If none detected, attempt fallback search in common article folders
          if [ -z "$JSON_FILES" ]; then
            echo "No .json changed files detected by diff. Attempting fallback search in common folders..."
            JSON_FILES=$(git ls-files 'assets/articles/*.json' 'articles/*.json' 'content/articles/*.json' || true)
          fi

          JSON_FILES_CLEAN=$(printf "%s\n" "$JSON_FILES" | sed '/^\s*$/d' || true)

          echo "Detected JSON files:"
          printf "%s\n" "$JSON_FILES_CLEAN"

          # Encode newlines as <<NL>> for step output (safe transport)
          if [ -z "$JSON_FILES_CLEAN" ]; then
            echo "::set-output name=json_files::"
          else
            echo "::set-output name=json_files::$(printf "%s" "$JSON_FILES_CLEAN" | sed ':a;N;$!ba;s/\n/<<NL>>/g')"
          fi

      - name: Post each changed JSON to Telegram (caption sanitizer + image fallback)
        if: steps.changes.outputs.json_files != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          RAW="${{ steps.changes.outputs.json_files }}"
          JSON_FILES=$(printf "%s" "$RAW" | sed 's/<<NL>>/\n/g')

          TELEGRAM_API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          SEND_PHOTO="${TELEGRAM_API}/sendPhoto"
          SEND_MESSAGE="${TELEGRAM_API}/sendMessage"

          collapse_blank_lines() {
            awk 'BEGIN{blank=0} { if (NF==0) { if (!blank) { print ""; blank=1 } } else { print; blank=0 } }'
          }

          for jf in $JSON_FILES; do
            if [ ! -f "$jf" ]; then
              echo "Skipping (not a file): $jf"
              continue
            fi

            echo "Processing JSON: $jf"

            TITLE="$(jq -r '.title // empty' "$jf")"
            EXCERPT="$(jq -r '.excerpt // .description // empty' "$jf")"
            URL="$(jq -r '.url // .link // empty' "$jf")"
            RAW_COVER="$(jq -r '.cover_image // empty' "$jf")"

            echo "Extracted title: ${TITLE:-<none>}"
            echo "Extracted url: ${URL:-<none>}"
            echo "Extracted raw_cover: ${RAW_COVER:-<none>}"

            CAPTURE="$(printf "%s\n\n%s\n\n%s" "$TITLE" "$EXCERPT" "$URL")"

            CLEANED="$(printf "%s" "$CAPTURE" \
              | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' \
              | awk '{ sub(/[[:space:]]+$/, ""); print }' \
              | collapse_blank_lines )"

            CLEANED="$(printf "%s" "$CLEANED" | sed 's/\\n/\n/g')"

            echo "----- CAPTION PREVIEW START -----"
            printf "%s\n" "$CLEANED"
            echo "----- CAPTION PREVIEW END -----"

            # -----------------------
            # Image-finding (normalized)
            # -----------------------
            IMAGE_PATH=""

            if [ -n "$RAW_COVER" ]; then
              # remove site prefix, leading ./ or leading /
              COV="$(printf "%s" "$RAW_COVER" | sed -E 's@^https?://[^/]+@@; s@^\./@@; s@^/@@')"
              echo "Normalized cover image value: '$COV' (from raw '$RAW_COVER')"
            else
              COV=""
            fi

            # If COV contains a folder path, try that first as exact path
            if [ -n "$COV" ]; then
              if [ -f "./${COV}" ]; then
                IMAGE_PATH="./${COV}"
                echo "Found image at exact path: $IMAGE_PATH"
              else
                echo "Exact path ./${COV} not found; will try common folders/basenames."
              fi
            fi

            # If still empty, attempt by basename in common locations
            if [ -z "$IMAGE_PATH" ]; then
              BASENAME_JSON="$(basename "$jf" .json)"
              if [ -n "$COV" ]; then
                SEARCH_NAME="$(basename "$COV")"
              else
                SEARCH_NAME="$BASENAME_JSON"
              fi

              echo "Searching for image basename: $SEARCH_NAME"

              exts="jpg jpeg png webp gif"
              for ext in $exts; do
                CAND="./assets/articles/${SEARCH_NAME}.${ext}"
                if [ -f "$CAND" ]; then IMAGE_PATH="$CAND"; echo "Found by name: $IMAGE_PATH"; break; fi
                CAND="./images/${SEARCH_NAME}.${ext}"
                if [ -f "$CAND" ]; then IMAGE_PATH="$CAND"; echo "Found by name: $IMAGE_PATH"; break; fi
                CAND="./images/uploads/${SEARCH_NAME}.${ext}"
                if [ -f "$CAND" ]; then IMAGE_PATH="$CAND"; echo "Found by name: $IMAGE_PATH"; break; fi
                CAND="./${SEARCH_NAME}.${ext}"
                if [ -f "$CAND" ]; then IMAGE_PATH="$CAND"; echo "Found by name: $IMAGE_PATH"; break; fi
              done

              if [ -z "$IMAGE_PATH" ] && [ -n "$SEARCH_NAME" ]; then
                FOUND=$(git ls-files | grep -E "/${SEARCH_NAME}\.(jpg|jpeg|png|webp|gif)$" || true)
                if [ -n "$FOUND" ]; then
                  IMAGE_PATH="$(printf "%s\n" "$FOUND" | head -n1)"
                  echo "Found image via git ls-files fallback: $IMAGE_PATH"
                fi
              fi
            fi

            # -----------------------
            # Upload attempts
            # -----------------------
            UPLOADED=0

            try_send_local() {
              local file="$1"
              echo "Trying local upload: $file"
              for i in 1 2 3; do
                echo "Local upload attempt #$i"
                RESP=$(curl -sS --show-error --fail --retry 2 --retry-delay 2 \
                  -F chat_id="${TELEGRAM_CHAT_ID}" \
                  -F "photo=@${file}" \
                  -F "caption=${CLEANED}" \
                  -F "parse_mode=HTML" \
                  "${SEND_PHOTO}" || true)
                echo "Response: $RESP"
                if printf "%s" "$RESP" | grep -q '"ok":true'; then
                  echo "Local photo upload OK"
                  return 0
                fi
                sleep 1
              done
              return 1
            }

            try_send_url() {
              local url="$1"
              echo "Trying remote URL upload: $url"
              RESP=$(curl -sS --show-error --fail --data chat_id="${TELEGRAM_CHAT_ID}" \
                --data "photo=${url}" \
                --data "caption=${CLEANED}" \
                --data "parse_mode=HTML" \
                "${SEND_PHOTO}" || true)
              echo "Response: $RESP"
              if printf "%s" "$RESP" | grep -q '"ok":true'; then
                echo "Remote URL photo upload OK"
                return 0
              fi
              return 1
            }

            if [ -n "$IMAGE_PATH" ] && [ -f "$IMAGE_PATH" ]; then
              if try_send_local "$IMAGE_PATH"; then
                UPLOADED=1
              else
                echo "Local upload attempts failed for $IMAGE_PATH"
              fi
            fi

            # If not uploaded and RAW_COVER is an http(s) url, try URL upload
            if [ "$UPLOADED" -eq 0 ] && printf "%s" "$RAW_COVER" | grep -qE '^https?://'; then
              if try_send_url "$RAW_COVER"; then
                UPLOADED=1
              else
                echo "Remote URL upload failed for $RAW_COVER"
              fi
            fi

            # Fallback to text-only
            if [ "$UPLOADED" -eq 0 ]; then
              echo "Falling back to send text-only message."
              RESP=$(curl -sS --show-error --fail --data chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=${CLEANED}" \
                --data "parse_mode=HTML" \
                "${SEND_MESSAGE}" || true)
              echo "Text send response: $RESP"
              if ! printf "%s" "$RESP" | grep -q '"ok":true'; then
                echo "ERROR: Telegram text send failed for $jf"
              fi
            fi

            echo "Done processing $jf"
            echo "--------------------------------------------"
          done

      - name: No changed JSONs found notice
        if: steps.changes.outputs.json_files == ''
        run: |
          echo "No JSON files detected as changed in this push. Nothing to post to Telegram."
