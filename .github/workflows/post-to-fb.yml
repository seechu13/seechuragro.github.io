name: Post changed article JSONs to Facebook (staging)

on:
  push:
    branches:
      - staging
    paths:
      - 'assets/articles/**'
      - 'articles/**'
      - 'content/articles/**'

  workflow_run:
    workflows:
      - "post-on-merge.yml"
    types:
      - completed

permissions:
  contents: read

env:
  UPSTREAM_WORKFLOW_FILE: "post-on-merge.yml"
  MAX_WAIT_SECONDS: "180"
  POLL_INTERVAL: "10"
  PROCEED_IF_UPSTREAM_MISSING: "false"
  SLEEP_SECONDS: "30"

  # secrets mapped to env for the script to use
  FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  SITE_URL_BASE: ${{ secrets.SITE_URL_BASE }}
  ASSETS_PATH: ${{ secrets.ASSETS_PATH }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}

jobs:
  post-fb:
    name: Post to Facebook (staging)
    runs-on: ubuntu-latest

    env:
      # ensure shell steps can access this safely
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system tools, ImageMagick and Python deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl imagemagick git
          convert -version
          python3 -m pip install --upgrade pip
          pip install requests python-dateutil

      - name: If push event, wait for upstream workflow run matching this commit
        if: ${{ github.event_name == 'push' }}
        id: upstream_wait
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          SHA="${GITHUB_SHA}"
          WORKFLOW_FILE="${UPSTREAM_WORKFLOW_FILE}"
          MAX_WAIT=${MAX_WAIT_SECONDS}
          POLL=${POLL_INTERVAL}
          PROCEED=${PROCEED_IF_UPSTREAM_MISSING}
          API_URL="https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?head_sha=${SHA}"

          elapsed=0
          found="false"

          while [ "$elapsed" -le "$MAX_WAIT" ]; do
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              resp=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" "$API_URL")
            else
              resp=$(curl -sS "$API_URL")
            fi

            run_id=$(echo "$resp" | jq -r '.workflow_runs[0].id // empty')

            if [ -n "$run_id" ]; then
              status=$(echo "$resp" | jq -r '.workflow_runs[0].status // empty')
              conclusion=$(echo "$resp" | jq -r '.workflow_runs[0].conclusion // empty')

              if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
                echo "upstream_found=true" >> $GITHUB_OUTPUT
                found="true"
                break
              fi

              if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
                echo "upstream_found=false" >> $GITHUB_OUTPUT
                found="false"
                break
              fi
            fi

            sleep "$POLL"
            elapsed=$((elapsed + POLL))
          done

          if [ "$found" = "false" ]; then
            if [ "$PROCEED" = "true" ]; then
              echo "Proceeding anyway."
            else
              echo "Upstream workflow did not succeed in time."
              exit 1
            fi
          fi

      - name: Safety sleep before posting
        run: |
          echo "Sleeping ${SLEEP_SECONDS}s for safety…"
          sleep ${SLEEP_SECONDS}

      - name: Debug — show files and script
        run: |
          set -x
          echo "Working dir: $(pwd)"
          python3 --version || true
          echo "Contents of scripts/:"
          ls -la scripts || true
          echo "First 120 lines of scripts/publish_fb_insta.py (if present):"
          if [ -f scripts/publish_fb_insta.py ]; then
            sed -n '1,120p' scripts/publish_fb_insta.py || true
            chmod +x scripts/publish_fb_insta.py || true
          else
            echo "scripts/publish_fb_insta.py not found!"
          fi
          echo "List articles/ and assets/:"
          ls -la articles || true
          ls -la assets || true
          set +x

      - name: Detect changed JSONs and run publisher
        id: detect_and_run
        run: |
          set -euo pipefail

          CHANGED=$(git diff --name-only "${GITHUB_SHA}" "${GITHUB_SHA}^" || true)
          if [ -z "$CHANGED" ]; then
            CHANGED=$(git show --name-only --pretty="" "${GITHUB_SHA}" || true)
          fi

          JSONS=$(printf "%s\n" "$CHANGED" | grep -E '\.json$' || true)
          if [ -z "$JSONS" ]; then
            JSONS=$(git ls-files 'assets/articles/*.json' 'articles/*.json' 'content/articles/*.json' || true)
          fi

          CLEAN=$(printf "%s\n" "$JSONS" | sed '/^\s*$/d' || true)

          if [ -z "$CLEAN" ]; then
            echo "No JSON files detected; nothing to post."
            exit 0
          fi

          # iterate files
          printf "%s\n" "$CLEAN" | while read -r jf; do
            [ -z "$jf" ] && continue
            if [ ! -f "$jf" ]; then
              echo "Skipping missing file: $jf"
              continue
            fi
            echo "Publishing file: $jf"
            if [ ! -f "scripts/publish_fb_insta.py" ]; then
              echo "ERROR: publisher script missing at scripts/publish_fb_insta.py"
              exit 12
            fi
            # run unbuffered python for immediate logs
            python3 -u scripts/publish_fb_insta.py "$jf" --mode fb
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "Publisher script exited with code $rc"
              exit $rc
            fi
            echo "Published $jf successfully."
          done

      - name: Complete step
        run: echo "FB publish job finished."
