name: Telegram Post for Articles (staging)

on:
  push:
    branches:
      - staging
    paths:
      - 'articles.html'
      - 'articles/**'
      - 'content/articles/**'
      - 'assets/articles/**'
      - 'article.json'
      - 'src/articles/**'
      - 'public/articles/**'
  workflow_dispatch:  # also allow manual runs for debugging
    inputs:
      file:
        description: 'Optional file path to process (example: content/articles/test-automation.json)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  telegram:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SITE_URL_BASE: ${{ secrets.SITE_URL_BASE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine files to process
        id: files
        run: |
          set -euo pipefail
          # If run manually and user supplied an input 'file', process only that
          if [ -n "${{ github.event.inputs.file || '' }}" ]; then
            echo "Manual run - processing single file: ${{ github.event.inputs.file }}"
            echo "$GITHUB_EVENT_PATH"
            echo "files<<EOF" >> $GITHUB_OUTPUT
            printf "%s\n" "${{ github.event.inputs.file }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Otherwise get changed files from the last commit (push)
          CHANGED="$(git diff --name-only HEAD~1 HEAD || true)"
          echo "Changed files:"
          echo "$CHANGED"

          FILES="$(printf '%s\n' "$CHANGED" | grep -E '^articles/.*\.json$|^content/articles/.*\.json$|^src/articles/.*\.json$|^article\.json$' || true)"
          if [ -z "$FILES" ]; then
            echo "no_files=true" >> $GITHUB_OUTPUT
            echo "No article JSON files to process."
            exit 0
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          printf '%s\n' "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post found articles to Telegram
        if: steps.files.outputs.no_files != 'true'
        run: |
          set -euo pipefail
          echo "Starting Telegram posting for files:"
          printf '%s\n' "${{ steps.files.outputs.files }}"

          sudo apt-get update -y
          sudo apt-get install -y jq curl || true

          # Iterate through newline-separated list
          printf '%b' "${{ steps.files.outputs.files }}" | while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "Processing: $file"
            if [ ! -f "$file" ]; then
              echo "File not found on disk: $file"
              continue
            fi

            title="$(jq -r '.title // .headline // empty' "$file")"
            excerpt="$(jq -r '.excerpt // .summary // empty' "$file")"
            slug="$(jq -r '.slug // empty' "$file")"
            url="$(jq -r '.url // empty' "$file")"
            cover="$(jq -r '.cover_image // .cover // .image // empty' "$file")"

            if [ -z "$url" ] && [ -n "${SITE_URL_BASE:-}" ] && [ -n "$slug" ]; then
              url="${SITE_URL_BASE%/}/$slug"
            fi

            # Ensure non-empty fallbacks
            test -n "$title" || title="New article"
            test -n "$excerpt" || excerpt=""

            # Build caption with real newlines
            caption="${title}

${excerpt}

${url}"

            echo "Caption preview:"
            echo "${caption}" | sed -n '1,6p'

            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              if [ -n "$cover" ]; then
                echo "Sending photo to Telegram: $cover"
                resp=$(curl -s -w "|%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
                  -F chat_id="${TELEGRAM_CHAT_ID}" \
                  -F photo="${cover}" \
                  -F caption="${caption}" \
                  -F parse_mode="HTML" || echo "error|0")
                code=$(echo "$resp" | awk -F'|' '{print $NF}')
                echo "Telegram photo response code: $code"
                echo "Photo response body (truncated):"
                echo "$resp" | sed -E 's/\|[0-9]{3}$//'
              else
                echo "Sending text message to Telegram (JSON payload)"
                json_payload=$(jq -nc --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$caption" '{chat_id:$chat_id, text:$text, parse_mode:"HTML"}')
                resp=$(curl -s -w "|%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -H "Content-Type: application/json" \
                  --data-raw "$json_payload" || echo "error|0")
                code=$(echo "$resp" | awk -F'|' '{print $NF}')
                echo "Telegram message response code: $code"
                echo "Message response body (truncated):"
                echo "$resp" | sed -E 's/\|[0-9]{3}$//'
              fi
            else
              echo "Telegram secrets not set — skipping"
            fi

          done

          echo "Telegram posting finished."
