<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Articles • Seechur Agro Private Limited</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/style.css">

<style>
  :root{
    --text:#f3fff6; --muted:#cfe9d8;
    --glass:rgba(255,255,255,.12);
    --max:1100px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',system-ui,-apple-system,"Segoe UI",Roboto,Arial;color:var(--text);min-height:100vh;}
  body::before{
    content:""; position:fixed; inset:0; z-index:-1;
    background:
      linear-gradient(180deg, rgba(0,0,0,.30), rgba(0,0,0,.40)),
      url('hydroponic-bg.jpg?v=32') center/cover no-repeat;
    filter:saturate(1.05) brightness(.97);
  }

  .container{max-width:var(--max); margin:0 auto; padding:32px 18px;}
  h1{font-size:2.2rem; font-weight:700; margin-bottom:8px; text-shadow:0 2px 8px rgba(0,0,0,.55)}
  p{line-height:1.8; color:var(--muted); margin-bottom:16px;}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin:10px 0 16px}
  .search{flex:1; min-width:220px; display:flex; gap:8px}
  .search input{
    flex:1; padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.25); color:#f3fff6; outline:none;
  }
  .filter{display:flex; gap:8px; align-items:center}
  select{
    padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.25); color:#f3fff6; outline:none;
  }

  .grid{display:grid; gap:20px; grid-template-columns:repeat(auto-fit,minmax(270px,1fr));}
  .card{
    background:var(--glass); border-radius:18px; box-shadow:0 4px 20px rgba(0,0,0,.4); overflow:hidden;
    display:flex; flex-direction:column; opacity:0; transform:translateY(14px); transition:opacity .6s ease, transform .6s ease;
  }
  .card.show{opacity:1; transform:translateY(0);}
  .thumb{height:160px; background:#0b0b0b22; overflow:hidden}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .card .body{padding:14px}
  .meta{font-size:.9rem; color:#dcffe9; opacity:.9; margin-bottom:6px}
  .title{font-weight:700; color:#fff; margin-bottom:6px}
  .excerpt{color:var(--muted); font-size:.95rem}
  .btn{
    margin:12px 14px 16px; align-self:flex-start;
    display:inline-block; padding:8px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.2);
    background:rgba(0,0,0,.25); color:#eafff4; text-decoration:none;
  }
  .btn:hover{transform:translateY(-1px)}
  .empty{opacity:.85; text-align:center; padding:30px 12px}

  /* Modal reader */
  .overlay{position:fixed; inset:0; display:none; place-items:center; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); z-index:70}
  .reader{
    width:min(820px,95vw); max-height:85vh; overflow:auto;
    background:rgba(255,255,255,.12); color:#eafff4; border:1px solid rgba(255,255,255,.22);
    border-radius:18px; box-shadow:0 10px 30px rgba(0,0,0,.5); padding:20px;
  }
  .reader h2{margin:0 0 6px 0}
  .reader .meta{margin:0 0 10px 0}
  .reader img{max-width:100%; height:auto; border-radius:12px; margin:8px 0}
  .close{
    position:absolute; right:16px; top:14px;
    border:1px solid rgba(255,255,255,.3); background:rgba(0,0,0,.25); color:#fff;
    padding:6px 10px; border-radius:10px; cursor:pointer;
  }

  footer{text-align:center; color:#d9ffe6; padding:40px 12px 60px; background:rgba(0,0,0,.4); backdrop-filter:blur(4px)}
</style>
</head>
<body>

<!-- ✅ Shared navbar include -->
<div id="navbar-placeholder"></div>
<script>
  (function loadNavbar(){
    fetch('navbar.html', {cache:'no-cache'})
      .then(r=>r.text())
      .then(html=>{
        const host=document.getElementById('navbar-placeholder');
        host.innerHTML=html;
        host.querySelectorAll('script').forEach(s=>{
          const n=document.createElement('script');
          if(s.src){ n.src=s.src; } else { n.textContent=s.textContent; }
          document.body.appendChild(n);
        });
        const current=(location.pathname.split('/').pop()||'articles.html').toLowerCase();
        document.querySelectorAll('.menu a').forEach(a=>{
          if(a.getAttribute('href')?.toLowerCase()===current){ a.classList.add('active'); }
        });
      });
  })();
</script>

<main class="container">
  <h1>Articles & Insights</h1>
  <p>Notes from our farm, Lakadong turmeric deep-dives, and protected-cultivation best practices.</p>

  <div class="toolbar">
    <div class="search">
      <input id="searchBox" placeholder="Search articles… (e.g., Lakadong, hydroponics, microgreens)">
    </div>
    <div class="filter">
      <label for="topic">Topic</label>
      <select id="topic">
        <option value="">All</option>
        <option>Hydroponics</option>
        <option>Lakadong</option>
        <option>Microgreens</option>
        <option>Markets</option>
      </select>
    </div>
  </div>

  <section class="grid" id="articleGrid"></section>
  <div id="emptyState" class="empty" style="display:none">No articles match your search.</div>
</main>

<!-- Modal Reader -->
<div class="overlay" id="overlay">
  <div class="reader" id="reader">
    <button class="close" id="closeReader">Close</button>
    <h2 id="rTitle"></h2>
    <div class="meta" id="rMeta"></div>
    <div id="rBody"></div>
  </div>
</div>

<footer>
  © <span id="year"></span> Seechur Agro Private Limited • Human by Chance, Farmer by Choice
</footer>

<script>
/* ===== Simple in-page articles DB =====
   To add a new article, duplicate one object below.
   Fields: id, title, topic, date, author, cover, excerpt, html (full content)
*/
const ARTICLES = [
  {
    id:'lakadong-curcumin-basics',
    title:'Lakadong Curcumin — What Buyers Look For',
    topic:'Lakadong',
    date:'2025-10-02',
    author:'Seechur Agro Team',
    cover:'article-lakadong.jpg',
    excerpt:'A quick primer on curcumin testing, curing protocols, and documentation that premium buyers expect.',
    html: `
      <p>Curcumin percentage remains the headline spec for Lakadong turmeric. Accredited lab reports, consistent curing
      (uniform drying to target moisture), and traceable lot IDs are the foundation for premium pricing.</p>
      <ul>
        <li>Batch-level IDs mapped to farm records</li>
        <li>Moisture targets and hygienic curing</li>
        <li>Third-party lab reports (curcumin, residues)</li>
      </ul>
      <img src="lakadong-rhizome.jpg" alt="Lakadong rhizomes">
      <p>We maintain a documentation pack with each lot to streamline export/retail onboarding.</p>
    `
  },
  {
    id:'hydroponic-cucumber-stability',
    title:'Hydroponic Cucumbers: Consistency Beats Peaks',
    topic:'Hydroponics',
    date:'2025-09-18',
    author:'Seechur Agro Team',
    cover:'article-cucumber.jpg',
    excerpt:'Why standardised fertigation and climate bands help you win with modern retail and q-commerce.',
    html: `
      <p>Protected cultivation smooths weekly supply swings, enabling reliable fulfilment for modern retail and q-commerce.
      Standardised EC/PH bands, pruning SOPs, and staggered plantings drive grade consistency.</p>
      <p>We apply a simple “no-surprise” calendar for harvest windows to match buyer plans.</p>
    `
  },
  {
    id:'microgreens-d30-cashflow',
    title:'Microgreens from Day-30: Cash Flow Lever',
    topic:'Microgreens',
    date:'2025-08-05',
    author:'Seechur Agro Team',
    cover:'article-microgreens.jpg',
    excerpt:'How a daily-harvest microgreens line complements longer hydroponic cycles.',
    html: `
      <p>Microgreens are fast-cycle with daily harvest, ideal to start cash flows while refurbishment completes.
      Tray hygiene, cold chain, and SKU discipline keep returns healthy.</p>
      <p>We prioritise mixes aligned to local HoReCa and health-store demand.</p>
    `
  }
];

(function(){
  const y=document.getElementById('year'); if(y) y.textContent=new Date().getFullYear();

  const grid=document.getElementById('articleGrid');
  const empty=document.getElementById('emptyState');
  const q=document.getElementById('searchBox');
  const topic=document.getElementById('topic');

  function render(items){
    grid.innerHTML='';
    if(!items.length){ empty.style.display='block'; return; }
    empty.style.display='none';
    items.forEach(a=>{
      const card=document.createElement('article');
      card.className='card';
      card.innerHTML=`
        <div class="thumb"><img src="${a.cover||'article-cover.jpg'}" alt=""></div>
        <div class="body">
          <div class="meta">${new Date(a.date).toLocaleDateString()} • ${a.topic}</div>
          <div class="title">${a.title}</div>
          <div class="excerpt">${a.excerpt}</div>
        </div>
        <a href="#${a.id}" class="btn" data-id="${a.id}">Read</a>
      `;
      grid.appendChild(card);
      // fade-in
      requestAnimationFrame(()=>card.classList.add('show'));
    });
  }

  function filter(){
    const t=(q.value||'').toLowerCase().trim();
    const k=(topic.value||'').toLowerCase();
    const out = ARTICLES.filter(a=>{
      const matchText = (a.title+' '+a.excerpt+' '+a.topic).toLowerCase().includes(t);
      const matchTopic = !k || a.topic.toLowerCase()===k;
      return matchText && matchTopic;
    }).sort((a,b)=> b.date.localeCompare(a.date));
    render(out);
  }

  q.addEventListener('input', filter);
  topic.addEventListener('change', filter);
  render(ARTICLES.sort((a,b)=> b.date.localeCompare(a.date)));

  // Modal reader
  const overlay=document.getElementById('overlay');
  const rTitle=document.getElementById('rTitle');
  const rMeta=document.getElementById('rMeta');
  const rBody=document.getElementById('rBody');
  const close=document.getElementById('closeReader');

  grid.addEventListener('click', e=>{
    const btn=e.target.closest('a.btn[data-id]');
    if(!btn) return;
    e.preventDefault();
    const id=btn.getAttribute('data-id');
    const art=ARTICLES.find(x=>x.id===id);
    if(!art) return;
    rTitle.textContent=art.title;
    rMeta.textContent=`${new Date(art.date).toLocaleDateString()} • ${art.topic} • ${art.author}`;
    rBody.innerHTML=art.html;
    overlay.style.display='grid';
    document.body.style.overflow='hidden';
  });

  function closeReader(){
    overlay.style.display='none';
    document.body.style.overflow='';
  }
  close.addEventListener('click', closeReader);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeReader(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeReader(); });
})();
</script>
</body>
</html>
