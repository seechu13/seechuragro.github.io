name: Master — validate + dispatch (auto + manual)

on:
  workflow_dispatch:
    inputs:
      json_path:
        description: "Manual: Path to one article JSON"
        required: false

  push:
    paths:
      - 'articles/**/*.json'

permissions:
  contents: write
  actions: write

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.REPO_PAT }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # IMPORTANT: we need 2 commits for git diff

      - name: Detect JSON file (auto or manual)
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.json_path }}" ]; then
            echo "json=${{ github.event.inputs.json_path }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Auto detect JSON changed in this commit
          FILE=$(git diff --name-only HEAD~1 HEAD | grep ".json" | head -n 1 || true)

          if [ -z "$FILE" ]; then
            echo "No JSON file found in git diff"
            exit 1
          fi

          echo "Auto-detected JSON: $FILE"
          echo "json=$FILE" >> $GITHUB_OUTPUT

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Validate JSON + images + dispatch
        uses: actions/github-script@v6
        env:
          JSON_FILE: ${{ steps.detect.outputs.json }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const jf = process.env.JSON_FILE;
            console.log("Using JSON:", jf);

            if (!fs.existsSync(jf)) {
              core.setFailed("JSON not found: " + jf);
              return;
            }

            // Parse JSON
            let j;
            try {
              j = JSON.parse(fs.readFileSync(jf, "utf8"));
            } catch (err) {
              core.setFailed("Invalid JSON: " + err);
              return;
            }

            // Extract image paths
            const imgs = [];
            function walk(o) {
              if (o && typeof o === "object") {
                if (Array.isArray(o)) o.forEach(walk);
                else Object.values(o).forEach(walk);
              } else if (typeof o === "string" && /\.(jpg|jpeg|png|webp)$/i.test(o.trim())) {
                imgs.push(o.trim());
              }
            }
            walk(j);

            const uniq = [...new Set(imgs)];

            // Validate local images
            let missing = false;
            for (const u of uniq) {
              if (/^https?:\/\//i.test(u)) continue;
              const p = path.resolve(u);
              if (!fs.existsSync(p)) {
                missing = true;
                core.error("Missing local image: " + u);
              }
            }

            if (missing) {
              core.setFailed("Missing images.");
              return;
            }

            // Dispatch workflows
            const octokit = github;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.ref.replace("refs/heads/", "");

            const workflows = [
              { file: "telegram.yml",          input: "json_path" },
              { file: "linkedin.yml",          input: "json_path" },
              { file: "post-to-fb.yml",        input: "json_path" },
              { file: "post-to-instagram.yml", input: "ig_json" },
              { file: "post-to-x.yml",         input: "json_list" }
            ];

            for (const wf of workflows) {
              await octokit.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: wf.file,
                ref,
                inputs: { [wf.input]: jf }
              });
              console.log("Dispatched:", wf.file);
            }

            console.log("DONE.");
