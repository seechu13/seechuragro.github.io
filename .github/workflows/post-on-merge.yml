name: Post changed article JSONs to Telegram (staging) — image resize & neutral doc name

on:
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  notify-telegram:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Max width used for resizing (you can tweak)
      MAX_WIDTH: "1280"
      # JPEG quality for resized image
      JPEG_QUALITY: "85"
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools (jq, curl, imagemagick)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl imagemagick

      - name: Determine changed files in this push
        id: changes
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "${GITHUB_SHA}" "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            CHANGED=$(git show --name-only --pretty="" "${GITHUB_SHA}" || true)
          fi
          JSON_FILES=$(printf "%s\n" "$CHANGED" | grep -E '\.json$' || true)
          if [ -z "$JSON_FILES" ]; then
            JSON_FILES=$(git ls-files 'assets/articles/*.json' 'articles/*.json' 'content/articles/*.json' || true)
          fi
          JSON_FILES_CLEAN=$(printf "%s\n" "$JSON_FILES" | sed '/^\s*$/d' || true)
          if [ -z "$JSON_FILES_CLEAN" ]; then
            echo "::set-output name=json_files::"
          else
            echo "::set-output name=json_files::$(printf "%s" "$JSON_FILES_CLEAN" | sed ':a;N;$!ba;s/\n/<<NL>>/g')"
          fi

      - name: Post each changed JSON to Telegram (resize image, neutral doc name fallback)
        if: steps.changes.outputs.json_files != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_WIDTH: ${{ env.MAX_WIDTH }}
          JPEG_QUALITY: ${{ env.JPEG_QUALITY }}
        run: |
          set -euo pipefail

          RAW="${{ steps.changes.outputs.json_files }}"
          JSON_FILES=$(printf "%s" "$RAW" | sed 's/<<NL>>/\n/g')

          TELEGRAM_API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          SEND_PHOTO="${TELEGRAM_API}/sendPhoto"
          SEND_DOCUMENT="${TELEGRAM_API}/sendDocument"
          SEND_MESSAGE="${TELEGRAM_API}/sendMessage"

          collapse_blank_lines() {
            awk 'BEGIN{blank=0} { if (NF==0) { if (!blank) { print ""; blank=1 } } else { print; blank=0 } }'
          }

          for jf in $JSON_FILES; do
            if [ ! -f "$jf" ]; then
              echo "Skipping (not a file): $jf"
              continue
            fi

            echo "Processing JSON: $jf"

            TITLE="$(jq -r '.title // empty' "$jf")"
            EXCERPT="$(jq -r '.excerpt // .description // empty' "$jf")"
            URL="$(jq -r '.url // .link // empty' "$jf")"
            RAW_COVER="$(jq -r '.cover_image // empty' "$jf")"
            SLUG="$(jq -r '.slug // empty' "$jf")"

            echo "Fields -> title:'${TITLE:-<none>}' url:'${URL:-<none>}' raw_cover:'${RAW_COVER:-<none>}' slug:'${SLUG:-<none>}'"

            # Build caption: Title, blank line, excerpt, blank line, URL (URL is clickable)
            CAPTURE="$(printf "%s\n\n%s\n\n%s" "$TITLE" "$EXCERPT" "$URL")"
            CLEANED="$(printf "%s" "$CAPTURE" \
              | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' \
              | awk '{ sub(/[[:space:]]+$/, ""); print }' \
              | collapse_blank_lines )"
            CLEANED="$(printf "%s" "$CLEANED" | sed 's/\\n/\n/g')"

            echo "----- CAPTION PREVIEW START -----"
            printf "%s\n" "$CLEANED"
            echo "----- CAPTION PREVIEW END -----"

            # -----------------------
            # Image-finding (normalize cover path)
            # -----------------------
            IMAGE_PATH=""

            if [ -n "$RAW_COVER" ]; then
              COV="$(printf "%s" "$RAW_COVER" | sed -E 's@^https?://[^/]+@@; s@^\./@@; s@^/@@')"
              echo "Normalized cover: '$COV'"
            else
              COV=""
            fi

            if [ -n "$COV" ]; then
              if [ -f "./${COV}" ]; then
                IMAGE_PATH="./${COV}"
                echo "Found exact image path: $IMAGE_PATH"
              else
                echo "Exact path ./${COV} not found; will try common locations."
              fi
            fi

            if [ -z "$IMAGE_PATH" ]; then
              BASENAME_JSON="$(basename "$jf" .json)"
              if [ -n "$COV" ]; then
                SEARCH_NAME="$(basename "$COV")"
              else
                SEARCH_NAME="$BASENAME_JSON"
              fi

              echo "Searching for image basename: $SEARCH_NAME"

              exts="jpg jpeg png webp gif"
              for ext in $exts; do
                CAND="./assets/articles/${SEARCH_NAME}.${ext}"
                if [ -f "$CAND" ]; then IMAGE_PATH="$CAND"; echo "Found by name: $IMAGE_PATH"; break; fi
                CAND="./images/${SEARCH_NAME}.${ext}"
                if [ -f "$CAND" ]; then IMAGE_PATH="$CAND"; echo "Found by name: $IMAGE_PATH"; break; fi
                CAND="./images/uploads/${SEARCH_NAME}.${ext}"
                if [ -f "$CAND" ]; then IMAGE_PATH="$CAND"; echo "Found by name: $IMAGE_PATH"; break; fi
                CAND="./${SEARCH_NAME}.${ext}"
                if [ -f "$CAND" ]; then IMAGE_PATH="$CAND"; echo "Found by name: $IMAGE_PATH"; break; fi
              done

              if [ -z "$IMAGE_PATH" ] && [ -n "$SEARCH_NAME" ]; then
                FOUND=$(git ls-files | grep -E "/${SEARCH_NAME}\.(jpg|jpeg|png|webp|gif)$" || true)
                if [ -n "$FOUND" ]; then
                  IMAGE_PATH="$(printf "%s\n" "$FOUND" | head -n1)"
                  echo "Found via git ls-files: $IMAGE_PATH"
                fi
              fi
            fi

            # -----------------------
            # If image found: resize with ImageMagick to MAX_WIDTH while preserving aspect
            # -----------------------
            UPLOADED=0
            TMP_RESIZED=""

            if [ -n "$IMAGE_PATH" ] && [ -f "$IMAGE_PATH" ]; then
              echo "Resizing image for Telegram (max width ${MAX_WIDTH})"
              TMP_RESIZED="$(mktemp --suffix=.jpg)"
              # Resize only if larger than MAX_WIDTH; keep aspect, strip metadata, adjust quality
              convert "$IMAGE_PATH" -resize "${MAX_WIDTH}x>" -strip -quality "${JPEG_QUALITY}" "$TMP_RESIZED" || {
                echo "ImageMagick convert failed; will try uploading original file as fallback"
                TMP_RESIZED=""
              }

              if [ -n "$TMP_RESIZED" ] && [ -f "$TMP_RESIZED" ]; then
                echo "Resized image ready: $TMP_RESIZED (size: $(du -h "$TMP_RESIZED" | cut -f1))"
              else
                echo "No resized file, will attempt upload with original: $IMAGE_PATH"
              fi
            fi

            # -----------------------
            # Upload attempt functions
            # -----------------------
            # Try sendPhoto with file (resized if present)
            try_send_photo_file() {
              local file="$1"
              echo "Attempting sendPhoto for file: $file"
              body=$(mktemp)
              http_code=$(curl -sS -w "%{http_code}" --show-error --fail --retry 2 --retry-delay 2 \
                -F chat_id="${TELEGRAM_CHAT_ID}" \
                -F "photo=@${file}" \
                -F "caption=${CLEANED}" \
                -F "parse_mode=HTML" \
                "${SEND_PHOTO}" -o "$body" 2>/dev/null || true)
              echo "sendPhoto HTTP: $http_code"
              cat "$body" || true
              if [ "$http_code" = "200" ] && grep -q '"ok":true' "$body" 2>/dev/null; then
                rm -f "$body"
                return 0
              fi
              rm -f "$body"
              return 1
            }

            # Try sendDocument but use a neutral filename so original name isn't shown
            try_send_document_neutralname() {
              local file="$1"
              local neutral="image.jpg"
              echo "Attempting sendDocument for file: $file, using neutral filename: $neutral"
              body=$(mktemp)
              # Note: set filename explicitly so Telegram UI shows a neutral name
              http_code=$(curl -sS -w "%{http_code}" --show-error --fail --retry 2 --retry-delay 2 \
                -F chat_id="${TELEGRAM_CHAT_ID}" \
                -F "document=@${file};filename=${neutral}" \
                -F "caption=${CLEANED}" \
                -F "parse_mode=HTML" \
                "${SEND_DOCUMENT}" -o "$body" 2>/dev/null || true)
              echo "sendDocument HTTP: $http_code"
              cat "$body" || true
              if [ "$http_code" = "200" ] && grep -q '"ok":true' "$body" 2>/dev/null; then
                rm -f "$body"
                return 0
              fi
              rm -f "$body"
              return 1
            }

            # Try sendPhoto using resized (preferred) then original
            if [ -n "$TMP_RESIZED" ] && [ -f "$TMP_RESIZED" ]; then
              if try_send_photo_file "$TMP_RESIZED"; then
                UPLOADED=1
              else
                echo "sendPhoto failed with resized image; will try original file with sendPhoto"
              fi
            fi

            if [ "$UPLOADED" -eq 0 ] && [ -n "$IMAGE_PATH" ] && [ -f "$IMAGE_PATH" ]; then
              if try_send_photo_file "$IMAGE_PATH"; then
                UPLOADED=1
              else
                echo "sendPhoto failed with original image; will try sendDocument with neutral name"
              fi
            fi

            # If still not uploaded and RAW_COVER is a URL, try posting by URL
            if [ "$UPLOADED" -eq 0 ] && printf "%s" "$RAW_COVER" | grep -qE '^https?://'; then
              echo "Trying to post image by URL"
              body=$(mktemp)
              http_code=$(curl -sS -w "%{http_code}" --show-error --fail --data chat_id="${TELEGRAM_CHAT_ID}" \
                --data "photo=${RAW_COVER}" \
                --data "caption=${CLEANED}" \
                --data "parse_mode=HTML" \
                "${SEND_PHOTO}" -o "$body" 2>/dev/null || true)
              echo "sendPhoto (URL) HTTP: $http_code"
              cat "$body" || true
              if [ "$http_code" = "200" ] && grep -q '"ok":true' "$body" 2>/dev/null; then
                UPLOADED=1
              fi
              rm -f "$body"
            fi

            # If photo attempts failed, try sendDocument with neutral filename
            if [ "$UPLOADED" -eq 0 ] && [ -n "$IMAGE_PATH" ] && [ -f "$IMAGE_PATH" ]; then
              if try_send_document_neutralname "$TMP_RESIZED" && [ -n "$TMP_RESIZED" ]; then
                UPLOADED=1
              elif try_send_document_neutralname "$IMAGE_PATH"; then
                UPLOADED=1
              else
                echo "All local upload attempts failed (photo+document)."
              fi
            fi

            # Final fallback: send text-only
            if [ "$UPLOADED" -eq 0 ]; then
              echo "Falling back to text-only sendMessage"
              RESP=$(curl -sS --show-error --fail --data chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=${CLEANED}" \
                --data "parse_mode=HTML" \
                "${SEND_MESSAGE}" || true)
              echo "Text send response: $RESP"
              if ! printf "%s" "$RESP" | grep -q '"ok":true'; then
                echo "ERROR: Telegram text send failed for $jf"
              fi
            fi

            # cleanup temp resized file
            if [ -n "$TMP_RESIZED" ] && [ -f "$TMP_RESIZED" ]; then
              rm -f "$TMP_RESIZED"
            fi

            echo "Done processing $jf"
            echo "--------------------------------------------"
          done

      - name: No changed JSONs found notice
        if: steps.changes.outputs.json_files == ''
        run: |
          echo "No JSON files detected as changed in this push. Nothing to post to Telegram."
