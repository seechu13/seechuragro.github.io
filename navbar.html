<!-- navbar.html -->
<nav class="site-nav" id="siteNav" role="navigation" aria-label="Main">
  <div class="nav-inner">
    <a class="brand" href="/" aria-label="Seechur Agro home">
      <!-- absolute path to ensure it resolves from any page -->
      <img src="/logo.png?v=27" alt="Seechur Agro logo">
    </a>

    <!-- Mobile hamburger -->
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mobileMenu" aria-label="Open Menu">
      ☰ Menu
    </button>

    <!-- Menu (drawer on mobile) -->
    <div class="menu" id="mobileMenu" role="navigation" aria-label="Primary">
      <a href="/index.html">Home</a>
      <a href="/about.html">About</a>
      <a href="/why-lakadong.html">Why Lakadong</a>
      <a href="/portfolio.html">Portfolio</a>
      <a href="/market.html">Market</a>
      <a href="/financials.html">Financials</a>
      <a href="/team.html">Team</a>
      <a href="/faq.html">FAQ</a>
      <a href="/advisors.html">Advisors</a>
      <a href="/articles.html">Articles</a>
      <a href="/contact.html">Contact</a>
      <a href="/investor-pack.html">Investor Pack</a>
    </div>
  </div>
</nav>

<!-- overlay -->
<div class="nav-overlay" id="navOverlay" hidden aria-hidden="true"></div>

<style>
  :root{
    --nav-bg: rgba(10,25,10,0.75);
    --nav-solid: #16382d;
    --nav-height: 84px;
  }

  /* navbar container */
  .site-nav{
    position: sticky;
    top: 0;
    z-index: 1100;
    background: var(--nav-bg);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .nav-inner{
    max-width: 1100px;
    margin: 0 auto;
    padding: 10px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    min-height: var(--nav-height);
  }

  /* brand */
  .brand{ display:flex; align-items:center; text-decoration:none; }
  .brand img{
    width: 110px;
    height: auto;
    object-fit: contain;
    display:block;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,.45));
  }

  /* desktop menu */
  .menu{
    margin-left:auto;
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    align-items:center;
  }
  .menu a{
    color:#ffffff;
    text-decoration:none;
    padding:8px 12px;
    border-radius:999px;
    transition: background .18s ease, transform .12s;
    font-weight:600;
    display:inline-block;
    cursor:pointer;
  }
  .menu a:hover{ background: rgba(255,255,255,0.12); transform: translateY(-2px); }
  .menu a.active{ background: rgba(255,255,255,0.14); }

  /* hamburger toggle (hidden desktop) */
  .nav-toggle{
    display:none;
    margin-left:auto;
    border:1px solid rgba(255,255,255,.18);
    background: rgba(0,0,0,.25);
    color:#eafff5;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
    position: relative;
  }

  .nav-overlay{ display:none; }

  /* --------------------
     MOBILE / SMALL SCREENS
     -------------------- */
  @media (max-width: 768px){
    .brand img{ width: 84px; } /* smaller on mobile */

    .nav-toggle{ display:inline-block; z-index: 1304; }

    /* drawer menu: slide from right, pill buttons stacked */
    .menu{
      position: fixed;
      top: 0;
      right: -100%;
      width: min(84%, 360px);
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 26px 18px;
      align-items: center;
      background: var(--nav-solid);
      border-left: 1px solid rgba(255,255,255,.06);
      box-shadow: -8px 0 30px rgba(0,0,0,.45);
      transition: right .28s cubic-bezier(.2,.9,.3,1);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 1302; /* mobile drawer sits above overlay and page */
      pointer-events: auto;
    }

    /* pill style full */
    .menu a{
      width: 86%;
      text-align: center;
      padding: 12px 10px; /* slightly reduced padding to fit more items */
      border: 1px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.03);
      border-radius: 999px;
      color: #eaf7ef;
      font-size: 1.0rem; /* slightly smaller for better fit */
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.01);
      line-height:1.2;
    }
    .menu a:hover{ background: rgba(255,255,255,.06); transform:none; }

    /* show drawer when .open */
    .site-nav.open .menu{ right: 0; }

    /* overlay */
    .nav-overlay{
      position: fixed;
      inset: 0;
      z-index: 1300; /* sits below drawer but above page */
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(2px);
      display: none;
      pointer-events: auto;
    }
    .site-nav.open + .nav-overlay{ display: block; }

    /* ensure brand & toggle remain visible above drawer */
    .site-nav .brand,
    .site-nav .nav-toggle { position: relative; z-index: 1305; }
  }

  /* small tweak for very small screens */
  @media (max-width:420px){
    .menu a{ width:90%; padding:10px 8px; font-size:.95rem; }
  }
</style>

<script>
(function(){
  // Prevent double-init if included multiple times
  if (window.__SEECHUR_NAVBAR_INIT__) return;
  window.__SEECHUR_NAVBAR_INIT__ = true;

  const nav = document.getElementById('siteNav');
  const toggle = document.getElementById('navToggle');
  const overlay = document.getElementById('navOverlay');

  function openMenu(){
    nav.classList.add('open');
    if (toggle) toggle.setAttribute('aria-expanded','true');
    if (overlay){
      overlay.removeAttribute('hidden');
      overlay.style.display = 'block';
      overlay.setAttribute('aria-hidden','false');
    }
    // lock page scroll
    document.body.style.overflow = 'hidden';
  }
  function closeMenu(){
    nav.classList.remove('open');
    if (toggle) toggle.setAttribute('aria-expanded','false');
    if (overlay){
      overlay.setAttribute('hidden','');
      overlay.style.display = 'none';
      overlay.setAttribute('aria-hidden','true');
    }
    document.body.style.overflow = '';
  }

  if (toggle) toggle.addEventListener('click', (e)=> {
    e.preventDefault();
    e.stopPropagation();
    nav.classList.contains('open') ? closeMenu() : openMenu();
  });

  if (overlay) overlay.addEventListener('click', (e)=> {
    e.preventDefault();
    closeMenu();
  });

  document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeMenu(); });

  // Active-link logic: resilient for both site root and /articles/* pages
  const path = (location.pathname || '/').toLowerCase();
  const normalized = (path.endsWith('/') && path.length>1) ? path.slice(0,-1) : path;

  let activeHref = '/index.html';
  if (normalized === '/' || normalized === '/index.html') {
    activeHref = '/index.html';
  } else if (normalized.startsWith('/articles/')) {
    // any article detail -> highlight articles listing
    activeHref = '/articles.html';
  } else {
    const parts = normalized.split('/');
    const last = parts[parts.length-1] || 'index.html';
    // ensure it starts with slash
    activeHref = '/' + last;
  }

  function applyActive(){
    const links = document.querySelectorAll('.menu a');
    links.forEach(a=>{
      const href = (a.getAttribute('href')||'').toLowerCase();
      const norm = href.startsWith('/') ? href : ('/' + href);
      a.classList.toggle('active', norm === activeHref);
    });
  }

  // Run after a short microtask so if content is injected it still works
  setTimeout(applyActive, 10);

  // Observe menu in case CMS rewrites links later
  if (window.MutationObserver){
    const target = document.querySelector('.menu') || document.body;
    const mo = new MutationObserver(applyActive);
    mo.observe(target, { childList:true, subtree:true });
  }

  // ----------------------------
  // PERMANENT MOBILE LINK PATCH
  // Ensures mobile links actually navigate and close the drawer
  // ----------------------------
  (function mobileLinkPatch(){
    if (window.__SEECHUR_NAV_PERM_PATCHED__) return;
    window.__SEECHUR_NAV_PERM_PATCHED__ = true;

    function patchLinks(){
      const menu = document.getElementById('mobileMenu') || document.querySelector('.menu');
      if(!menu) return;
      const anchors = Array.from(menu.querySelectorAll('a'));
      anchors.forEach(orig=>{
        if(orig.__seechurPermPatched) return;
        orig.__seechurPermPatched = true;

        // clone to remove any interfering listeners
        const clone = orig.cloneNode(true);
        clone.removeAttribute('onclick');

        // robust click handler
        clone.addEventListener('click', function(ev){
          // allow modifier-click to open in new tab/window
          if(ev.metaKey || ev.ctrlKey || ev.button === 1) return;
          ev.preventDefault();
          ev.stopPropagation();

          // close overlay & drawer immediately
          const overlayEl = document.getElementById('navOverlay') || document.querySelector('.nav-overlay');
          if(overlayEl){
            overlayEl.setAttribute('hidden','');
            overlayEl.style.display = 'none';
            overlayEl.setAttribute('aria-hidden','true');
          }
          document.getElementById('siteNav')?.classList.remove('open');
          if (document.getElementById('navToggle')) document.getElementById('navToggle').setAttribute('aria-expanded','false');

          // update active state locally for instant feedback
          try{
            document.querySelectorAll('.menu a').forEach(x=> x.classList.remove('active'));
            clone.classList.add('active');
          }catch(e){}

          // allow the UI to update then navigate
          const href = clone.getAttribute('href') || clone.href || '';
          setTimeout(()=> {
            if(!href) return;
            if(href.startsWith('#')) { location.hash = href.slice(1); return; }
            try { window.location.assign(new URL(href, location.href).href); } catch(e) { location.href = href; }
          }, 90);
        }, {passive:false});

        // keyboard accessibility
        clone.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); clone.click(); } });

        orig.replaceWith(clone);
      });
    }

    // run now and watch for CMS rewriting links later
    patchLinks();
    if(window.MutationObserver){
      const target = document.querySelector('.menu') || document.body;
      const mo = new MutationObserver(()=>patchLinks());
      mo.observe(target, { childList:true, subtree:true });
    }
  })();

})();
</script>
