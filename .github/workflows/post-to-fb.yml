name: Post changed article JSONs to Facebook (staging) - minimal strict

on:
  workflow_run:
    workflows:
      - "Post changed article JSONs to X (staging)"
    types:
      - completed

permissions:
  contents: read

env:
  FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  SITE_URL_BASE: ${{ secrets.SITE_URL_BASE }}
  ASSETS_PATH: ${{ secrets.ASSETS_PATH }}

jobs:
  post_fb:
    name: Verify upstream success → Post to Facebook
    runs-on: ubuntu-latest
    env:
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      SITE_URL_BASE: ${{ secrets.SITE_URL_BASE }}
      ASSETS_PATH: ${{ secrets.ASSETS_PATH }}

    steps:
      - name: Show trigger / upstream info
        run: |
          echo "Triggered by workflow_run: ${{ github.event.workflow_run.name }}"
          echo "Upstream conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Upstream head SHA: ${{ github.event.workflow_run.head_sha }}"

      - name: Ensure upstream concluded successfully
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Upstream workflow did not finish with success. Exiting."
            exit 1
          fi
          echo "Upstream workflow succeeded. Proceeding."

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests || true

      - name: Detect changed JSONs and run publisher
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha }}"

          # get changed files for the upstream commit
          CHANGED=$(git show --name-only --pretty="" "$SHA" || true)
          if [ -z "$CHANGED" ]; then
            CHANGED=$(git ls-files 'assets/articles/*.json' 'articles/*.json' 'content/articles/*.json' || true)
          fi

          JSONS=$(printf "%s\n" "$CHANGED" | grep -E '\.json$' || true)
          if [ -z "$JSONS" ]; then
            echo "No JSON files detected; nothing to post."
            exit 0
          fi

          for jf in $JSONS; do
            if [ ! -f "$jf" ]; then
              echo "Skipping missing file: $jf"
              continue
            fi
            echo "Publishing (FB) file: $jf"
            python3 -u scripts/publish_fb_insta.py "$jf" --mode fb
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "Publisher script exited with code $rc"
              exit $rc
            fi
            echo "Published $jf successfully."
          done

      - name: Done
        run: echo "post_fb job completed."
