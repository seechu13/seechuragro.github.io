name: Post to Instagram (auto-processed images — articles/** only)

# ONLY trigger on pushes that change files under articles/
on:
  push:
    paths:
      - 'articles/**'
    # optionally restrict to branch if you want; uncomment and set your branch
    # branches:
    #   - staging

concurrency:
  group: post-to-instagram-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed so the job can commit processed images & update processed_map.json

jobs:
  post:
    name: Post to Instagram
    runs-on: ubuntu-latest
    env:
      # repo & branch used by scripts/send_ig.py (can be overridden)
      GITHUB_REPO: seechu13/seechuragro.github.io
      GITHUB_BRANCH: staging
      # Path to the article JSON to post (defaults to articles/test-automation.json)
      IG_POST_JSON: articles/test-automation.json
      # Hashtag envs (only)
      HASHTAG_MAX: '30'                 # IG limit (30)
      HASHTAG_MIN_WORD_LEN: '3'
      EXTRA_HASHTAGS: 'seechuragro,agriculture'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true   # allow the default GITHUB_TOKEN to be used for commits

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate JSON (fast fail)
        run: |
          if [ -f "${{ env.IG_POST_JSON }}" ]; then
            python -m json.tool "${{ env.IG_POST_JSON }}"
            echo "JSON valid: ${{ env.IG_POST_JSON }}"
          else
            echo "JSON not found at ${{ env.IG_POST_JSON }} — aborting"
            exit 1
          fi

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Configure env (secrets)
        run: |
          echo "Configured runtime env"
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Instagram poster
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Use GITHUB_TOKEN to allow send_ig.py to commit processed images & map
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ env.GITHUB_REPO }}
          GITHUB_BRANCH: ${{ env.GITHUB_BRANCH }}
          IG_POST_JSON: ${{ env.IG_POST_JSON }}
          # Pass hashtag envs down to the script
          HASHTAG_MAX: ${{ env.HASHTAG_MAX }}
          HASHTAG_MIN_WORD_LEN: ${{ env.HASHTAG_MIN_WORD_LEN }}
          EXTRA_HASHTAGS: ${{ env.EXTRA_HASHTAGS }}
        run: |
          set -euo pipefail
          echo "Posting using JSON: $IG_POST_JSON"
          python3 scripts/send_ig.py

      - name: Cleanup (no-op)
        if: always()
        run: echo "done"
