name: Post Article to Socials on Staging Merge (validation only)

on:
  push:
    branches:
      - staging
    paths:
      - 'articles.html'
      - 'articles/**'
      - 'content/articles/**'
      - 'assets/articles/**'
      - 'article.json'
      - 'src/articles/**'
      - 'public/articles/**'

permissions:
  contents: read

jobs:
  validate-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Show last commit and changed files (validation)
        run: |
          echo "Run by: $GITHUB_ACTOR"
          echo "Commit: $GITHUB_SHA"
          echo "Files changed in last commit:"
          git --no-pager diff --name-only HEAD~1 HEAD || true
          echo "End of list."
