name: Instagram — Post single article (manual + master safe)

on:
  workflow_dispatch:
    inputs:
      ig_json:
        description: "REQUIRED: Path to social JSON for ONE article"
        required: true

concurrency:
  group: post-to-instagram-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    env:
      GITHUB_REPO: seechu13/seechuragro.github.io
      GITHUB_BRANCH: staging
      PROCESSED_BRANCH: processed-images
      HASHTAG_MAX: "30"
      HASHTAG_MIN_WORD_LEN: "3"
      EXTRA_HASHTAGS: "seechuragro,agriculture"
      PYTHONUNBUFFERED: "1"   # 🔴 CRITICAL

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Validate JSON
        run: |
          test -f "${{ github.event.inputs.ig_json }}"
          python -m json.tool "${{ github.event.inputs.ig_json }}" > /dev/null

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Debug env (safe)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "IG_USER_ID -> ${IG_USER_ID:+YES}"
          echo "IG_ACCESS_TOKEN -> ${IG_ACCESS_TOKEN:+YES}"
          echo "GITHUB_TOKEN -> ${GITHUB_TOKEN:+YES}"

      - name: Inspect images in JSON
        run: |
          python - <<'PY'
          import json
          p="${{ github.event.inputs.ig_json }}"
          data=json.load(open(p))
          urls=[]
          def walk(x):
              if isinstance(x,dict):
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for i in x: walk(i)
              elif isinstance(x,str) and x.startswith("http"):
                  urls.append(x)
          walk(data)
          for u in urls: print(u)
          print("TOTAL URLS:", len(urls))
          PY

      - name: Run Instagram poster (unbuffered)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          IG_POST_JSON: ${{ github.event.inputs.ig_json }}
        run: |
          set -x
          python3 -u scripts/send_ig.py
          echo "PYTHON EXIT CODE -> $?"

      - name: Cleanup
        if: always()
        run: echo done
