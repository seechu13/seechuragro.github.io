name: Post to Instagram

on:
  push:
    branches: [ "staging" ]
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      json_files: ${{ steps.detect_json.outputs.json_files }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: detect_json
        name: Detect JSON files
        run: |
          FILES=$(find articles posts .github/test-posts -type f -name "*.json" 2>/dev/null | tr '\n' ' ')
          echo "json_files=$FILES" >> $GITHUB_OUTPUT

  post-instagram:
    needs: detect
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      BASE_URL: ${{ secrets.BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        run: |
          [ -n "$IG_USER_ID" ] && echo "IG_USER_ID: PRESENT" || echo "IG_USER_ID: MISSING"
          [ -n "$IG_ACCESS_TOKEN" ] && echo "IG_ACCESS_TOKEN: PRESENT" || echo "IG_ACCESS_TOKEN: MISSING"

      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl
          python3 -m pip install --upgrade pip
          python3 -m pip install requests Pillow

      - name: Process JSON files
        run: |
          for jf in ${{ needs.detect.outputs.json_files }}; do
            echo "--- Processing $jf ---"
            python3 scripts/ig.py "$jf"
          done
