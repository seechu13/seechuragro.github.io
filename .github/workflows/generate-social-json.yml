name: Generate Social JSON (HTML → social_new.json)

on:
  # AUTO: when a new article HTML is merged
  push:
    paths:
      - 'articles/**/*.html'

  # MANUAL: regenerate from any past article
  workflow_dispatch:
    inputs:
      article_path:
        description: "Path to a specific article HTML (e.g. articles/old-article.html)"
        required: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (force staging)
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0


      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Resolve article HTML
        id: article
        run: |
          set -euo pipefail

          if [ -n "${{ github.event.inputs.article_path }}" ]; then
            ARTICLE="${{ github.event.inputs.article_path }}"
          else
            ARTICLE=$(git diff --name-only HEAD~1 HEAD | grep '^articles/.*\.html$' | tail -n 1 || true)
          fi

          if [ -z "$ARTICLE" ]; then
            echo "❌ No article HTML found"
            exit 1
          fi

          if [ ! -f "$ARTICLE" ]; then
            echo "❌ Article not found: $ARTICLE"
            exit 1
          fi

          echo "Using article: $ARTICLE"
          echo "article=$ARTICLE" >> $GITHUB_OUTPUT

      - name: Generate social_new.json
        run: |
          python3 scripts/generate_social_json.py "${{ steps.article.outputs.article }}"

      - name: Commit social_new.json (overwrite)
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add social_new.json

          if git diff --cached --quiet; then
            echo "No changes to social_new.json"
            exit 0
          fi

          git commit -m "Generate social_new.json from article"
          git push
