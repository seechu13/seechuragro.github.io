<!-- navbar.html -->
<nav class="site-nav" id="siteNav">
  <div class="nav-inner">
    <a class="brand" href="/" aria-label="Seechur Agro home">
      <img src="/logo.png?v=30" alt="Seechur Agro logo">
    </a>

    <!-- Mobile hamburger -->
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mobileMenu" aria-label="Open Menu">
      ☰ Menu
    </button>

    <!-- Menu (drawer on mobile) -->
    <div class="menu" id="mobileMenu">
      <a href="/index.html">Home</a>
      <a href="/about.html">About</a>
      <a href="/why-lakadong.html">Why Lakadong</a>
      <a href="/portfolio.html">Portfolio</a>
      <a href="/market.html">Market</a>
      <a href="/financials.html">Financials</a>
      <a href="/team.html">Team</a>
      <a href="/faq.html">FAQ</a>
      <a href="/advisors.html">Advisors</a>
      <a href="/articles.html">Articles</a>
      <a href="/contact.html">Contact</a>
      <a href="/investor-pack.html">Investor Pack</a>
    </div>
  </div>
</nav>

<div class="nav-overlay" id="navOverlay" hidden></div>

<style>
  :root{
    --nav-bg:rgba(10,25,10,0.7); /* desktop transparent */
    --nav-solid:#1b4332;         /* mobile drawer solid */
  }

  .site-nav{
    position:sticky; top:0; z-index:1000;
    background:var(--nav-bg);
    backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(255,255,255,.12);
  }

  .nav-inner{
    max-width:1100px;
    margin:0 auto;
    padding:10px 18px;
    display:flex;
    align-items:center;
    gap:18px;
  }

  /* =============================
     BRAND (LOGO) — GOLDEN RULE
     UNIFORM SIZE ON ALL PAGES
     ============================= */
  .brand img{
    width:110px !important;
    height:auto !important;
    object-fit:contain;
    display:block;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.45));
  }

  .menu{
    margin-left:auto;
    display:flex;
    gap:16px;
    flex-wrap:wrap;
  }

  .menu a{
    color:#ffffff;
    text-decoration:none;
    padding:6px 10px;
    border-radius:999px;
    transition:.25s;
  }

  .menu a:hover,
  .menu a.active{
    background:rgba(255,255,255,0.18);
  }

  /* hamburger (hidden on desktop) */
  .nav-toggle{
    display:none;
    margin-left:auto;
    border:1px solid rgba(255,255,255,.28);
    background:rgba(0,0,0,.25);
    color:#eafff5;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
  }

  .nav-overlay{ display:none; }

  /* =============================
     MOBILE LAYOUT
     ============================= */
  @media (max-width:768px){
    .brand img{width:84px !important;}

    .nav-toggle{display:inline-block;}

    .menu{
      position:fixed; top:0; right:-80%;
      width:80%; height:100vh;
      margin:0;
      display:flex; flex-direction:column; gap:8px;
      padding:18px;
      background:var(--nav-solid);
      border-left:1px solid rgba(255,255,255,.18);
      box-shadow:-10px 0 24px rgba(0,0,0,.45);
      transition:right .28s ease-in-out;
    }

    .menu a{
      padding:12px 14px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.06);
    }

    .site-nav.open .menu{ right:0; }

    .nav-overlay{
      position:fixed; inset:0; z-index:999;
      background:rgba(0,0,0,.55);
      backdrop-filter:blur(2px);
    }

    .site-nav.open + .nav-overlay{ display:block; }
  }
</style>

<script>
(function(){
  if (window.__SEECHUR_NAVBAR_INIT__) return;
  window.__SEECHUR_NAVBAR_INIT__ = true;

  const nav = document.getElementById('siteNav');
  const toggle = document.getElementById('navToggle');
  const overlay = document.getElementById('navOverlay');

  function openMenu(){
    nav.classList.add('open');
    toggle.setAttribute('aria-expanded','true');
    overlay.removeAttribute('hidden');
    document.body.style.overflow='hidden';
  }

  function closeMenu(){
    nav.classList.remove('open');
    toggle.setAttribute('aria-expanded','false');
    overlay.setAttribute('hidden','');
    document.body.style.overflow='';
  }

  toggle.addEventListener('click', ()=>(
    nav.classList.contains('open') ? closeMenu() : openMenu()
  ));

  overlay.addEventListener('click', closeMenu);

  document.addEventListener('keydown', e=>{
    if(e.key==='Escape') closeMenu();
  });

  /* ==================================
     ACTIVE LINK HIGHLIGHT (BULLETPROOF)
     Works for:
     /articles.html
     /articles/slug.html
     /investor-pack.html
     / (index)
     ================================== */

  const path = location.pathname.toLowerCase();
  const normalized = path.endsWith('/') && path.length>1 ? path.slice(0,-1) : path;

  let activeHref = '/index.html';

  if (normalized === '/' || normalized === '/index.html') {
    activeHref = '/index.html';

  } else if (normalized.startsWith('/articles/')) {
    activeHref = '/articles.html';

  } else {
    const parts = normalized.split('/');
    const last = parts[parts.length-1] || 'index.html';
    activeHref = '/' + last;
  }

  function applyActive(){
    document.querySelectorAll('.menu a').forEach(a=>{
      const href = (a.getAttribute('href')||'').toLowerCase();
      const fixed = href.startsWith('/') ? href : '/' + href;
      if (fixed === activeHref) a.classList.add('active');
    });
  }

  applyActive();

  if (window.MutationObserver) {
    new MutationObserver(applyActive)
      .observe(document.querySelector('.menu'), {childList:true, subtree:true});
  }
})();
</script>
