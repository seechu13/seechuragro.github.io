name: Post to Instagram

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  publish-ig:
    name: Publish to Instagram
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID:    ${{ secrets.FB_PAGE_ID }}
      IG_USER_ID:    ${{ secrets.IG_USER_ID }}
      SITE_URL_BASE: ${{ secrets.SITE_URL_BASE }}
      ASSETS_PATH:   ${{ secrets.ASSETS_PATH }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Show env presence (IG)
        run: |
          echo "ENV FB_PAGE_ID=${FB_PAGE_ID}"
          if [ -z "${FB_PAGE_TOKEN}" ]; then echo "[ENV] FB_PAGE_TOKEN present: False"; else echo "[ENV] FB_PAGE_TOKEN present: True"; fi
          if [ -z "${FB_PAGE_ID}" ]; then echo "[ENV] FB_PAGE_ID present: False"; else echo "[ENV] FB_PAGE_ID present: True"; fi
          if [ -z "${IG_USER_ID}" ]; then echo "[ENV] IG_USER_ID present: False"; else echo "[ENV] IG_USER_ID present: True"; fi
          if [ -z "${SITE_URL_BASE}" ]; then echo "[ENV] SITE_URL_BASE present: False"; else echo "[ENV] SITE_URL_BASE present: True"; fi
          if [ -z "${ASSETS_PATH}" ]; then echo "[ENV] ASSETS_PATH present: False"; else echo "[ENV] ASSETS_PATH present: True"; fi

      - name: Run IG publisher
        run: |
          python3 scripts/publish_fb_insta.py articles/test-automation.json --mode ig
