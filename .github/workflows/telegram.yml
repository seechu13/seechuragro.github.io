name: Telegram - Post on article push

on:
  push:
    paths:
      - "articles/**"
  workflow_dispatch:

jobs:
  telegram-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install small deps
        run: |
          python3 -m pip install --upgrade pip
          pip3 install requests

      - name: Show commit & changed files (debug)
        run: |
          echo "COMMIT: ${{ github.sha }}"
          git --no-pager show --name-only --pretty="" ${{ github.sha }} | sed -n '1,200p' || true

      - name: Process changed article JSONs and post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          set -euo pipefail

          # Determine changed JSON files under articles/
          PREV="${{ github.sha }}~1"
          CHANGED=$(git diff --name-only "$PREV" "${{ github.sha }}" 2>/dev/null | grep '^articles/.*\.json$' || true)
          if [ -z "$CHANGED" ]; then
            # fallback: if manual dispatch or unable to diff, use all jsons in articles/
            CHANGED=$(ls -1 articles/*.json 2>/dev/null || true)
          fi

          if [ -z "$CHANGED" ]; then
            echo "No article JSON files found under articles/ - nothing to do."
            exit 0
          fi

          echo "Files to process:"
          echo "$CHANGED"

          # iterate over each changed file
          echo "$CHANGED" | while IFS= read -r jf || [ -n "$jf" ]; do
            jf_trimmed="$(echo "$jf" | tr -d '\r')"
            [ -z "$jf_trimmed" ] && continue
            if [ ! -f "$jf_trimmed" ]; then
              echo "Warning: $jf_trimmed does not exist in workspace - skipping."
              continue
            fi
            echo "---- Processing $jf_trimmed ----"

            # Validate non-HTTP images exist locally (allow http/https)
            python3 - "$jf_trimmed" <<'PY'
import sys, json
from pathlib import Path
jf=sys.argv[1]
data=json.load(open(jf, encoding='utf-8'))
imgs = data.get('images') or data.get('cover_image') or data.get('cover_images') or []
missing=[]
for im in imgs:
    if not isinstance(im, str):
        continue
    s=im.strip()
    if not s:
        continue
    if s.lower().startswith('http://') or s.lower().startswith('https://') or s.startswith('//'):
        continue
    p = Path(s.lstrip('/'))
    if not p.exists():
        missing.append(s)
if missing:
    print("MISSING_IMAGES", missing)
    sys.exit(2)
print("ALL_IMAGES_PRESENT")
PY
            RC=$? || true
            if [ $RC -ne 0 ]; then
              echo "Image validation failed for $jf_trimmed — ensure local images are committed or use absolute URLs. Skipping this file."
              continue
            fi

            # Post to Telegram using your script
            echo "Posting $jf_trimmed to Telegram..."
            python3 scripts/send_telegram.py "$jf_trimmed"
            POST_RC=$? || true
            if [ $POST_RC -ne 0 ]; then
              echo "Telegram post failed for $jf_trimmed (exit $POST_RC)."
              # continue to next file instead of failing entire job
              continue
            fi
            echo "Posted $jf_trimmed successfully."
          done

          echo "All done."
