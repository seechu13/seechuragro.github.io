<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>Podcasts — Seechur Agro</title>
<meta name="description" content="Watch and listen to Seechur Agro podcasts on hydroponics, protected cultivation, and Lakadong turmeric. Available on Spotify and YouTube." />
<link rel="canonical" href="https://seechuragro.in/podcasts.html" />

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Global stylesheet (UNCHANGED) -->
<link rel="stylesheet" href="assets/style.css">

<!-- ================== KEEP YOUR EXISTING INLINE STYLES ================== -->
<style>
  :root{
    --text:#f3fff6; --muted:#cfe9d8;
    --glass:rgba(255,255,255,.12); --max:1100px;
    --pill:#1f7a4d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',system-ui,-apple-system,"Segoe UI",Roboto,Arial;color:var(--text);min-height:100vh;}
  body::before{
    content:""; position:fixed; inset:0; z-index:-1;
    background:
      linear-gradient(180deg, rgba(0,0,0,.30), rgba(0,0,0,.40)),
      url('hydroponic-bg.jpg?v=15') center/cover no-repeat;
    filter:saturate(1.08) brightness(.97);
  }
  .container{max-width:var(--max); margin:0 auto; padding:32px 18px;}
  h1{font-size:2.2rem; font-weight:700; margin-bottom:8px; text-shadow:0 2px 8px rgba(0,0,0,.55)}
  p{line-height:1.8; color:var(--muted); margin-bottom:16px;}
  .card{background:var(--glass); border-radius:18px; box-shadow:0 4px 20px rgba(0,0,0,.4); padding:16px; margin:12px 0}
</style>
<!-- ================== END INLINE STYLES ================== -->
</head>

<body>

<!-- Navbar include (UNCHANGED) -->
<div id="navbar-placeholder"></div>
<script>
(function loadNavbar(){
  fetch('navbar.html',{cache:'no-cache'})
    .then(r=>r.text())
    .then(html=>{
      const host=document.getElementById('navbar-placeholder');
      host.innerHTML=html;
      host.querySelectorAll('script').forEach(oldS=>{
        const s=document.createElement('script');
        if(oldS.src){s.src=oldS.src}else{s.textContent=oldS.textContent}
        document.body.appendChild(s);
      });
    });
})();
</script>

<main class="container">

  <!-- ========== PODCAST PAGE LOCAL STYLES (SAFE) ========== -->
  <style>
    .podcast-episode{margin-top:48px}
    .podcast-episode h2{
      text-align:center;margin-bottom:14px;color:#fff;
      font-size:1.35rem;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis
    }
    .podcast-tiles{
      display:grid;
      grid-template-columns:repeat(2,260px);
      gap:20px;
      justify-content:center
    }
    @media(max-width:640px){
      .podcast-tiles{grid-template-columns:1fr}
    }
    .podcast-tile{text-align:center}
    .podcast-label{font-weight:700;margin-bottom:6px}
    .youtube-frame{
      position:relative;padding-top:56.25%;
      border-radius:8px;overflow:hidden;background:#000
    }
    .youtube-frame iframe{
      position:absolute;inset:0;width:100%;height:100%;border:0
    }
    .spotify-thumb img{
      width:100%;display:block;border-radius:8px
    }
    .podcast-caption{
      margin-top:6px;font-size:.8rem;color:#d7eadf
    }
  </style>

  <h1>Podcasts</h1>
  <p>
    Educational video podcasts from Seechur Agro on hydroponics,
    protected cultivation, spices, and sustainable agriculture.
  </p>

  <div class="card" style="max-width:640px;margin:0 auto;padding:18px">

    <!-- ===== PODCAST LIST RENDER TARGET ===== -->
    <div id="podcast-list"></div>

  </div>

  <!-- ========== PODCAST DATA (EDIT ONLY THIS) ========== -->
  <script type="application/json" id="podcast-data">
  [
    {
      "title": "Cherry Tomato Cultivation in Hydroponic Systems",
      "youtube": "PBEyEC7mfkE",
      "spotify": "https://open.spotify.com/episode/0K6PtF6r0EajHQTL9Ob7fo"
    },
    {
      "title": "Cucumber Cultivation in Grow Bags under Polyhouse",
      "youtube": "hkn7OAx1cOA",
      "spotify": "https://open.spotify.com/episode/6Adk6211z87HMNjTBgSqRi"
    },
    {
      "title": "Glass House Cultivation of Anthurium",
      "youtube": "uoeMjZhzfDA",
      "spotify": "https://open.spotify.com/episode/3rHKlxIdhfJMo3ghY7A5SM"
    },
    {
      "title": "Arugula (Rocket) Cultivation under NFT",
      "youtube": "lqzv2t7J_ek",
      "spotify": "https://open.spotify.com/episode/6Bz3MCzSY61PyUiJa9VQv0"
    }
  ]
  </script>

  <!-- ========== PODCAST RENDER SCRIPT (WRITE ONCE) ========== -->
  <script>
    const data = JSON.parse(
      document.getElementById("podcast-data").textContent
    );
    const list = document.getElementById("podcast-list");

    data.forEach(p => {
      const el = document.createElement("div");
      el.className = "podcast-episode";
      el.innerHTML = `
        <h2>${p.title}</h2>
        <div class="podcast-tiles">

          <div class="podcast-tile">
            <div class="podcast-label">YouTube</div>
            <div class="youtube-frame">
              <iframe src="https://www.youtube.com/embed/${p.youtube}" allowfullscreen></iframe>
            </div>
            <div class="podcast-caption">▶ Click to watch video podcast</div>
          </div>

          <div class="podcast-tile">
            <div class="podcast-label">Spotify</div>
            <a class="spotify-thumb" href="${p.spotify}" target="_blank" rel="noopener noreferrer">
              <img src="https://img.youtube.com/vi/${p.youtube}/hqdefault.jpg" alt="${p.title}">
            </a>
            <div class="podcast-caption">🎧 Click image to open in Spotify app</div>
          </div>

        </div>`;
      list.appendChild(el);
    });
  </script>

</main>

<!-- Footer + year script remain unchanged below -->
</body>
</html>
