      <img src="/logo.png?v=27" alt="Seechur Agro logo" id="navLogo">
    </a>

    <!-- Mobile hamburger -->
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mobileMenu" aria-label="Open Menu">
      ☰ Menu
    </button>

    <!-- Menu (drawer on mobile) -->
    <div class="menu" id="mobileMenu">
      <a href="/index.html">Home</a>
      <a href="/about.html">About</a>
      <a href="/why-lakadong.html">Why Lakadong</a>
      <a href="/portfolio.html">Portfolio</a>
      <a href="/market.html">Market</a>
      <a href="/financials.html">Financials</a>

      <a href="/investor-pack.html">Investor Pack</a>
    </div>
  </div>
</nav>
<div class="nav-overlay" id="navOverlay" hidden></div>

<style>
  :root{
    --nav-bg: rgba(10,25,10,0.72);
    --nav-solid: #1b4332;
    --nav-height: 72px;
  }

  /* Core nav */
  .site-nav{
    position: sticky;
    top: 0;
    z-index: 1000;
    background: var(--nav-bg);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(255,255,255,.08);
  }

  .nav-inner{
    max-width: 1100px;
    margin: 0 auto;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: var(--nav-height);
  }

  .brand{ display:flex; align-items:center; text-decoration:none; }
  /* Force consistent logo size everywhere */
  #navLogo {
    width: 110px;
    height: auto;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.45));
    border-radius: 6px;
    background: rgba(255,255,255,0.03);
    padding: 8px;
  }

  .menu { margin-left:auto; display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
  .menu a{
    color:#ffffff;
    text-decoration:none;
    padding:8px 10px;
    border-radius:999px;
    transition: background .18s, transform .12s;
    font-weight:600;
  }
  .menu a:hover { background: rgba(255,255,255,0.10); transform:translateY(-1px); }
  .menu a.active { background: rgba(255,255,255,0.12); box-shadow: 0 6px 14px rgba(0,0,0,.20); }

  .nav-toggle{
    display:none;
    margin-left:auto;
    border:1px solid rgba(255,255,255,.22);
    background: rgba(0,0,0,.24);
    color:#eafff5;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
  }

  .nav-overlay{ display:none; }

  /* Mobile drawer */
  @media (max-width: 768px){
    .nav-inner { padding: 10px 14px; }
    #navLogo { width: 84px; padding:6px; }
    .nav-toggle{ display:inline-block; }
    .menu{
      position: fixed;
      top: 0;
      right: -100%;
      width: 80%;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 18px;
      background: var(--nav-solid);
      border-left: 1px solid rgba(255,255,255,.08);
      box-shadow: -10px 0 30px rgba(0,0,0,.45);
      transition: right .28s ease-in-out;
      align-items: flex-start;
      overflow-y: auto;
    }
    .menu a { width:100%; padding:12px 14px; border-radius:10px; background: rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.04); }
    .site-nav.open .menu{ right: 0; }
    .nav-overlay{
      position: fixed; inset: 0; z-index: 999;
      background: rgba(0,0,0,.55); backdrop-filter: blur(2px);
    }
    .site-nav.open + .nav-overlay{ display:block; }
  }
</style>

<script>
(function(){
  // Prevent double-init if navbar injected multiple times
  if (window.__SEECHUR_NAVBAR_INIT__) return;
  window.__SEECHUR_NAVBAR_INIT__ = true;

  const nav = document.getElementById('siteNav');
  const toggle = document.getElementById('navToggle');
  const overlay = document.getElementById('navOverlay');

  function openMenu(){
    nav.classList.add('open');
    if (toggle) toggle.setAttribute('aria-expanded','true');
    if (overlay) overlay.removeAttribute('hidden');
    document.body.style.overflow = 'hidden';
  }
  function closeMenu(){
    nav.classList.remove('open');
    if (toggle) toggle.setAttribute('aria-expanded','false');
    if (overlay) overlay.setAttribute('hidden', '');
    document.body.style.overflow = '';
  }

  if (toggle) toggle.addEventListener('click', ()=> nav.classList.contains('open') ? closeMenu() : openMenu());
  if (overlay) overlay.addEventListener('click', closeMenu);
  document.addEventListener('keydown', (e)=> { if (e.key === 'Escape') closeMenu(); });

  // Robust active-link detection:
  // - Treat any URL under /articles/ as Articles listing
  // - Normalize hrefs with or without leading slash
  function normalizeHref(h){
    if(!h) return '';
    h = h.trim().toLowerCase();
    // if the href is just a hash or javascript, return as-is
    if (h.startsWith('http') || h.startsWith('/')) return h;
    return '/' + h;
  }

  function getActivePath(){
    const path = (location.pathname || '/').toLowerCase();
    // remove trailing slash except root
    const normalized = (path.length > 1 && path.endsWith('/')) ? path.slice(0,-1) : path;

    // If we're on any article detail page under /articles/, highlight /articles.html
    if (normalized.startsWith('/articles/')) return '/articles.html';

    // For root or index
    if (normalized === '/' || normalized === '/index.html') return '/index.html';

    // Otherwise use last segment filename
    const parts = normalized.split('/');
    const last = parts[parts.length-1] || 'index.html';
    return '/' + last;
  }

  function applyActive(){
    const active = getActivePath();
    document.querySelectorAll('.menu a').forEach(a=>{
      const href = normalizeHref(a.getAttribute('href') || '');
      // If href is relative like '/about.html' or '/articles.html'
      // compare by ending (handles /index.html and /)
      if (href === active) {
        a.classList.add('active');
      } else {
        a.classList.remove('active');
      }
    });
  }

  // run once navbar DOM is ready
  // if menu is injected dynamically after this script runs, we observe and re-run
  function initActiveWhenReady(){
    applyActive();
    if (window.MutationObserver){
      const target = document.querySelector('.menu') || document.body;
      const mo = new MutationObserver(()=> applyActive());
      mo.observe(target, { childList:true, subtree:true });
    }
  }

  // ensure DOM available
  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initActiveWhenReady);
  } else {
    initActiveWhenReady();
  }

})();
</script>
