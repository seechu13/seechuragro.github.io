name: Manual Generate Social JSON (Existing Articles)

on:
  workflow_dispatch:
    inputs:
      article_path:
        description: "Select an article to regenerate social JSON"
        required: true
        type: choice
        options:
          - articles/aeroponics-farming-the-future-of-high-efficiency-crop-production-20251213-205856.html
          # NOTE: this list will be auto-filled in next step

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (staging)
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Generate social_new.json from selected article
        run: |
          set -euo pipefail
          python3 scripts/generate_social_json.py "${{ github.event.inputs.article_path }}"

      - name: Commit updated social_new.json
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add social_new.json

          if git diff --cached --quiet; then
            echo "No changes to social_new.json"
            exit 0
          fi

          git commit -m "Manual regenerate social_new.json from existing article"
          git push
