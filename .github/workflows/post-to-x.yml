name: Post changed article JSONs to X (staging)

on:
  push:
    branches:
      - staging
    paths:
      - 'assets/articles/**'
      - 'articles/**'
      - 'content/articles/**'

  workflow_run:
    workflows:
      - "Post changed article JSONs to social platforms (staging) — image resize & neutral doc name"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: post-x-${{ github.ref }}
  cancel-in-progress: false

env:
  MAX_WIDTH: "1280"
  JPEG_QUALITY: "85"
  UPSTREAM_WORKFLOW_FILE: "post-on-merge.yml"
  MAX_WAIT_SECONDS: "180"
  POLL_INTERVAL: "10"
  PROCEED_IF_UPSTREAM_MISSING: "false"
  SLEEP_SECONDS: "120"

  X_API_KEY: ${{ secrets.X_API_KEY }}
  X_API_SECRET: ${{ secrets.X_API_SECRET }}
  X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
  X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

jobs:
  post-x:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'staging')

    name: X — Post changed article JSONs (staging)
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl imagemagick git
          python3 -m pip install --upgrade pip
          pip install tweepy Pillow requests

      - name: Wait for upstream workflow (push only)
        if: github.event_name == 'push'
        id: upstream_wait
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          SHA="${GITHUB_SHA}"
          API="https://api.github.com/repos/${REPO}/actions/workflows/${UPSTREAM_WORKFLOW_FILE}/runs?head_sha=${SHA}"

          elapsed=0
          found=false

          while [ "$elapsed" -le "${MAX_WAIT_SECONDS}" ]; do
            resp=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" "$API")
            run_id=$(echo "$resp" | jq -r '.workflow_runs[0].id // empty')

            if [ -n "$run_id" ]; then
              status=$(echo "$resp" | jq -r '.workflow_runs[0].status')
              conclusion=$(echo "$resp" | jq -r '.workflow_runs[0].conclusion')

              if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
                echo "upstream_found=true" >> $GITHUB_OUTPUT
                found=true
                break
              fi

              if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
                echo "upstream_found=false" >> $GITHUB_OUTPUT
                exit 1
              fi
            fi

            sleep "${POLL_INTERVAL}"
            elapsed=$((elapsed + POLL_INTERVAL))
          done

          if [ "$found" = false ] && [ "${PROCEED_IF_UPSTREAM_MISSING}" != "true" ]; then
            echo "Upstream workflow did not complete successfully."
            exit 1
          fi

      - name: Optional safety sleep
        run: |
          if [ "${SLEEP_SECONDS}" != "0" ]; then
            sleep "${SLEEP_SECONDS}"
          fi

      - name: Detect changed JSONs
        id: changes_x
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "${GITHUB_SHA}" "${GITHUB_SHA}^" || true)
          if [ -z "$CHANGED" ]; then
            CHANGED=$(git show --name-only --pretty="" "${GITHUB_SHA}" || true)
          fi
          LIST=$(printf "%s\n" "$CHANGED" | grep -E '\.json$' || true)
          if [ -z "$LIST" ]; then
            LIST=$(git ls-files 'assets/articles/*.json' 'articles/*.json' 'content/articles/*.json' || true)
          fi
          CLEAN=$(printf "%s\n" "$LIST" | sed '/^\s*$/d' || true)
          echo "json_files=$(printf "%s" "$CLEAN" | paste -sd',' -)" >> $GITHUB_OUTPUT

      - name: Post to X
        if: steps.changes_x.outputs.json_files != ''
        run: |
          IFS=',' read -ra FILES <<< "${{ steps.changes_x.outputs.json_files }}"
          for jf in "${FILES[@]}"; do
            echo "Posting $jf"
            python3 scripts/send_x.py "$jf"
            echo "------------------------"
          done

      - name: No JSONs found
        if: steps.changes_x.outputs.json_files == ''
        run: echo "No JSONs to post."
